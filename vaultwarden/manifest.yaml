manifestVersion: 1.0
name: vaultwarden
version: "latest"
icon: icon.svg
tagline:
  de: Selbst gehosteter Passwort-Manager
  en: Self-hosted password manager
description:
  de: Vaultwarden ist eine leichtgewichtige, selbst gehostete Implementierung des Bitwarden-Servers. Verwalte deine Passwörter, Notizen und andere sensible Daten sicher mit PostgreSQL als Backend.
  en: Vaultwarden is a lightweight, self-hosted implementation of the Bitwarden server. Securely manage your passwords, notes and other sensitive data with PostgreSQL as backend.
developer: Vaultwarden
website: https://github.com/dani-garcia/vaultwarden
repository: https://github.com/dani-garcia/vaultwarden
license: AGPL-3.0
categories:
  - productivity
domains:
  - userInput: HOST
    service: vaultwarden
    port: 80
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "ADMIN_TOKEN"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
