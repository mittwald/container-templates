manifestVersion: 1.0
name:
  de: Vaultwarden
  en: Vaultwarden
version: "latest"
type: standalone
tagline:
  de: Selbst gehosteter Passwort-Manager
  en: Self-hosted password manager
description:
  de: Vaultwarden ist eine leichtgewichtige, selbst gehostete Implementierung des Bitwarden-Servers. Verwalte deine Passwörter, Notizen und andere sensible Daten sicher. Dieses Template enthält Vaultwarden mit PostgreSQL.
  en: Vaultwarden is a lightweight, self-hosted implementation of the Bitwarden server. Securely manage your passwords, notes and other sensitive data. This template includes Vaultwarden with PostgreSQL.
developer: Vaultwarden
website: https://github.com/dani-garcia/vaultwarden
repository: https://github.com/dani-garcia/vaultwarden
license:
  name: AGPL-3.0
  link: https://spdx.org/licenses/AGPL-3.0.html
categories:
  - security
domains:
  - userInput: HOST
    service: vaultwarden
    port: 80
    purpose: main
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_TOKEN"
    positionMeta: { step: "common", index: 2 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 12, "format": "password" }'
systemInputs:
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Admin-Bereich
      en: Admin Area
    value: https://${domain.main}/admin
  - key:
      de: Admin Token
      en: Admin Token
    value: ${vaultwarden.env.ADMIN_TOKEN}
