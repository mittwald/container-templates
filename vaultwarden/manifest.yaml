manifestVersion: 1.0
name:
  de: Vaultwarden
  en: Vaultwarden
version: "latest"
type: standalone
tagline:
  de: Selbst gehosteter Passwort-Manager
  en: Self-hosted password manager
description:
  de: |
    **Vaultwarden** ist eine leichtgewichtige, in Rust geschriebene Reimplementierung des Bitwarden-Servers und eine self-hosted Alternative zu gehosteten Passwort-Manager-Diensten wie 1Password, LastPass oder dem kostenpflichtigen Bitwarden-Cloud-Angebot. Vaultwarden ist vollständig kompatibel mit allen offiziellen Bitwarden-Clients, Browser-Erweiterungen und mobilen Apps, sodass bestehende Nutzerinnen und Nutzer ohne Einarbeitungsaufwand wechseln können. Die Anwendung speichert Passwörter, Notizen, Identitäten und Zahlungsdaten verschlüsselt im eigenen Tresor.

    Zentrale Funktionen:

    - Kompatibel mit allen offiziellen Bitwarden-Clients und Browser-Erweiterungen
    - Organisationen und Collections für getrennte Zugriffskontexte im Team
    - Zwei-Faktor-Authentifizierung (TOTP, FIDO2/WebAuthn, E-Mail)
    - Passwort-Generator und Integritätsprüfung für bestehende Einträge
    - Admin-Bereich zur Benutzerverwaltung und Systemkonfiguration
    - Sichere Ende-zu-Ende-Verschlüsselung aller Tresordaten

    Für **Werbe-, Web- und Digitalagenturen** ist Vaultwarden besonders nützlich, wenn Zugangsdaten für Kunden-Systeme, Hosting-Zugänge, API-Keys und Social-Media-Konten zentral und teamübergreifend verwaltet werden müssen. Über Organisationen und Collections lassen sich Zugangsdaten je Kundenprojekt sauber trennen, sodass Mitarbeitende nur auf die für sie relevanten Einträge zugreifen können. Der Admin-Bereich ermöglicht eine kontrollierte Benutzerverwaltung ohne externe Abhängigkeiten.

    Bei mittwald läuft **Vaultwarden** als self-hosted Container in deutschen Rechenzentren; alle Tresordaten sind verschlüsselt gespeichert und verlassen die eigene Infrastruktur nicht, was den Anforderungen der DSGVO entspricht. Dieses Template enthält Vaultwarden mit einer PostgreSQL-Datenbank für die persistente Datenhaltung und ist nach wenigen Konfigurationsschritten sofort nutzbar. Da keine Seat- oder Nutzungslizenzen anfallen, skaliert die Lösung auch für größere Teams wirtschaftlich.
  en: |
    **Vaultwarden** is a lightweight, Rust-based reimplementation of the Bitwarden server and a self-hosted alternative to managed password manager services such as 1Password, LastPass or the paid Bitwarden cloud offering. Vaultwarden is fully compatible with all official Bitwarden clients, browser extensions and mobile applications, allowing existing users to migrate without any learning curve. The application stores passwords, notes, identities and payment details in an encrypted vault.

    Key features:

    - Compatible with all official Bitwarden clients and browser extensions
    - Organisations and collections for separate access contexts within a team
    - Two-factor authentication (TOTP, FIDO2/WebAuthn, e-mail)
    - Password generator and integrity check for existing entries
    - Admin panel for user management and system configuration
    - Secure end-to-end encryption of all vault data

    For **advertising, web and digital agencies**, Vaultwarden is especially useful when credentials for client systems, hosting access, API keys and social media accounts need to be managed centrally across a team. Organisations and collections allow credentials to be cleanly separated per client project, so team members only have access to the entries relevant to their work. The admin panel enables controlled user management without any external dependencies.

    At mittwald, **Vaultwarden** runs as a self-hosted container in German data centres; all vault data is stored in encrypted form and does not leave the agency's own infrastructure, which meets GDPR requirements. This template includes Vaultwarden with a PostgreSQL database for persistent data storage and is ready to use after just a few configuration steps. As there are no seat or usage licences, the solution scales economically even for larger teams.
developer: Vaultwarden
website: https://github.com/dani-garcia/vaultwarden
repository: https://github.com/dani-garcia/vaultwarden
license:
  name: AGPL-3.0
  link: https://spdx.org/licenses/AGPL-3.0.html
categories:
  - security
domains:
  - userInput: HOST
    service: vaultwarden
    port: 80
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_TOKEN"
    label:
      de: Admin Token
      en: Admin Token
    positionMeta: { step: "common", index: 2 }
    format: "password"
    required: true
    validationSchema: '{ "type": "string", "minLength": 12, "format": "password" }'
systemInputs:
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Admin-Bereich
      en: Admin Area
    value: https://${domain.main}/admin
  - key:
      de: Admin Token
      en: Admin Token
    value: ${vaultwarden.env.ADMIN_TOKEN}
