services:
  immich:
    image: ghcr.io/immich-app/immich-server:v2
    ports:
      - "2283:2283"
    environment:
      - TZ=Europe/Berlin
      - DB_HOSTNAME=database
      - DB_USERNAME=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis
    volumes:
      - immich_upload:/data
    depends_on:
      - database
      - redis
  machinelearning:
    image: ghcr.io/immich-app/immich-machine-learning:v2
    environment:
      - TZ=Europe/Berlin
    volumes:
      - immich_model_cache:/cache
  redis:
    image: valkey/valkey:9
  database:
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - immich_pgdata:/var/lib/postgresql
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dumpall -h localhost -U "$POSTGRES_USER" | gzip \
          > /var/lib/postgresql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/postgresql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  immich_upload:
  immich_model_cache:
  immich_pgdata:
