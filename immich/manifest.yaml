manifestVersion: 1.0
name: immich
version: "latest"
icon: icon.svg
tagline:
  de: Selbst gehostete Foto- und Videoverwaltung
  en: Self-hosted photo and video management
description:
  de: Immich ist eine leistungsstarke, selbst gehostete Foto- und Videoverwaltung mit automatischer Gesichtserkennung, Ortsbestimmung, Machine-Learning-basierter Suche und Mobile-Apps. Dieses Template enthält Immich mit PostgreSQL (pgvector), Redis und Machine-Learning-Service.
  en: Immich is a powerful, self-hosted photo and video management solution with automatic face recognition, location mapping, machine-learning-based search and mobile apps. This template includes Immich with PostgreSQL (pgvector), Redis and machine learning service.
developer: Immich
website: https://immich.app
repository: https://github.com/immich-app/immich
license: AGPL-3.0
categories:
  - media
domains:
  - userInput: HOST
    service: immich-server
    port: 2283
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
