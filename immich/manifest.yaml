manifestVersion: 1.0
name:
  de: Immich
  en: Immich
version: "3.x.x"
type: standalone
tagline:
  de: Foto- und Videoverwaltung
  en: Photo and video management
description:
  de: |
    **Immich** ist eine leistungsfähige, self-hosted Foto- und Videoverwaltung und eine Alternative zu Cloud-Angeboten wie Google Photos oder Apple iCloud Photos. Fotos und Videos können über Mobil-Apps automatisch gesichert, im Browser organisiert und innerhalb ausgewählter Alben mit anderen Personen geteilt werden.

    Zentrale Funktionen:

    - Automatische Sicherung von Fotos und Videos über mobile Apps
    - Suche nach Metadaten, Objekten, Orten und erkannten Gesichtern
    - Gemeinsame Alben, Partnerfreigaben und öffentliche Links
    - Zeitleiste, Kartenansicht, Erinnerungen und Unterstützung vieler Medienformate

    Für **Agenturen** bietet Immich eine kontrollierbare Mediathek für interne Bildbestände, Eventmaterial oder die Abstimmung mit Kunden. Projektteams können Aufnahmen zentral sammeln, nach Inhalten durchsuchen und ausgewählte Alben teilen, ohne Originaldateien auf mehrere Consumer-Clouds zu verteilen. Rollen und getrennte Benutzerkonten erleichtern die gemeinsame Nutzung einer Installation.

    Bei mittwald läuft **Immich** als self-hosted Container in deutschen Rechenzentren; hochgeladene Medien und Metadaten bleiben in der eigenen Infrastruktur, was die Einhaltung der DSGVO vereinfacht. Das Template enthält den Immich-Server, den Machine-Learning-Dienst, Valkey und eine für Immich vorbereitete PostgreSQL-Datenbank mit Vektorerweiterungen. Die Datenbank wird über das mittwald Backup-Label gesichert; für die Medien selbst sollte zusätzlich eine unabhängige Backup-Strategie eingeplant werden. Für die Open-Source-Anwendung fallen keine nutzungsabhängigen Lizenzkosten an.
  en: |
    **Immich** is a high-performance, self-hosted photo and video management system and an alternative to cloud products such as Google Photos or Apple iCloud Photos. Mobile applications can back up photos and videos automatically; assets are organised in the browser and selected albums can be shared with other people.

    Key features:

    - Automatic photo and video backup through mobile applications
    - Search by metadata, objects, locations and recognised faces
    - Shared albums, partner sharing and public links
    - Timeline, map, memories and support for many media formats

    For **agencies**, Immich provides a controlled media library for internal assets, event material and client reviews. Project teams collect images centrally, search them by content and share selected albums without distributing original files across consumer clouds. Separate user accounts support collaborative use of one installation.

    At mittwald, **Immich** runs as a self-hosted container in German data centres; uploaded media and metadata remain within the operator's infrastructure, simplifying GDPR compliance. The template includes the Immich server, machine-learning service, Valkey and an Immich-specific PostgreSQL database with vector extensions. The database is protected through the mittwald backup label; a separate backup strategy should also be established for the media files themselves. The open-source application incurs no usage-based licence costs.
developer: Immich
website: https://immich.app
repository: https://github.com/immich-app/immich
license:
  name: AGPL-3.0
  link: https://spdx.org/licenses/AGPL-3.0-only.html
categories:
  - media
domains:
  main:
    userInput: HOST
    service: immich
    port: 2283
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "domain", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Admin-Benutzer manuell einrichten
      en: Set up admin user manually
    content:
      de: Der Admin-Benutzer wird nicht automatisch angelegt. Richte ihn nach der Installation beim ersten Aufruf manuell ein.
      en: The admin user is not created automatically. Set it up manually after installation on the first launch.
