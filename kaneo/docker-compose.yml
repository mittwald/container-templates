services:
  kaneo:
    image: ghcr.io/usekaneo/kaneo:latest
    ports:
      - "5173:5173"
    environment:
      - TZ=Europe/Berlin
      - KANEO_CLIENT_URL=https://${HOST}
      - AUTH_SECRET=${AUTH_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kaneo
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Die erste Registrierung wird bewusst durchgelassen und zum
      # Instanz-Admin befoerdert; danach kommt nur noch herein, wer eine
      # gueltige Einladung hat.
      - DISABLE_REGISTRATION=true
      # Ohne dies koennen sich Gaeste ohne Konto eine Wegwerf-Identitaet
      # anlegen - fuer eine interne Instanz nicht gewuenscht.
      - DISABLE_GUEST_ACCESS=true
      - SMTP_HOST=mail.agenturserver.de
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_REQUIRE_TLS=true
      - SMTP_USER=${MW_DELIVERYBOX_MAIN_USERNAME}
      - SMTP_PASSWORD=${MW_DELIVERYBOX_MAIN_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=kaneo
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/postgresql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { pg_dumpall -h localhost -U "$$POSTGRES_USER" -f "$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  postgres_data:
