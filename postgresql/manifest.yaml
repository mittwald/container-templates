manifestVersion: 1.0
name:
  de: PostgreSQL
  en: PostgreSQL
version: "18.x.x"
type: component
tagline:
  de: Leistungsstarke relationale Open-Source Datenbank
  en: Powerful open-source relational database
description:
  de: |
    **PostgreSQL** ist ein leistungsstarkes, objektrelationales Open-Source-Datenbanksystem und eine self-hosted Alternative zu verwalteten Datenbankdiensten wie AWS RDS, Supabase oder Neon. Mit über 35 Jahren aktiver Entwicklung gilt PostgreSQL als eine der zuverlässigsten relationalen Datenbanken und ist bevorzugte Wahl für anspruchsvolle Webanwendungen, datenintensive APIs und geschäftskritische Systeme.

    Zentrale Funktionen:

    - ACID-konforme Transaktionen für höchste Datenkonsistenz
    - Nativer JSON- und JSONB-Support für flexible Datenmodelle
    - Erweiterungssystem (z. B. PostGIS, pg_vector, pgcrypto)
    - Breite Unterstützung durch gängige Frameworks und ORMs

    Als Datenbank-Komponente bildet **PostgreSQL** das relationale Backend hinter Anwendungen, die **Agenturen** entwickeln oder betreiben. Ob als Persistenzschicht für Headless-CMS-Systeme wie Directus, als Datenbankschicht hinter REST- oder GraphQL-APIs oder als Grundlage individueller Webanwendungen — PostgreSQL lässt sich nahtlos in bestehende Stacks integrieren. Django, Laravel, Rails und Node.js-ORMs werden unterstützt.

    Bei mittwald läuft **PostgreSQL** als self-hosted Container-Komponente in deutschen Rechenzentren; alle Daten verbleiben unter der Kontrolle des Betreibers und werden nicht an externe Dienste weitergegeben — DSGVO-Konformität ist dadurch vereinfacht. Dieses Template enthält PostgreSQL als eigenständige Datenbank-Komponente; Sicherungen erfolgen über das mittwald Backup-Label (`backup.command`) als geplanten Plattform-Prozess — ein gesonderter Cronjob ist nicht erforderlich. Lizenzkosten fallen nicht an.
  en: |
    **PostgreSQL** is a powerful, object-relational open-source database system and a self-hosted alternative to managed services such as AWS RDS, Supabase or Neon. With over 35 years of active development, it is one of the most reliable relational databases, preferred for demanding web applications, data-intensive APIs and business-critical systems.

    Key features:

    - ACID-compliant transactions for maximum data consistency
    - Native JSON and JSONB support for flexible data models
    - Extension system (e.g. PostGIS, pg_vector, pgcrypto)
    - Broad support from popular frameworks and ORMs

    As a database component, **PostgreSQL** provides the relational backend behind applications that **agencies** develop or operate — from headless CMS systems like Directus to REST or GraphQL APIs and bespoke web applications. Broad framework support (Django, Laravel, Rails, Node.js ORMs) makes it the first choice in most technology stacks.

    At mittwald, **PostgreSQL** runs as a self-hosted container component in German data centres; all data remains under the operator's control, simplifying GDPR compliance. This template includes PostgreSQL as a standalone database component; backups run via the mittwald backup label (`backup.command`) as a platform-scheduled process — no separate cron job required. No licence costs apply.
developer: PostgreSQL Global Development Group
website: https://www.postgresql.org
repository: https://github.com/postgres/postgres
license:
  name: PostgreSQL License
  link: https://spdx.org/licenses/PostgreSQL.html
categories:
  - development
userInputs:
  - name: "DATABASE_NAME"
    positionMeta: { step: "common", index: 1 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_USER"
    positionMeta: { step: "common", index: 2 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_PASSWORD"
    positionMeta: { step: "common", index: 3 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 12, "format": "password" }'

help:
  technicalDetails:
  - key:
      de: Hostname
      en: Hostname
    value: ${postgres.hostname}
  - key:
      de: Port
      en: Port
    value: 5432/TCP
  - key:
      de: Datenbank-Name
      en: Database Name
    value: ${postgres.env.POSTGRES_DB}
  - key:
      de: Admin Benutzername
      en: Admin username
    value: ${postgres.env.POSTGRES_USER}
  - key:
      de: Admin Passwort
      en: Admin Password
    value: ${postgres.env.POSTGRES_PASSWORD}
  - key:
      de: Verbindungsstring
      en: Connection string
    value: postgresql://${postgres.env.POSTGRES_USER}:${postgres.env.POSTGRES_PASSWORD}@${postgres.hostname}/${postgres.env.POSTGRES_DB}
