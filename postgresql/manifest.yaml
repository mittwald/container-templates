manifestVersion: 1.0
name:
  de: PostgreSQL
  en: PostgreSQL
version: "18.x.x"
type: component
icon: icon.svg
tagline:
  de: Leistungsstarke relationale Open-Source Datenbank
  en: Powerful open-source relational database
description:
  de: |
    **PostgreSQL** ist ein leistungsstarkes, objektrelationales Open-Source-Datenbanksystem und eine self-hosted Alternative zu verwalteten Datenbankdiensten wie AWS RDS, Supabase oder Neon. Mit über 35 Jahren aktiver Entwicklung gilt PostgreSQL als eine der zuverlässigsten relationalen Datenbanken und ist die bevorzugte Wahl für anspruchsvolle Webanwendungen, datenintensive APIs und geschäftskritische Systeme.

    Zentrale Funktionen:

    - ACID-konforme Transaktionen für höchste Datenkonsistenz
    - Nativer JSON- und JSONB-Support für flexible Datenmodelle
    - Erweiterungssystem (z. B. PostGIS, pg_vector, pgcrypto)
    - Views, Trigger und gespeicherte Prozeduren für komplexe Datenbanklogik
    - Breite Unterstützung durch gängige Frameworks und ORMs
    - Automatische Datenbank-Backups über einen konfigurierten Cronjob

    Als Datenbank-Komponente bildet **PostgreSQL** das relationale Backend hinter vielen Kundenanwendungen, die **Werbe-, Web- und Digitalagenturen** entwickeln oder betreiben. Ob als Persistenzschicht für Headless-CMS-Systeme wie Directus, als Datenbankschicht hinter REST- oder GraphQL-APIs, als Grundlage individueller Webanwendungen oder als Backend für E-Commerce-Lösungen — PostgreSQL lässt sich nahtlos in bestehende Stacks integrieren. Durch breite Framework-Unterstützung, darunter Django, Laravel, Rails und Node.js-ORMs, ist PostgreSQL in den meisten Technologie-Stacks erste Wahl. Erweiterungen wie PostGIS oder pg_vector eröffnen zusätzlich spezialisierte Einsatzmöglichkeiten für Geodaten und KI-Anwendungen.

    Bei mittwald läuft **PostgreSQL** als self-hosted Container-Komponente in deutschen Rechenzentren; alle Daten verbleiben vollständig unter der Kontrolle des Betreibers und werden nicht an externe Dienste weitergegeben. Dieses Template enthält PostgreSQL als eigenständige Datenbank-Komponente mit vorkonfiguriertem Backup-Cronjob, der eine regelmäßige Datensicherung im laufenden Betrieb sicherstellt. Da keine nutzungsabhängigen Lizenzkosten anfallen, lässt sich die Datenbank auch bei wachsendem Datenvolumen und steigenden Abfragezahlen dauerhaft wirtschaftlich betreiben.
  en: |
    **PostgreSQL** is a powerful, object-relational open-source database system and a self-hosted alternative to managed database services such as AWS RDS, Supabase or Neon. With over 35 years of active development, PostgreSQL is regarded as one of the most reliable relational databases and is the preferred choice for demanding web applications, data-intensive APIs and business-critical systems.

    Key features:

    - ACID-compliant transactions for maximum data consistency
    - Native JSON and JSONB support for flexible data models
    - Extension system (e.g. PostGIS, pg_vector, pgcrypto)
    - Views, triggers and stored procedures for complex database logic
    - Broad support from popular frameworks and ORMs
    - Automatic database backups via a configured cron job

    As a database component, **PostgreSQL** provides the relational backend behind many client applications that **advertising, web and digital agencies** develop or operate. Whether as the persistence layer for headless CMS systems such as Directus, as the database layer behind REST or GraphQL APIs, or as the foundation for bespoke web applications — PostgreSQL integrates seamlessly into existing stacks. With broad framework support, including Django, Laravel, Rails and Node.js ORMs, PostgreSQL is the first choice in most technology stacks.

    At mittwald, **PostgreSQL** runs as a self-hosted container component in German data centres; all data remains fully under the operator's control and is not shared with external services. This template includes PostgreSQL as a standalone database component with a preconfigured backup cron job. As there are no usage-based licence costs, the database can be operated economically even as data volumes and query loads continue to grow.
developer: PostgreSQL Global Development Group
website: https://www.postgresql.org
repository: https://github.com/postgres/postgres
license:
  name: PostgreSQL License
  link: https://spdx.org/licenses/PostgreSQL.html
categories:
  - development
userInputs:
  - name: "DATABASE_NAME"
    positionMeta: { step: "common", index: 1 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_USER"
    positionMeta: { step: "common", index: 2 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_PASSWORD"
    positionMeta: { step: "common", index: 3 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 12, "format": "password" }'

help:
  technicalDetails:
  - key:
      de: Hostname
      en: Hostname
    value: ${postgres.hostname}
  - key:
      de: Port
      en: Port
    value: 5432/TCP
  - key:
      de: Datenbank-Name
      en: Database Name
    value: ${postgres.env.POSTGRES_DB}
  - key:
      de: Admin Benutzername
      en: Admin username
    value: ${postgres.env.POSTGRES_USER}
  - key:
      de: Admin Passwort
      en: Admin Password
    value: ${postgres.env.POSTGRES_PASSWORD}
  - key:
      de: Verbindungsstring
      en: Connection string
    value: postgresql://${postgres.env.POSTGRES_USER}:${postgres.env.POSTGRES_PASSWORD}@${postgres.hostname}/${postgres.env.POSTGRES_DB}
