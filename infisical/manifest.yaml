manifestVersion: 1.0
name: infisical
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Secret Management Plattform
  en: Open-source secret management platform
description:
  de: Infisical ist eine Open-Source Secret Management Plattform zum sicheren Speichern und Verwalten von Geheimnissen, API-Keys und Konfigurationen. Dieses Template enthält Infisical mit PostgreSQL und Redis.
  en: Infisical is an open-source secret management platform for securely storing and managing secrets, API keys and configurations. This template includes Infisical with PostgreSQL and Redis.
developer: Infisical
website: https://infisical.com
repository: https://github.com/Infisical/infisical
license: MIT
categories:
  - security
domains:
  - userInput: HOST
    service: infisical
    port: 8080
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "ENCRYPTION_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 16
  - name: "AUTH_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
