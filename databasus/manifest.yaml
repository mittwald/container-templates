manifestVersion: 1.0
name: databasus
version: "latest"
icon: icon.svg
tagline:
  de: Einfacher Datenbank-Client im Browser
  en: Simple database client in the browser
description:
  de: Databasus ist ein einfacher, selbst gehosteter Datenbank-Client für den Browser. Unterstützt verschiedene Datenbanken und ermöglicht das Durchsuchen, Abfragen und Verwalten von Daten über eine übersichtliche Weboberfläche.
  en: Databasus is a simple, self-hosted database client for the browser. Supports various databases and allows browsing, querying and managing data through a clean web interface.
developer: Databasus
website: https://databasus.com
repository: https://github.com/nicholasgasior/databasus
license: MIT
categories:
  - development
domains:
  - userInput: HOST
    service: databasus
    port: 4005
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
