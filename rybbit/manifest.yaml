manifestVersion: 1.0
name: rybbit
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Web-Analytics Alternative
  en: Open-source web analytics alternative
description:
  de: Rybbit ist eine moderne, Open-Source Web-Analytics-Plattform. Eine datenschutzfreundliche Alternative zu herkömmlichen Analytics-Lösungen mit einer übersichtlichen Benutzeroberfläche. Dieses Template enthält Rybbit mit PostgreSQL.
  en: Rybbit is a modern, open-source web analytics platform. A privacy-friendly alternative to traditional analytics solutions with a clean user interface. This template includes Rybbit with PostgreSQL.
developer: Rybbit
website: https://rybbit.com
repository: https://github.com/rybbit-io/rybbit
license: AGPL-3.0
categories:
  - monitoring
domains:
  - userInput: HOST
    service: rybbit
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
