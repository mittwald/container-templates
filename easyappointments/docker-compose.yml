services:
  easyappointments:
    image: alextselegidis/easyappointments:latest
    # The storage volume starts empty and owned by root, while Apache serves
    # requests as www-data. Recreate the skeleton (including the upstream
    # "deny from all" files that keep logs and sessions private) and hand it
    # to www-data before running the image's own entrypoint.
    # PHP ignores TZ; the installer copies PHP's time zone into the default
    # time zone setting and the admin account, so set it before first start.
    # Opening the installer creates the migrations table. Until the installer
    # has been completed, every other page then answers "Database Migration
    # Required" instead of redirecting to the installer, so the pending
    # migration check is skipped while the app is not installed yet.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf 'date.timezone = Europe/Berlin' > /usr/local/etc/php/conf.d/zz-timezone.ini &&
        sed -i "s/table_exists('migrations')) {/table_exists('migrations') || !is_app_installed()) {/" /var/www/html/application/core/EA_Controller.php &&
        cd /var/www/html/storage &&
        mkdir -p backups cache logs sessions uploads &&
        printf 'deny from all' | tee backups/.htaccess cache/.htaccess logs/.htaccess sessions/.htaccess > /dev/null &&
        touch index.html backups/index.html cache/index.html logs/index.html sessions/index.html uploads/index.html &&
        chown -R www-data:www-data . &&
        exec docker-entrypoint.sh
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Berlin
      - BASE_URL=https://${HOST}
      - LANGUAGE=german
      - DEBUG_MODE=FALSE
      - DB_HOST=mariadb
      - DB_NAME=easyappointments
      - DB_USERNAME=easyappointments
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - GOOGLE_SYNC_FEATURE=FALSE
      - MAIL_PROTOCOL=smtp
      - MAIL_SMTP_DEBUG=0
      - MAIL_SMTP_AUTH=1
      - MAIL_SMTP_HOST=mail.agenturserver.de
      - MAIL_SMTP_USER=${MW_DELIVERYBOX_MAIN_USERNAME}
      - MAIL_SMTP_PASS=${MW_DELIVERYBOX_MAIN_PASSWORD}
      - MAIL_SMTP_CRYPTO=tls
      - MAIL_SMTP_PORT=587
      - MAIL_FROM_ADDRESS=${SMTP_FROM}
      - MAIL_FROM_NAME=${SMTP_FROM_NAME}
      - MAIL_REPLY_TO_ADDRESS=${SMTP_FROM}
    volumes:
      - easyappointments_storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:lts
    environment:
      - TZ=Europe/Berlin
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=easyappointments
      - MARIADB_USER=easyappointments
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/mysql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { MYSQL_PWD="$$MARIADB_ROOT_PASSWORD" mariadb-dump -u root --all-databases --routines --events --result-file="$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  easyappointments_storage:
  mariadb_data:
