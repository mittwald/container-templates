services:
  easyappointments:
    image: alextselegidis/easyappointments:latest
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Berlin
      - BASE_URL=https://${HOST}
      - LANGUAGE=german
      - DEBUG_MODE=FALSE
      - DB_HOST=mariadb
      - DB_NAME=easyappointments
      - DB_USERNAME=easyappointments
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - GOOGLE_SYNC_FEATURE=FALSE
      - MAIL_PROTOCOL=smtp
      - MAIL_SMTP_DEBUG=0
      - MAIL_SMTP_AUTH=1
      - MAIL_SMTP_HOST=${SMTP_HOST}
      - MAIL_SMTP_USER=${SMTP_USER}
      - MAIL_SMTP_PASS=${SMTP_PASSWORD}
      - MAIL_SMTP_CRYPTO=tls
      - MAIL_SMTP_PORT=${SMTP_PORT}
      - MAIL_FROM_ADDRESS=${SMTP_FROM}
      - MAIL_FROM_NAME=${SMTP_FROM_NAME}
      - MAIL_REPLY_TO_ADDRESS=${SMTP_FROM}
    volumes:
      - easyappointments_storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:lts
    environment:
      - TZ=Europe/Berlin
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=easyappointments
      - MARIADB_USER=easyappointments
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/mysql/backups && \
        mariadb-dump -u root -p"$MARIADB_ROOT_PASSWORD" --all-databases | gzip \
          > /var/lib/mysql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/mysql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  easyappointments_storage:
  mariadb_data:
