services:
  easyappointments:
    image: alextselegidis/easyappointments:1.6.0
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Berlin
      - BASE_URL=https://${HOST}
      - LANGUAGE=german
      - DEBUG_MODE=FALSE
      - DB_HOST=mariadb
      - DB_NAME=easyappointments
      - DB_USERNAME=easyappointments
      - DB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - easyappointments_storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:lts
    environment:
      - TZ=Europe/Berlin
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=easyappointments
      - MARIADB_USER=easyappointments
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/mysql/backups && \
        mariadb-dump -u root -p"$MARIADB_ROOT_PASSWORD" --all-databases | gzip \
          > /var/lib/mysql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/mysql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  easyappointments_storage:
  mariadb_data:
