manifestVersion: 1.0
name:
  de: Paperless-ngx
  en: Paperless-ngx
version: "latest"
type: standalone
tagline:
  de: Dokumentenmanagement mit OCR
  en: Document management with OCR
description:
  de: Paperless-ngx ist ein Dokumentenmanagementsystem, das physische Dokumente in ein durchsuchbares digitales Archiv verwandelt. Mit OCR-Unterstützung für Deutsch und Englisch, Tika und Gotenberg für erweiterte Dokumentenverarbeitung.
  en: Paperless-ngx is a document management system that transforms physical documents into a searchable digital archive. With OCR support for German and English, Tika and Gotenberg for advanced document processing.
developer: Paperless-ngx
website: https://docs.paperless-ngx.com
repository: https://github.com/paperless-ngx/paperless-ngx
license:
  name: GPL-3.0
  link: https://spdx.org/licenses/GPL-3.0.html
categories:
  - productivity
domains:
  - userInput: HOST
    service: paperless
    port: 8000
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Admin-Benutzer manuell einrichten
      en: Set up admin user manually
    content:
      de: Der Admin-Benutzer wird nicht automatisch angelegt. Richte ihn nach der Installation beim ersten Aufruf manuell ein.
      en: The admin user is not created automatically. Set it up manually after installation on the first launch.
