services:
  weblate:
    image: weblate/weblate:latest
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Berlin
      - WEBLATE_DEBUG=0
      - WEBLATE_LOGLEVEL=INFO
      - WEBLATE_SITE_TITLE=Weblate (${HOST})
      - WEBLATE_SITE_DOMAIN=${HOST}
      - WEBLATE_ALLOWED_HOSTS=${HOST}
      - WEBLATE_ENABLE_HTTPS=1
      - WEBLATE_SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      - WEBLATE_TIME_ZONE=Europe/Berlin
      - WEBLATE_REGISTRATION_OPEN=0
      - WEBLATE_REQUIRE_LOGIN=1
      - WEBLATE_ADMIN_NAME=Weblate Admin
      - WEBLATE_ADMIN_EMAIL=${ADMIN_EMAIL}
      - WEBLATE_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WEBLATE_SERVER_EMAIL=${SMTP_FROM}
      - WEBLATE_DEFAULT_FROM_EMAIL=${SMTP_FROM}
      - WEBLATE_EMAIL_HOST=mail.agenturserver.de
      - WEBLATE_EMAIL_PORT=587
      - WEBLATE_EMAIL_HOST_USER=${MW_DELIVERYBOX_MAIN_USERNAME}
      - WEBLATE_EMAIL_HOST_PASSWORD=${MW_DELIVERYBOX_MAIN_PASSWORD}
      - WEBLATE_EMAIL_USE_TLS=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=weblate
      - POSTGRES_DB=weblate
      - POSTGRES_USER=weblate
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
    volumes:
      - weblate_data:/app/data
      - weblate_cache:/app/cache
    read_only: true
    tmpfs:
      - /run
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=weblate
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=weblate
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weblate -d weblate"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/postgresql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { pg_dumpall -h localhost -U "$$POSTGRES_USER" -f "$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
  valkey:
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - valkey_data:/data
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  weblate_data:
  weblate_cache:
  postgres_data:
  valkey_data:
