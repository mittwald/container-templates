manifestVersion: 1.0
name: dozzle
version: "latest"
icon: icon.svg
tagline:
  de: Echtzeit Log-Viewer für Docker Container
  en: Real-time log viewer for Docker containers
description:
  de: Dozzle ist ein leichtgewichtiger Echtzeit Log-Viewer für Docker Container mit einer übersichtlichen Web-Oberfläche. Keine Datenbank erforderlich.
  en: Dozzle is a lightweight real-time log viewer for Docker containers with a clean web interface. No database required.
developer: Amir Raminfar
website: https://dozzle.dev
repository: https://github.com/amir20/dozzle
license: MIT
categories:
  - monitoring
domains:
  - userInput: HOST
    service: dozzle
    port: 8080
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
