manifestVersion: 1.0
name: keycloak
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Identity und Access Management
  en: Open-source identity and access management
description:
  de: Keycloak ist eine Open-Source Identity- und Access-Management-Lösung mit Single Sign-On, Identity Brokering, Social Login und User Federation. Dieses Template enthält Keycloak mit PostgreSQL.
  en: Keycloak is an open-source identity and access management solution with single sign-on, identity brokering, social login and user federation. This template includes Keycloak with PostgreSQL.
developer: Red Hat
website: https://www.keycloak.org
repository: https://github.com/keycloak/keycloak
license: Apache-2.0
categories:
  - security
domains:
  - userInput: HOST
    service: keycloak
    port: 8080
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_USER"
    positionMeta: { step: "common", index: 2 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_PASSWORD"
    positionMeta: { step: "common", index: 3 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 8 }'
systemInputs:
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
