manifestVersion: 1.0
name: librechat
version: "latest"
icon: icon.svg
tagline:
  de: Multi-Provider KI-Chat-Plattform
  en: Multi-provider AI chat platform
description:
  de: LibreChat ist eine Open-Source KI-Chat-Plattform, die mehrere KI-Anbieter (OpenAI, Anthropic, Google u.a.) in einer einheitlichen Oberfläche vereint. Mit integrierter RAG-Pipeline, Meilisearch-Volltextsuche, MongoDB und pgvector-Vektordatenbank.
  en: LibreChat is an open-source AI chat platform that unifies multiple AI providers (OpenAI, Anthropic, Google and others) in a single interface. With built-in RAG pipeline, Meilisearch full-text search, MongoDB and pgvector vector database.
developer: Danny Avila
website: https://www.librechat.ai
repository: https://github.com/danny-avila/LibreChat
license: MIT
categories:
  - ai
domains:
  - userInput: HOST
    service: librechat
    port: 3080
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "CREDS_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "CREDS_IV"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 16
  - name: "JWT_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "JWT_REFRESH_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "MEILI_MASTER_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 16
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
