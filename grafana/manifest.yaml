manifestVersion: 1.0
name:
  de: Grafana
  en: Grafana
version: "latest"
type: standalone
tagline:
  de: Dashboards und Alerting für Metriken, Logs und Datenbanken
  en: Dashboards and alerting for metrics, logs and databases
description:
  de: |
    **Grafana** ist eine Plattform für Dashboards und Alerting und eine self-hosted Alternative zu Diensten wie Datadog oder New Relic. Grafana speichert selbst keine Messwerte, sondern visualisiert Daten aus angebundenen Quellen wie Prometheus, Loki, InfluxDB, MySQL, PostgreSQL oder Elasticsearch in interaktiven Dashboards.

    Zentrale Funktionen:

    - Dashboards mit Zeitreihen, Kennzahlen, Tabellen, Heatmaps und vielen weiteren Visualisierungen
    - Zahlreiche Datenquellen, darunter Prometheus, Loki, SQL-Datenbanken und JSON-APIs
    - Warnregeln mit Benachrichtigung per E-Mail, Webhook, Slack oder Microsoft Teams
    - Ordner, Teams und abgestufte Rechte für Betrachter, Bearbeiter und Admins

    Für **Agenturen** bündelt Grafana die Überwachung vieler Kundenprojekte an einem Ort: Antwortzeiten, Fehlerquoten, Serverauslastung oder Shop-Kennzahlen aus den Datenbanken der Kundenanwendungen landen in eigenen Dashboards je Kunde. Warnregeln melden Probleme, bevor Kunden sie bemerken, und Kunden erhalten bei Bedarf einen Lesezugang zu ihren eigenen Dashboards.

    Bei mittwald läuft **Grafana** als self-hosted Container in deutschen Rechenzentren; Dashboards, Zugangsdaten zu den Datenquellen und Auswertungen bleiben unter der Kontrolle der Agentur, was die Einhaltung der DSGVO vereinfacht. Dieses Template enthält Grafana mit eingebetteter SQLite-Datenbank, vorbelegtem Admin-Konto und Mailversand über eine Delivery-Box. Lizenzkosten je Nutzer oder Host fallen nicht an.
  en: |
    **Grafana** is a platform for dashboards and alerting and a self-hosted alternative to services such as Datadog or New Relic. Grafana does not store metrics itself; it visualises data from connected sources such as Prometheus, Loki, InfluxDB, MySQL, PostgreSQL or Elasticsearch in interactive dashboards.

    Key features:

    - Dashboards with time series, stats, tables, heatmaps and many more visualisations
    - Numerous data sources, including Prometheus, Loki, SQL databases and JSON APIs
    - Alert rules with notifications via email, webhook, Slack or Microsoft Teams
    - Folders, teams and granular permissions for viewers, editors and admins

    For **agencies**, Grafana brings the monitoring of many client projects together in one place: response times, error rates, server load or shop figures from the databases of client applications end up in dedicated dashboards per client. Alert rules report problems before clients notice them, and clients can get read-only access to their own dashboards when needed.

    At mittwald, **Grafana** runs as a self-hosted container in German data centres; dashboards, data source credentials and analyses stay under the agency's control, which simplifies GDPR compliance. This template includes Grafana with an embedded SQLite database, a pre-configured admin account and email delivery through a delivery box. There are no licence costs per user or host.
developer: Grafana Labs
website: https://grafana.com/oss/grafana/
repository: https://github.com/grafana/grafana
support: https://community.grafana.com
license:
  name: AGPL-3.0
  link: https://spdx.org/licenses/AGPL-3.0-only.html
categories:
  - monitoring
screenshots:
  - bg: background.jpg
    screenshot: screenshot-dashboard.png
    text:
      de: Dashboard mit Kennzahlen und Verläufen eines Kunden-Shops
      en: Dashboard with key figures and trends of a client shop
  - bg: background.jpg
    screenshot: screenshot-uptime.png
    text:
      de: Antwortzeiten und Status mehrerer Kundenwebsites im Vergleich
      en: Response times and status of several client websites compared
  - bg: background.jpg
    screenshot: screenshot-editor.png
    text:
      de: Panel-Editor mit Abfrage, Vorschau und Darstellungsoptionen
      en: Panel editor with query, preview and display options
domains:
  main:
    userInput: HOST
    service: grafana
    port: 3000
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "domain", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_USER"
    label:
      de: Admin Benutzername
      en: Admin username
    positionMeta: { step: "adminUser", index: 1 }
    defaultValue: "${user.username}"
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_EMAIL"
    label:
      de: Admin E-Mail-Adresse
      en: Admin email address
    positionMeta: { step: "adminUser", index: 2 }
    defaultValue: "${user.email}"
    required: true
    format: email
    validationSchema: '{ "type": "string", "format": "email" }'
  - name: "ADMIN_PASSWORD"
    label:
      de: Admin Passwort
      en: Admin password
    positionMeta: { step: "adminUser", index: 3 }
    required: true
    format: password
    validationSchema: '{ "type": "string", "minLength": 12 }'
  - name: "SMTP_FROM"
    label:
      de: Absenderadresse
      en: Sender address
    positionMeta: { step: "common", index: 1 }
    defaultValue: "${user.email}"
    required: true
    format: email
    description:
      de: Von dieser Adresse kommen Warnungen, Einladungen und Mails zum Zurücksetzen des Passworts
      en: Alerts, invitations and password reset emails are sent from this address
    validationSchema: '{ "type": "string", "format": "email" }'
systemInputs:
  - name: "SECRET_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
        - identifier: noSpecial
          ruleType: charPool
          charPools:
            - special
            - nonAscii
          max: 0
deliveryBoxes:
  - purpose: main
help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Admin Benutzername
      en: Admin username
    value: ${grafana.env.GF_SECURITY_ADMIN_USER}
  - key:
      de: Admin Passwort
      en: Admin password
    value: ${grafana.env.GF_SECURITY_ADMIN_PASSWORD}
  - key:
      de: Absenderadresse
      en: Sender address
    value: ${grafana.env.GF_SMTP_FROM_ADDRESS}
  alerts:
  - status: info
    heading:
      de: Zugangsdaten nach dem ersten Start ändern
      en: Changing credentials after the first start
    content:
      de: Grafana übernimmt Admin-Benutzername und -Passwort nur beim ersten Start. Ändert der Admin sein Passwort später in Grafana unter **Profil**, zeigen diese Stack-Informationen weiterhin den ursprünglichen Wert.
      en: Grafana applies the admin username and password only on the first start. If the admin later changes the password in Grafana under **Profile**, these stack details still show the original value.
  - status: info
    heading:
      de: Datenquellen anbinden
      en: Connecting data sources
    content:
      de: Grafana startet ohne Datenquellen. Unter **Verbindungen → Datenquellen** lassen sich zum Beispiel MySQL, PostgreSQL oder Prometheus anbinden. Neue Benutzer können sich nicht selbst registrieren, sondern werden unter **Verwaltung → Benutzer und Zugriff** eingeladen.
      en: Grafana starts without data sources. Under **Connections → Data sources** you can connect MySQL, PostgreSQL or Prometheus, for example. New users cannot sign up themselves; invite them under **Administration → Users and access**.
