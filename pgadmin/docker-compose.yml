services:
  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Berlin
      - PGADMIN_DEFAULT_EMAIL=${ADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${ADMIN_PASSWORD}
      # No local mail server in the container; without it pgAdmin starts Postfix.
      - PGADMIN_DISABLE_POSTFIX=true
      # PGADMIN_CONFIG_* values are Python literals.
      - PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED=False
    volumes:
      # Configuration database, sessions, saved servers and user files.
      - pgadmin_data:/var/lib/pgadmin
volumes:
  pgadmin_data:
