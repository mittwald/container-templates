manifestVersion: 1.0
name:
  de: Password Pusher
  en: Password Pusher
version: "latest"
type: standalone
tagline:
  de: Passwörter und Geheimnisse sicher teilen
  en: Securely share passwords and secrets
description:
  de: |
    **Password Pusher** ist eine self-hosted Webanwendung zum sicheren Teilen von Passwörtern und Geheimnissen und eine Alternative zu kommerziellen Secret-Sharing-Diensten wie 1Password Send. Die Anwendung erzeugt ablaufende, selbstzerstörende Links, über die sensible Zugangsdaten einmalig übermittelt werden können, ohne sie per E-Mail im Klartext zu versenden.

    Zentrale Funktionen:

    - Selbstzerstörende Links mit konfigurierbarem Ablauf nach Zeit oder Abrufanzahl
    - Optionaler Zugangscode zum Schutz freigegebener Inhalte
    - Audit-Log zur Nachverfolgung von Link-Aufrufen
    - Anpassbares Branding mit eigenem Titel und eigener Tagline

    Für **Agenturen** ist Password Pusher besonders beim Austausch von Zugangsdaten mit Kunden oder externen Dienstleistern relevant. Anstatt Passwörter für Hosting-Zugänge, CMS-Logins oder API-Schlüssel per E-Mail zu übermitteln, generiert die Agentur einen ablaufenden Link, der nach Abruf oder Zeitablauf automatisch ungültig wird. Das anpassbare Branding ermöglicht eine professionelle Darstellung im eigenen Erscheinungsbild.

    Bei mittwald läuft **Password Pusher** als self-hosted Container in deutschen Rechenzentren; geteilte Geheimnisse werden ausschließlich auf der eigenen Infrastruktur gespeichert — ein wesentlicher Vorteil im Hinblick auf die DSGVO. Dieses Template enthält Password Pusher als eigenständige Anwendung. Da keine Lizenzkosten anfallen und keine Seat-Beschränkungen gelten, ist die Lösung für beliebig viele Teammitglieder kostenneutral nutzbar.
  en: |
    **Password Pusher** is a self-hosted web application for securely sharing passwords and secrets — an alternative to commercial services such as 1Password Send. It generates expiring, self-destructing links for one-time transmission of sensitive credentials, without sending them in plain text via email.

    Key features:

    - Self-destructing links with configurable expiry by time or number of views
    - Optional passphrase protection for shared content
    - Audit log for tracking link access
    - Customisable branding with a custom title and tagline

    For **agencies**, Password Pusher is particularly relevant when sharing credentials with clients or external service providers. Instead of sending passwords for hosting accounts, CMS logins or API keys via email, the agency generates an expiring link that becomes invalid after retrieval or a set time. Customisable branding allows the interface to match the agency's own identity.

    At mittwald, **Password Pusher** runs as a self-hosted container in German data centres; shared secrets are stored exclusively on the operator's own infrastructure — a significant advantage over SaaS alternatives regarding the GDPR. This template includes Password Pusher as a standalone application with no licence costs and no seat-based restrictions.
developer: Peter Giacomo Lombardo
website: https://pwpush.com
repository: https://github.com/pglombardo/PasswordPusher
license:
  name: Apache-2.0
  link: https://spdx.org/licenses/Apache-2.0.html
categories:
  - security
screenshots:
  - bg: background.jpg
    screenshot: screenshot-new-secret.png
    text:
      de: Passwort mit Ablauf nach Tagen oder Aufrufen hinterlegen
      en: Store a password expiring after days or views
  - bg: background.jpg
    screenshot: screenshot-share-secret.png
    text:
      de: Geheimer Link mit QR-Code und fertigem Begleittext
      en: Secret link with QR code and a ready-made message
  - bg: background.jpg
    screenshot: screenshot-secret-show.png
    text:
      de: Empfänger sehen das Passwort erst nach dem Aufdecken
      en: Recipients only see the password after revealing it
domains:
  main:
    userInput: HOST
    service: password-pusher
    port: 5100
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "domain", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "BRAND_TITLE"
    label:
      de: Markentitel
      en: Brand title
    positionMeta: { step: "common", index: 1 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "BRAND_TAGLINE"
    label:
      de: Marken-Slogan
      en: Brand tagline
    positionMeta: { step: "common", index: 2 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_KEY_BASE"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "PWPUSH_MASTER_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 64
          max: 64
        - identifier: hexOnly
          ruleType: charPool
          charPools:
            - uppercase
            - special
            - nonAscii
          max: 0
        - identifier: hexOnlyLetters
          ruleType: char
          chars: "ghijklmnopqrstuvwxyz"
          max: 0

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
