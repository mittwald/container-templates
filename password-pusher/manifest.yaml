manifestVersion: 1.0
name:
  de: Password Pusher
  en: Password Pusher
version: "latest"
type: standalone
tagline:
  de: Passwörter und Geheimnisse sicher teilen
  en: Securely share passwords and secrets
description:
  de: Password Pusher ermöglicht das sichere Teilen von Passwörtern und Geheimnissen über ablaufende Links. Kein Login oder Account nötig.
  en: Password Pusher enables secure sharing of passwords and secrets via expiring links. No login or account required.
developer: Peter Giacomo Lombardo
website: https://pwpush.com
repository: https://github.com/pglombardo/PasswordPusher
license:
  name: Source Available
  link: https://github.com/pglombardo/PasswordPusher/blob/master/LICENSE
categories:
  - security
domains:
  - userInput: HOST
    service: password-pusher
    port: 5100
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "BRAND_TITLE"
    label:
      de: Markentitel
      en: Brand title
    positionMeta: { step: "common", index: 2 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "BRAND_TAGLINE"
    label:
      de: Marken-Slogan
      en: Brand tagline
    positionMeta: { step: "common", index: 3 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_KEY_BASE"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "PWPUSH_MASTER_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 64
        - identifier: hex
          ruleType: charPool
          charPools:
            - numbers
            - lowercase
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
