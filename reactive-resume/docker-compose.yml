services:
  reactive-resume:
    image: amruthpillai/reactive-resume:latest
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
      - DATABASE_URL=postgresql://reactive_resume:${POSTGRES_PASSWORD}@postgres:5432/reactive_resume
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - PUBLIC_URL=https://${HOST}
      - CHROME_URL=
      - STORAGE_URL=
    depends_on:
      - postgres
  postgres:
    image: postgres:18
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=reactive_resume
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=reactive_resume
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "reactive_resume", "-U", "reactive_resume"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
          -f /var/lib/postgresql/backups/backup.sql'
volumes:
  postgres_data:
