manifestVersion: 1.0
name: reactive-resume
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Lebenslauf-Builder
  en: Open-source resume builder
description:
  de: Reactive Resume ist ein kostenloser, Open-Source Lebenslauf-Builder mit modernen Vorlagen, Echtzeit-Vorschau und PDF-Export.
  en: Reactive Resume is a free, open-source resume builder with modern templates, real-time preview and PDF export.
developer: Amruth Pillai
website: https://rxresu.me
repository: https://github.com/AmruthPillworthy/Reactive-Resume
license: MIT
categories:
  - productivity
domains:
  - userInput: HOST
    service: reactive-resume
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "ACCESS_TOKEN_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "REFRESH_TOKEN_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
