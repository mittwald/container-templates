services:
  flowise:
    image: flowiseai/flowise:latest
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://${HOST}
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=flowise
      - DATABASE_USER=flowise
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_SSL=false
      - SECRETKEY_STORAGE_TYPE=local
      - SECRETKEY_PATH=/root/.flowise
      - FLOWISE_SECRETKEY_OVERWRITE=${FLOWISE_SECRET_KEY}
      - STORAGE_TYPE=local
      - BLOB_STORAGE_PATH=/root/.flowise/storage
      - DISABLE_FLOWISE_TELEMETRY=true
      - SECURE_COOKIES=true
      - TRUST_PROXY=true
      - HTTP_SECURITY_CHECK=true
      - PATH_TRAVERSAL_SAFETY=true
      - CUSTOM_MCP_SECURITY_CHECK=true
      - CUSTOM_MCP_PROTOCOL=sse
    volumes:
      - flowise_data:/root/.flowise
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=flowise
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=flowise
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowise -d flowise"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dumpall -h localhost -U "$POSTGRES_USER" | gzip \
          > /var/lib/postgresql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/postgresql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  flowise_data:
  postgres_data:
