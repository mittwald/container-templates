manifestVersion: 1.0
name:
  de: Flowise
  en: Flowise
version: latest
type: standalone
tagline:
  de: KI-Workflows visuell entwickeln
  en: Build AI workflows visually
description:
  de: |
    **Flowise** ist eine visuelle Entwicklungsplattform für Anwendungen mit Sprachmodellen und eine self-hosted Alternative zu gehosteten Low-Code-Angeboten wie Langflow Cloud. Chatflows und Agenten werden aus wiederverwendbaren Bausteinen zusammengestellt und anschließend als API oder eingebetteter Chat bereitgestellt.

    Zentrale Funktionen:

    - Visueller Editor für Chatflows, Agentflows und mehrstufige KI-Prozesse
    - Integrationen für Sprachmodelle, Vektordatenbanken, Werkzeuge und Speicher
    - REST-API, eingebettete Chat-Oberflächen und Zugriffskontrollen
    - Ausführungsprotokolle, Vorlagen und wiederverwendbare Komponenten

    Für **Agenturen** beschleunigt Flowise Prototypen und kundenindividuelle KI-Funktionen. Teams bauen Assistenten für Websites, interne Wissensbestände oder Supportprozesse, testen verschiedene Modellanbieter und binden fertige Abläufe über APIs in Kundenanwendungen ein. Visuelle Flows erleichtern zudem die gemeinsame Abstimmung zwischen Entwicklung, Beratung und Content-Teams.

    Bei mittwald läuft **Flowise** als self-hosted Anwendung in deutschen Rechenzentren. Das Template enthält Flowise 3 mit PostgreSQL, persistentem Datei- und Secret-Speicher, sicheren Cookies sowie deaktivierter Telemetrie. Die PostgreSQL-Datenbank wird über das mittwald Backup-Label gesichert. Konfigurationen, Zugangsdaten und Ausführungsdaten verbleiben in der eigenen Infrastruktur und unterstützen DSGVO-gerechte Betriebsprozesse. Modellanbieter können unabhängig ausgewählt und innerhalb der Oberfläche konfiguriert werden.
  en: |
    **Flowise** is a visual development platform for language-model applications and a self-hosted alternative to hosted low-code products such as Langflow Cloud. Chat flows and agents are assembled from reusable building blocks and then exposed through APIs or embedded chat interfaces.

    Key features:

    - Visual editor for chat flows, agent flows and multi-step AI processes
    - Integrations for language models, vector databases, tools and memory
    - REST API, embedded chat interfaces and access controls
    - Execution logs, templates and reusable components

    For **agencies**, Flowise accelerates prototypes and custom AI features for client projects. Teams build assistants for websites, internal knowledge bases or support processes, compare model providers and integrate finished flows into client applications through APIs. Visual workflows also improve collaboration between development, consulting and content teams.

    At mittwald, **Flowise** runs as a self-hosted application in German data centres. The template includes Flowise 3 with PostgreSQL, persistent file and secret storage, secure cookies and disabled telemetry. PostgreSQL is protected through the mittwald backup label. Configurations, credentials and execution data remain within the operator's infrastructure, supporting GDPR-conscious processes. Model providers can be selected independently and configured through the application interface.
developer: FlowiseAI Inc.
website: https://flowiseai.com
repository: https://github.com/FlowiseAI/Flowise
support: https://docs.flowiseai.com
license:
  name: Apache-2.0 (Core)
  link: https://github.com/FlowiseAI/Flowise/blob/main/LICENSE.md
categories:
  - ai
  - development
screenshots:
  - bg: background.jpg
    screenshot: screenshot-rag-flow.png
    text:
      de: Ein Agent prüft, sucht Dokumente und formuliert die Antwort
      en: An agent checks, retrieves documents and formulates the answer
  - bg: background.jpg
    screenshot: screenshot-rag-external-integrations.png
    text:
      de: Dokumente aus Confluence, Jira, GitHub, Google Drive und mehr
      en: Documents from Confluence, Jira, GitHub, Google Drive and more
  - bg: background.jpg
    screenshot: screenshot-website-chat-integration.png
    text:
      de: Fertige Flows als Chat-Widget einbinden oder per API aufrufen
      en: Embedding finished flows as a chat widget or calling them by API
domains:
  main:
    userInput: HOST
    service: flowise
    port: 3000
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "domain", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "SMTP_FROM"
    label:
      de: Absenderadresse
      en: Sender address
    positionMeta: { step: "common", index: 1 }
    defaultValue: "${user.email}"
    format: "email"
    required: true
    validationSchema: '{ "type": "string", "format": "email" }'
systemInputs:
  - name: "FLOWISE_SECRET_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 64
        - identifier: hex
          ruleType: charPool
          charPools: [numbers, lowercase]
          min: 1
  - name: "JWT_AUTH_TOKEN_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 64
        - identifier: hex
          ruleType: charPool
          charPools: [numbers, lowercase]
          min: 1
  - name: "JWT_REFRESH_TOKEN_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 64
        - identifier: hex
          ruleType: charPool
          charPools: [numbers, lowercase]
          min: 1
  - name: "EXPRESS_SESSION_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 64
        - identifier: hex
          ruleType: charPool
          charPools: [numbers, lowercase]
          min: 1
  - name: "TOKEN_HASH_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 64
        - identifier: hex
          ruleType: charPool
          charPools: [numbers, lowercase]
          min: 1
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools: [numbers]
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

deliveryBoxes:
  - purpose: main
help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Administratorkonto einrichten
      en: Set up the administrator account
    content:
      de: Richte beim ersten Aufruf das Administratorkonto ein. Modellzugänge werden anschließend als verschlüsselte Zugangsdaten in Flowise hinterlegt.
      en: Set up the administrator account on first access. Model credentials can then be stored as encrypted credentials in Flowise.
