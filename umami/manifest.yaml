manifestVersion: 1.0
name:
  de: Umami
  en: Umami
version: "latest"
type: standalone
tagline:
  de: Datenschutzfreundliche Web-Analytics
  en: Privacy-focused web analytics
description:
  de: Umami ist eine datenschutzfreundliche, selbst gehostete Web-Analytics-Lösung. Eine einfache und schnelle Alternative zu Google Analytics, die keine Cookies verwendet und DSGVO-konform ist.
  en: Umami is a privacy-focused, self-hosted web analytics solution. A simple and fast alternative to Google Analytics that does not use cookies and is GDPR compliant.
developer: Umami Software
website: https://umami.is
repository: https://github.com/umami-software/umami
license:
  name: MIT
  link: https://spdx.org/licenses/MIT.html
categories:
  - monitoring
domains:
  - userInput: HOST
    service: umami
    port: 3000
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "APP_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Admin Benutzername
      en: Admin username
    value: admin
  - key:
      de: Admin Passwort
      en: Admin Password
    value: umami
  alerts:
  - status: warning
    heading:
      de: Standardzugangsdaten gesetzt
      en: Default login credentials set
    content:
      de: Die Zugangsdaten werden für jede Installation standardmäßig gesetzt. Bitte ändere sie sofort nach dem ersten Login.
      en: The login credentials are set by default for each installation. Please change them immediately after your first login.
