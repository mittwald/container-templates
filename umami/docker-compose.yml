services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
      - DATABASE_URL=postgresql://umami:${POSTGRES_PASSWORD}@postgres:5432/umami
      - APP_SECRET=${APP_SECRET}
      - DISABLE_TELEMETRY=1
      - HOSTNAME=0.0.0.0
    depends_on:
      - postgres
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=umami
    volumes:
      - postgres_data:/var/lib/postgresql
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dumpall -h localhost -U "$POSTGRES_USER" | gzip \
          > /var/lib/postgresql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/postgresql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  postgres_data:
