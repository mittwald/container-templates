manifestVersion: 1.0
name:
  de: Super Productivity
  en: Super Productivity
version: "18.x.x"
type: standalone
tagline:
  de: Aufgaben planen und Zeiten erfassen
  en: Plan tasks and track time
description:
  de: |
    **Super Productivity** verbindet Aufgabenverwaltung mit Zeiterfassung und ist eine self-hosted Alternative zu Todoist in Kombination mit Toggl Track. Aufgaben, geplante Zeitfenster und tatsächlich gearbeitete Zeiten liegen in derselben Anwendung, sodass Planung und Auswertung nicht auseinanderfallen.

    Zentrale Funktionen:

    - Aufgaben mit Unteraufgaben, Projekten, Tags und Notizen
    - Zeiterfassung je Aufgabe, Pomodoro-Timer und Pausenerinnerungen
    - Tagesplanung mit Zeitfenstern und Auswertung als Stundenzettel
    - Import von Aufgaben aus Jira, GitHub, GitLab, Gitea und Open Project
    - Kalender über CalDAV, Synchronisation über WebDAV oder Dropbox

    Für **Agenturen** eignet sich Super Productivity als schlankes Werkzeug zur Selbstorganisation in Kundenprojekten: Aufgaben lassen sich je Kunde als Projekt bündeln, die erfassten Zeiten stehen unmittelbar für die Abrechnung bereit, und über die Anbindung an Jira oder GitLab bleiben Tickets aus Entwicklungsprojekten sichtbar, ohne dass ein zweites Werkzeug nötig wird.

    Bei mittwald läuft **Super Productivity** als self-hosted Container in deutschen Rechenzentren. Die Anwendung kommt ohne Benutzerkonten aus, alle Daten bleiben im Browser oder auf dem selbst gewählten Sync-Ziel, was die Einhaltung der DSGVO vereinfacht. Dieses Template enthält die Weboberfläche ohne nutzungsabhängige Lizenz- oder Seat-Kosten.
  en: |
    **Super Productivity** combines task management with time tracking and is a self-hosted alternative to Todoist paired with Toggl Track. Tasks, planned time blocks and actually worked hours live in the same application, so planning and evaluation do not drift apart.

    Key features:

    - Tasks with sub-tasks, projects, tags and notes
    - Time tracking per task, Pomodoro timer and break reminders
    - Daily planning with time blocks and evaluation as a timesheet
    - Task import from Jira, GitHub, GitLab, Gitea and Open Project
    - Calendars via CalDAV, synchronisation via WebDAV or Dropbox

    For **agencies**, Super Productivity works as a lean tool for self-organisation across client projects: tasks can be grouped per client as a project, tracked times are immediately available for billing, and the connection to Jira or GitLab keeps tickets from development projects visible without requiring a second tool.

    At mittwald, **Super Productivity** runs as a self-hosted container in German data centres. The application needs no user accounts, and all data stays in the browser or on the sync target of your choice, simplifying GDPR compliance. This template contains the web interface — with no usage-based licence or seat costs.
developer: Johannes Millan
website: https://super-productivity.com
repository: https://github.com/super-productivity/super-productivity
support: https://github.com/super-productivity/super-productivity/issues
license:
  name: MIT
  link: https://spdx.org/licenses/MIT.html
categories:
  - productivity
domains:
  main:
    userInput: HOST
    service: super-productivity
    port: 80
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "domain", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Speicherung im Browser
      en: Storage in the browser
    content:
      de: Super Productivity benötigt kein Konto. Aufgaben und Zeiten werden im Browser gespeichert und gehen verloren, wenn du die Websitedaten löschst. Richte deshalb in den Einstellungen unter „Sync“ ein Ziel ein — WebDAV, etwa eine Nextcloud, oder Dropbox. Danach stehen die Daten auch auf anderen Geräten und in der Desktop-App zur Verfügung.
      en: Super Productivity requires no account. Tasks and times are stored in the browser and are lost when you clear site data. Therefore configure a target under “Sync” in the settings — WebDAV, for example a Nextcloud, or Dropbox. Your data is then also available on other devices and in the desktop app.
