services:
  bugsink:
    image: bugsink/bugsink:2
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Berlin
      - SECRET_KEY=${SECRET_KEY}
      - BASE_URL=https://${HOST}
      - PORT=8000
      - CREATE_SUPERUSER=${ADMIN_EMAIL}:${ADMIN_PASSWORD}
      - DATABASE_URL=postgresql://bugsink:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      - BEHIND_HTTPS_PROXY=true
      - USE_X_FORWARDED_HOST=true
    depends_on:
      - postgres
  postgres:
    image: postgres:18
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=bugsink
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=bugsink
    volumes:
      - postgres_data:/var/lib/postgresql
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
          -f /var/lib/postgresql/backups/backup.sql'
volumes:
  postgres_data:
