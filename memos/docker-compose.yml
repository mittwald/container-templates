services:
  memos:
    image: neosmemo/memos:stable
    ports:
      - "5230:5230"
    environment:
      - TZ=Europe/Berlin
      - MEMOS_MODE=prod
      - MEMOS_DRIVER=postgres
      - MEMOS_DSN=postgres://memos:${POSTGRES_PASSWORD}@postgres:5432/memos?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - memos_data:/var/opt/memos
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=memos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=memos
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/postgresql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { pg_dumpall -h localhost -U "$$POSTGRES_USER" -f "$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  memos_data:
  postgres_data:
