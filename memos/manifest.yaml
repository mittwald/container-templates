manifestVersion: 1.0
name: memos
version: "stable"
icon: icon.svg
tagline:
  de: Leichtgewichtiger selbst gehosteter Notiz-Service
  en: Lightweight self-hosted note-taking service
description:
  de: Memos ist ein leichtgewichtiger, selbst gehosteter Notiz-Service. Ideal zum schnellen Erfassen von Gedanken, Ideen und Notizen in einer übersichtlichen Timeline-Ansicht mit Markdown-Unterstützung und Tags.
  en: Memos is a lightweight, self-hosted note-taking service. Ideal for quickly capturing thoughts, ideas and notes in a clear timeline view with Markdown support and tags.
developer: Memos
website: https://www.usememos.com
repository: https://github.com/usememos/memos
license: MIT
categories:
  - productivity
domains:
  - userInput: HOST
    service: memos
    port: 5230
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
