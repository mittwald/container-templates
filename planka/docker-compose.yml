services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    ports:
      - "1337:1337"
    environment:
      - TZ=Europe/Berlin
      - DATABASE_URL=postgresql://planka:${POSTGRES_PASSWORD}@postgres:5432/planka
      - BASE_URL=https://${HOST}
      - SECRET_KEY=${SECRET_KEY}
      - DEFAULT_ADMIN_EMAIL=admin@example.com
      - DEFAULT_ADMIN_PASSWORD=admin
      - DEFAULT_ADMIN_NAME=Admin
      - DEFAULT_ADMIN_USERNAME=admin
    volumes:
      - planka_data:/app/public/user-avatars
      - planka_attachments:/app/private/attachments
    depends_on:
      - postgres
  postgres:
    image: postgres:18
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=planka
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=planka
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "planka", "-U", "planka"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
          -f /var/lib/postgresql/backups/backup.sql'
volumes:
  planka_data:
  planka_attachments:
  postgres_data:
