manifestVersion: 1.0
name: planka
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Kanban-Board für Projektmanagement
  en: Open-source Kanban board for project management
description:
  de: Planka ist ein Open-Source Kanban-Board zur Projektverwaltung im Stil von Trello. Mit Boards, Listen, Karten, Labels, Checklisten und Dateianhängen. Dieses Template enthält Planka mit PostgreSQL.
  en: Planka is an open-source Kanban board for project management in the style of Trello. With boards, lists, cards, labels, checklists and file attachments. This template includes Planka with PostgreSQL.
developer: Planka
website: https://planka.app
repository: https://github.com/plankanban/planka
license: AGPL-3.0
categories:
  - productivity
domains:
  - userInput: HOST
    service: planka
    port: 1337
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
