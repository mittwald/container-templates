services:
  odoo:
    image: odoo:20
    ports:
      - "8069:8069"
    # The platform runs no separate init container: until the admin account
    # has been set up, each start (re)initialises the database, applies the
    # admin account and mail server, then runs the server. Each list entry
    # must stay below 800 characters.
    command:
      - python3
      - -c
      - |
        import os, subprocess, sys, psycopg2
        args = ["--proxy-mode", "--http-interface=0.0.0.0", "-d", "odoo", "--no-database-list", "--email-from=" + os.environ["SMTP_FROM"]]
        try:
            cur = psycopg2.connect(dbname="odoo").cursor()
            cur.execute("SELECT login FROM res_users WHERE id = 2")
            ready = cur.fetchone() not in (None, ("admin",))
        except psycopg2.Error:
            ready = False
        if not ready:
            subprocess.run(["odoo", *args, "-i", "base", "--load-language=de_DE", "--stop-after-init"], check=True)
            subprocess.run(["odoo", "shell", *args, "--no-http"], input=sys.argv[1], text=True, check=True)
        os.execvp("odoo", ["odoo", *args])
      - |
        import os
        e, ref = os.environ, env.ref
        ref("base.EUR").active = True
        env.company.write({"country_id": ref("base.de").id, "currency_id": ref("base.EUR").id, "email": e["SMTP_FROM"]})
        ref("base.user_admin").write({"login": e["ADMIN_EMAIL"], "email": e["ADMIN_EMAIL"], "password": e["ADMIN_PASSWORD"], "lang": "de_DE", "tz": "Europe/Berlin"})
        env["ir.mail_server"].create({"name": "mittwald", "smtp_host": "mail.agenturserver.de", "smtp_port": 587, "smtp_encryption": "starttls", "smtp_user": e["SMTP_USER"], "smtp_pass": e["SMTP_PASSWORD"]})
        env.cr.commit()
    environment:
      - TZ=Europe/Berlin
      - PGHOST=postgres
      - PGUSER=odoo
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USER=${MW_DELIVERYBOX_MAIN_USERNAME}
      - SMTP_PASSWORD=${MW_DELIVERYBOX_MAIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - odoo_data:/var/lib/odoo
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/postgresql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { pg_dumpall -h localhost -U "$$POSTGRES_USER" -f "$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  odoo_data:
  postgres_data:
