services:
  solr:
    image: solr:10
    environment:
      - TZ=Europe/Berlin
      - SOLR_HEAP=512m
      - SOLR_CONFIG_LIB_ENABLED=true
      - SOLR_MODULES=scripting,analysis-extras,langid,clustering,extraction
    volumes:
      - solr_data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8983/solr/admin/info/system"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  solr_data:
