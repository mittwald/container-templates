manifestVersion: 1.0
name: mautic
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Marketing-Automatisierung
  en: Open-source marketing automation
description:
  de: Mautic ist eine Open-Source Marketing-Automatisierungsplattform für E-Mail-Marketing, Kampagnenmanagement, Lead-Scoring und Kontaktverwaltung. Dieses Template enthält Mautic mit MariaDB.
  en: Mautic is an open-source marketing automation platform for email marketing, campaign management, lead scoring and contact management. This template includes Mautic with MariaDB.
developer: Mautic Community
website: https://mautic.org
repository: https://github.com/mautic/mautic
license: GPL-3.0
categories:
  - productivity
domains:
  - userInput: HOST
    service: mautic
    port: 80
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "DB_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
  - name: "DB_ROOT_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 16
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
