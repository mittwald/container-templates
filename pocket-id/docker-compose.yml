services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    ports:
      - "1411:1411"
    environment:
      - TZ=Europe/Berlin
      - PUBLIC_APP_URL=https://${HOST}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - pocket_id_data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
volumes:
  pocket_id_data:
