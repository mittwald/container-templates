manifestVersion: 1.0
name: pocket-id
version: "2.x.x"
icon: icon.svg
tagline:
  de: Einfacher OpenID Connect Provider mit Passkeys
  en: Simple OpenID Connect provider with passkeys
description:
  de: Pocket ID ist ein einfacher, selbst gehosteter OpenID Connect Provider, der Passkeys für die Authentifizierung nutzt. Ideal als leichtgewichtige Alternative zu größeren Identity-Providern.
  en: Pocket ID is a simple, self-hosted OpenID Connect provider that uses passkeys for authentication. Ideal as a lightweight alternative to larger identity providers.
developer: Pocket ID
website: https://pocket-id.org
repository: https://github.com/pocket-id/pocket-id
license: MIT
categories:
  - security
domains:
  - userInput: HOST
    service: pocket-id
    port: 1411
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
