manifestVersion: 1.0
name:
  de: Pocket ID
  en: Pocket ID
version: "2.x.x"
type: standalone
tagline:
  de: OIDC-Provider mit Passkeys
  en: OIDC provider with passkeys
description:
  de: |
    **Pocket ID** ist ein schlanker, self-hosted OpenID-Connect- und OAuth-2.0-Provider, der Benutzer ausschließlich über Passkeys authentifiziert. Er ist eine übersichtliche Alternative zu umfangreichen Identity-Plattformen wie Keycloak oder Authentik, wenn Anwendungen eine gemeinsame Anmeldung benötigen, aber keine komplexe IAM-Suite erforderlich ist.

    Zentrale Funktionen:

    - Passwortlose Anmeldung mit Geräte-Passkeys oder Hardware-Schlüsseln
    - OpenID Connect und OAuth 2.0 für kompatible Anwendungen
    - Zentrale Verwaltung von Benutzern, Gruppen und Client-Anwendungen
    - Einfache Web-Oberfläche für Administration und Selbstverwaltung

    Für **Agenturen** kann Pocket ID eine einheitliche Anmeldung für interne Werkzeuge, Staging-Systeme oder ausgewählte Kundenanwendungen bereitstellen. Teammitglieder verwenden ihren Passkey statt zusätzlicher Passwörter, während Zugriffe zentral entzogen oder neuen Anwendungen zugeordnet werden können. Durch standardisierte OIDC-Schnittstellen lässt sich der Provider mit vielen bestehenden Produkten verbinden.

    Bei mittwald läuft **Pocket ID** als self-hosted Container in deutschen Rechenzentren; Identitäts- und Anmeldedaten verbleiben in der eigenen Infrastruktur, was die Einhaltung der DSGVO vereinfacht. Das Template aktiviert den Betrieb hinter dem Plattform-Proxy, erzeugt den benötigten Verschlüsselungsschlüssel und speichert Konfiguration sowie Identitätsdaten in einem persistenten Volume. Der erste Benutzer, der nach der Installation einen Passkey registriert, übernimmt die Administration der Instanz. Lizenz- oder Seat-Kosten fallen nicht an.
  en: |
    **Pocket ID** is a lightweight, self-hosted OpenID Connect and OAuth 2.0 provider that authenticates users exclusively with passkeys. It is a focused alternative to comprehensive identity platforms such as Keycloak or Authentik when applications need shared login without the complexity of a full IAM suite.

    Key features:

    - Passwordless sign-in with device passkeys or hardware security keys
    - OpenID Connect and OAuth 2.0 for compatible applications
    - Central management of users, groups and client applications
    - Straightforward web interface for administration and self-service

    For **agencies**, Pocket ID can provide unified sign-in for internal tools, staging systems and selected client applications. Team members use their passkey instead of additional passwords, while access can be revoked centrally or assigned to new applications. Standard OIDC interfaces connect the provider to many existing products.

    At mittwald, **Pocket ID** runs as a self-hosted container in German data centres; identity and sign-in data remains within the operator's infrastructure, simplifying GDPR compliance. The template enables operation behind the platform proxy, generates the required encryption key and stores configuration and identities in a persistent volume. The first user to register a passkey after installation becomes the instance administrator. No licence or seat costs apply.
developer: Pocket ID
website: https://pocket-id.org
repository: https://github.com/pocket-id/pocket-id
license:
  name: BSD-2-Clause
  link: https://spdx.org/licenses/BSD-2-Clause.html
categories:
  - security
domains:
  main:
    userInput: HOST
    service: pocket-id
    port: 1411
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "ENCRYPTION_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 44

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Erster Benutzer wird Admin
      en: First user becomes admin
    content:
      de: Der erste Benutzer, der nach der Installation einen Passkey registriert, wird automatisch zum Administrator.
      en: The first user to register a passkey after installation automatically becomes the administrator.
