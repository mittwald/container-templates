manifestVersion: 1.0
name:
  de: Chatwoot
  en: Chatwoot
version: "latest"
type: standalone
tagline:
  de: Kundensupport und Live-Chat
  en: Customer support and live chat
description:
  de: |
    **Chatwoot** ist eine Plattform für Kundenkommunikation und Support und eine self-hosted Alternative zu Intercom, Zendesk oder Freshdesk. Anfragen aus Live-Chat, E-Mail und Messengern laufen in gemeinsamen Postfächern zusammen, sodass Teams Kundengespräche zentral, nachvollziehbar und gemeinschaftlich bearbeiten können.

    Zentrale Funktionen:

    - Einbettbares Live-Chat-Widget für Websites und Anwendungen
    - Gemeinsame Postfächer über mehrere Kanäle (E-Mail, Chat, Social, Messenger)
    - Automatisierungen, Canned Responses, Labels und Zuweisungsregeln
    - Team-Zusammenarbeit mit privaten Notizen, Berichten und REST-API

    Für **Agenturen** eignet sich Chatwoot, um Support für eigene Kunden und deren Endkunden zu bündeln: Das Live-Chat-Widget lässt sich in Kundenwebsites einbetten, mehrere Postfächer trennen Mandate voneinander, und Automatisierungen beschleunigen wiederkehrende Abläufe. So entsteht ein nachvollziehbarer Support-Kanal, ohne Kundenkommunikation an externe SaaS-Anbieter zu geben.

    Bei mittwald läuft **Chatwoot** als self-hosted Container in deutschen Rechenzentren; Konversationen, Kontakte und Inhalte verbleiben unter der Kontrolle der Agentur und werden nicht an externe SaaS-Anbieter übertragen, was die Einhaltung der DSGVO vereinfacht. Dieses Template enthält Chatwoot mit PostgreSQL und Redis und bindet einen SMTP-Dienst für Benachrichtigungen an – ohne nutzungsabhängige Lizenz- oder Seat-Kosten.
  en: |
    **Chatwoot** is a customer communication and support platform and a self-hosted alternative to Intercom, Zendesk or Freshdesk. Requests from live chat, email and messengers come together in shared inboxes, so teams can handle customer conversations centrally, transparently and collaboratively.

    Key features:

    - Embeddable live-chat widget for websites and applications
    - Shared inboxes across multiple channels (email, chat, social, messengers)
    - Automations, canned responses, labels and assignment rules
    - Team collaboration with private notes, reports and a REST API

    For **agencies**, Chatwoot is ideal for consolidating support for their own clients and those clients' end customers: the live-chat widget embeds into client websites, multiple inboxes separate mandates, and automations speed up recurring tasks. This creates a traceable support channel without handing customer communication to external SaaS providers.

    At mittwald, **Chatwoot** runs as a self-hosted container in German data centres; conversations, contacts and content stay under the agency's control and are not transmitted to external SaaS providers, simplifying GDPR compliance. This template includes Chatwoot with PostgreSQL and Redis and connects an SMTP service for notifications — with no usage-based licence or seat costs.
developer: Chatwoot Inc.
website: https://www.chatwoot.com
repository: https://github.com/chatwoot/chatwoot
license:
  name: MIT
  link: https://spdx.org/licenses/MIT.html
categories:
  - communication
domains:
  main:
    userInput: HOST
    service: rails
    port: 3000
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "SMTP_HOST"
    label:
      de: SMTP-Host
      en: SMTP host
    positionMeta: { step: "common", index: 2, section: "email" }
    defaultValue: "mail.agenturserver.de"
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "SMTP_PORT"
    label:
      de: SMTP-Port für STARTTLS
      en: SMTP port for STARTTLS
    positionMeta: { step: "common", index: 3, section: "email" }
    defaultValue: "587"
    required: true
    validationSchema: '{ "type": "string", "pattern": "^[0-9]{1,5}$" }'
  - name: "SMTP_USER"
    label:
      de: SMTP-Benutzer
      en: SMTP username
    positionMeta: { step: "common", index: 4, section: "email" }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "SMTP_PASSWORD"
    label:
      de: SMTP-Passwort
      en: SMTP password
    positionMeta: { step: "common", index: 5, section: "email" }
    format: "password"
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "SMTP_FROM"
    label:
      de: Absenderadresse
      en: Sender address
    positionMeta: { step: "common", index: 6, section: "email" }
    format: "email"
    required: true
    validationSchema: '{ "type": "string", "format": "email" }'
systemInputs:
  - name: "SECRET_KEY_BASE"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 64
        - identifier: hex
          ruleType: charPool
          charPools: [numbers, lowercase]
          min: 1
  - name: "REDIS_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Einrichtung beim ersten Aufruf
      en: Setup on first access
    content:
      de: Beim ersten Aufruf führt dich Chatwoot durch die Einrichtung und legt das Administratorkonto an. Die öffentliche Registrierung ist deaktiviert; weitere Nutzende lädst du innerhalb von Chatwoot ein.
      en: On first access, Chatwoot guides you through the setup and creates the administrator account. Public sign-up is disabled; you invite additional users from within Chatwoot.
