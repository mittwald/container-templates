manifestVersion: 1.0
name: chatwoot
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Kundenkommunikationsplattform
  en: Open-source customer communication platform
description:
  de: Chatwoot ist eine Open-Source Kundenkommunikationsplattform mit Live-Chat, E-Mail, Social Media und Messenger-Integration. Dieses Template enthält Chatwoot mit PostgreSQL (pgvector) und Redis.
  en: Chatwoot is an open-source customer communication platform with live chat, email, social media and messenger integration. This template includes Chatwoot with PostgreSQL (pgvector) and Redis.
developer: Chatwoot
website: https://www.chatwoot.com
repository: https://github.com/chatwoot/chatwoot
license: MIT
categories:
  - communication
domains:
  - userInput: HOST
    service: chatwoot
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_KEY_BASE"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
  - name: "REDIS_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
