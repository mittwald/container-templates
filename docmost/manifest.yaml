manifestVersion: 1.0
name:
  de: Docmost
  en: Docmost
version: "latest"
type: standalone
tagline:
  de: Kollaborative Wiki- und Dokumentationsplattform
  en: Collaborative wiki and documentation platform
description:
  de: |
    **Docmost** ist eine kollaborative Wiki- und Dokumentationsplattform und eine self-hosted Alternative zu Notion oder Confluence. Die Software ermöglicht Teams, Wissen strukturiert zu erfassen, gemeinsam zu bearbeiten und geordnet zu verwalten – mit Echtzeit-Kollaboration, flexibler Seitenhierarchie und abgestuften Zugriffsrechten in einer Oberfläche.

    Zentrale Funktionen:

    - Echtzeit-Kollaboration: mehrere Nutzende bearbeiten Seiten gleichzeitig ohne Konflikte
    - Spaces für getrennte Wissensbereiche (z. B. nach Projekt, Team oder Kunde) mit eigenen Berechtigungen
    - Hierarchische Seitenstruktur mit verschachtelten Unterseiten
    - Rich-Text-Editor mit Kommentarfunktion, Seitenversionen und Volltextsuche

    Für **Agenturen** bietet Docmost eine zentrale Plattform für internes Wissensmanagement und kundenbezogene Dokumentation: Projekt-Handbücher, Onboarding-Dokumente und technische Spezifikationen lassen sich in separaten Spaces ablegen. Pro Kundenprojekt kann ein eigener Space eingerichtet werden, auf den nur die jeweils zuständigen Teammitglieder zugreifen. Damit entfällt die Streuung von Informationen über verschiedene Tools und E-Mail-Threads.

    Bei mittwald läuft **Docmost** als self-hosted Container in deutschen Rechenzentren; alle Inhalte verbleiben vollständig unter der Kontrolle der Agentur und werden nicht an externe SaaS-Anbieter übertragen, was die Einhaltung der DSGVO vereinfacht. Dieses Template enthält Docmost zusammen mit einer PostgreSQL-Datenbank und Redis – ohne nutzungsabhängige Lizenz- oder Seat-Kosten.
  en: |
    **Docmost** is a collaborative wiki and documentation platform and a self-hosted alternative to Notion or Confluence. It enables teams to capture knowledge in a structured way, edit it collaboratively and keep it organised — with real-time collaboration, flexible page hierarchies and granular access rights.

    Key features:

    - Real-time collaboration: multiple users edit pages simultaneously without conflicts
    - Spaces for separate knowledge areas (e.g. by project, team or client) with individual permissions
    - Hierarchical page structure with nested sub-pages
    - Rich-text editor with comment function, page versions and full-text search

    For **agencies**, Docmost provides a central platform for internal knowledge management and client-facing documentation: project handbooks, onboarding documents and technical specifications can be stored in separate spaces, each accessible only to the assigned team members. This eliminates information scattered across different tools and email threads.

    At mittwald, **Docmost** runs as a self-hosted container in German data centres; all content stays under the agency's control and is not transmitted to external SaaS providers, simplifying GDPR compliance. This template includes Docmost with a PostgreSQL database and Redis — with no usage-based licence or seat costs.
developer: Docmost
website: https://docmost.com
repository: https://github.com/docmost/docmost
license:
  name: AGPL-3.0
  link: https://spdx.org/licenses/AGPL-3.0.html
categories:
  - productivity
domains:
  - userInput: HOST
    service: docmost
    port: 3000
    purpose: main
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "APP_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Erster Nutzer wird Admin
      en: First user becomes admin
    content:
      de: Der erste Nutzer, der sich nach der Installation registriert, wird automatisch zum Administrator.
      en: The first user to register after installation automatically becomes the administrator.
