manifestVersion: 1.0
name:
  de: Docmost
  en: Docmost
version: "latest"
type: standalone
tagline:
  de: Kollaborative Wiki- und Dokumentationsplattform
  en: Collaborative wiki and documentation platform
description:
  de: Docmost ist eine kollaborative Wiki- und Dokumentationsplattform mit Echtzeit-Bearbeitung, Seitenstruktur und Berechtigungsverwaltung. Dieses Template enthält Docmost mit PostgreSQL und Redis.
  en: Docmost is a collaborative wiki and documentation platform with real-time editing, page hierarchy and permission management. This template includes Docmost with PostgreSQL and Redis.
developer: Docmost
website: https://docmost.com
repository: https://github.com/docmost/docmost
license:
  name: AGPL-3.0
  link: https://spdx.org/licenses/AGPL-3.0.html
categories:
  - productivity
domains:
  - userInput: HOST
    service: docmost
    port: 3000
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "APP_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Erster Nutzer wird Admin
      en: First user becomes admin
    content:
      de: Der erste Nutzer, der sich nach der Installation registriert, wird automatisch zum Administrator.
      en: The first user to register after installation automatically becomes the administrator.
