manifestVersion: 1.0
name:
  de: OpenSearch
  en: OpenSearch
version: "3.x.x"
type: component
tagline:
  de: Verteilte Such- und Analyse-Engine
  en: Distributed search and analytics engine
description:
  de: |
    **OpenSearch** ist eine verteilte Such- und Analyse-Engine auf Basis von Apache Lucene und eine Open-Source-Alternative zu kostenpflichtigen Managed-Diensten wie Elastic Cloud oder Algolia. Sie bietet Volltextsuche, Aggregationen und Log-Analyse über eine einheitliche REST-API und lässt sich als Backend-Baustein in vielfältige Anwendungsarchitekturen integrieren.

    Zentrale Funktionen:

    - Volltextsuche mit Relevanz-Ranking auf Basis von Apache Lucene
    - Aggregationen und Metriken für analytische Auswertungen und Dashboards
    - Log- und Ereignis-Analyse für Observability-Szenarien
    - REST-API mit JSON-Abfragesprache für einfache Anbindung
    - Horizontale Skalierung durch Sharding und Replikation
    - Zugriffssteuerung über rollenbasierte Sicherheits-Plugins

    Für **Werbe-, Web- und Digitalagenturen** fungiert OpenSearch als Such- und Analyse-Backend hinter Kundenanwendungen: Online-Shops und Portale nutzen OpenSearch für schnelle, relevanzbewertete Produktsuche; Content-Plattformen binden es für Volltextsuche über Artikelarchive ein; und Observability-Setups sammeln Anwendungslogs zentral zur Auswertung und Fehlerverfolgung. OpenSearch lässt sich als isolierter Dienst in bestehende Container-Stacks einbinden, ohne die Anwendungslogik zu verändern, und spricht über seine REST-API gängige Client-Bibliotheken in Java, Python und anderen Sprachen an.

    Bei mittwald läuft **OpenSearch** als self-hosted Container in deutschen Rechenzentren; die indizierten Daten und Abfrage-Logs bleiben vollständig unter Kontrolle der Agentur oder ihrer Kunden und werden nicht an Drittanbieter übertragen — ein wesentlicher Vorteil gegenüber proprietären Managed-Suchdiensten in Bezug auf die DSGVO-Konformität. Dieses Template enthält OpenSearch als eigenständigen Dienst und ist nach der Konfiguration des Admin-Passworts sofort betriebsbereit. Da keine nutzungsabhängigen Lizenzkosten anfallen, lässt sich die Lösung auch beim Betrieb mehrerer Kundenprojekte wirtschaftlich einsetzen.
  en: |
    **OpenSearch** is a distributed search and analytics engine built on Apache Lucene and an open-source alternative to paid managed services such as Elastic Cloud or Algolia. It provides full-text search, aggregations and log analysis through a unified REST API, and can be integrated as a backend building block into a wide range of application architectures.

    Key features:

    - Full-text search with relevance ranking based on Apache Lucene
    - Aggregations and metrics for analytical evaluations and dashboards
    - Log and event analysis for observability scenarios
    - REST API with JSON query language for straightforward integration
    - Horizontal scaling through sharding and replication
    - Access control via role-based security plugins

    For **advertising, web and digital agencies**, OpenSearch serves as a search and analytics backend behind client applications: online shops and portals use OpenSearch for fast, relevance-ranked product search; content platforms integrate it for full-text search across article archives; and observability setups collect application logs centrally for analysis. OpenSearch can be embedded as an isolated service into existing container stacks without modifying application logic, and supports common client libraries in Java, Python and other languages through its REST API.

    At mittwald, **OpenSearch** runs as a self-hosted container in German data centres; the indexed data and query logs remain fully under the control of the agency or its clients and are not transferred to third-party providers, supporting GDPR compliance. This template includes OpenSearch as a standalone service and is ready to use immediately after configuring the admin password. As there are no usage-based licence costs, the solution can be used economically even when running multiple client projects.
developer: OpenSearch Project
website: https://opensearch.org
repository: https://github.com/opensearch-project/OpenSearch
license:
  name: Apache-2.0
  link: https://spdx.org/licenses/Apache-2.0.html
categories:
  - development
userInputs:
  - name: "ADMIN_PASSWORD"
    label:
      de: Admin Passwort
      en: Admin Password
    positionMeta: { step: "adminuser", index: 5 }
    format: "password"
    required: true
    validationSchema: '{ "type": "string", "minLength": 12, "format": "password" }'

help:
  technicalDetails:
  - key:
      de: Hostname
      en: Hostname
    value: ${opensearch.hostname}
  - key:
      de: Port
      en: Port
    value: 9200/TCP
  - key:
      de: Admin Passwort
      en: Admin Password
    value: ${opensearch.env.OPENSEARCH_INITIAL_ADMIN_PASSWORD}
  alerts:
  - status: info
    heading:
      de: TLS-Check deaktiviert
      en: TLS check disabled
    content:
      de: Verbindungen zu OpenSearch werden hergestellt, ohne das Serverzertifikat zu überprüfen. Dies kann in Entwicklungs- oder Testumgebungen sinnvoll sein, wird für produktive Systeme jedoch nicht empfohlen.
      en: Connections to OpenSearch are established without verifying the server certificate. This may be useful in development or test environments, but is not recommended for production systems.
