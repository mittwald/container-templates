name: Validate manifests

on:
  pull_request:
    paths:
      - "**/docker-compose.yml"
      - "**/docker-compose.dev.yml"
      - "**/icon.svg"
      - "**/manifest.yaml"
      - "manifest.schema.json"
      - "validate.mjs"
      - "dev.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - ".github/workflows/validate-manifests.yml"
  push:
    branches: [main]
    paths:
      - "**/docker-compose.yml"
      - "**/docker-compose.dev.yml"
      - "**/icon.svg"
      - "**/manifest.yaml"
      - "manifest.schema.json"
      - "validate.mjs"
      - "dev.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - ".github/workflows/validate-manifests.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate scripts, manifests and screenshot images
        run: pnpm test
      - name: Validate base and local Compose configurations
        run: pnpm app validate
