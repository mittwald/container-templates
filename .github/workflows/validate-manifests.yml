name: Validate manifests

on:
  pull_request:
    paths:
      - "**/manifest.yaml"
      - "manifest.schema.json"
      - "validate-screenshots.py"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - ".github/workflows/validate-manifests.yml"
  push:
    branches: [main]
    paths:
      - "**/manifest.yaml"
      - "manifest.schema.json"
      - "validate-screenshots.py"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install check-jsonschema pyyaml pillow
      - name: Validate manifest.yaml files against schema
        run: check-jsonschema --schemafile manifest.schema.json */manifest.yaml
      - name: Validate screenshot images
        run: python validate-screenshots.py
