manifestVersion: 1.0
name:
  de: Chroma
  en: Chroma
version: "latest"
type: component
tagline:
  de: Open-Source Vektordatenbank für KI-Anwendungen
  en: Open-source vector database for AI applications
description:
  de: |
    **Chroma** ist eine Open-Source-Vektordatenbank für die persistente Speicherung und Abfrage von Embeddings und eine self-hosted Alternative zu Cloud-Vektordatenbanken wie Pinecone oder Weaviate Cloud. Chroma richtet sich an Entwickler, die semantische Suche, Retrieval Augmented Generation (RAG) oder Ähnlichkeitsvergleiche in eigene Anwendungen integrieren möchten, ohne auf externe Dienste angewiesen zu sein.

    Zentrale Funktionen:

    - Schnelle Speicherung und Abfrage von Embedding-Vektoren in Collections
    - Metadaten-Filter für präzise und kombinierte Suchanfragen
    - REST-API und native Clients für Python und JavaScript/TypeScript
    - Persistente Datenspeicherung für produktive Einsatzszenarien

    Für **Agenturen** fungiert Chroma als technisches Backend hinter KI-gestützten Features in Kundenprojekten. Typische Einsatzfälle sind semantische Dokumentensuche, RAG-Systeme für Chat-Assistenten oder Empfehlungsfunktionen in Content-Plattformen. Als eigenständige Komponente lässt sich Chroma in bestehende Stacks integrieren – von Python-basierten Backend-Services bis zu Node.js-Anwendungen – ohne grundlegende Architekturänderungen.

    Bei mittwald läuft Chroma als self-hosted Container in deutschen Rechenzentren; gespeicherte Embeddings und Ausgangsdaten verbleiben vollständig im eigenen System und werden nicht an Drittanbieter weitergegeben, was die Einhaltung der DSGVO vereinfacht. Dieses Template enthält Chroma als eigenständigen Service. Da keine nutzungsabhängigen Lizenzgebühren anfallen, ist die Lösung wirtschaftlich skalierbar, auch wenn Datenmenge und Abfragen mit wachsenden Kundenprojekten zunehmen.
  en: |
    **Chroma** is an open-source vector database for storing and querying embeddings, and a self-hosted alternative to cloud vector databases such as Pinecone or Weaviate Cloud. It enables developers to integrate semantic search, RAG or similarity comparison into applications without depending on external services.

    Key features:

    - Fast storage and retrieval of embedding vectors in collections
    - Metadata filters for precise and combined queries
    - REST API with native Python and JavaScript/TypeScript clients
    - Persistent data storage for production use cases

    For **agencies**, Chroma serves as the technical backend for AI-powered features in client projects: semantic document search, RAG systems for chat assistants, or recommendation features in content platforms. As a standalone component, it slots into existing stacks — from Python backends to Node.js — without requiring architecture changes.

    At mittwald, Chroma runs as a self-hosted container in German data centres; stored embeddings and source data remain entirely within the operator's own system, simplifying GDPR compliance. This template includes Chroma as a standalone service. As there are no usage-based licence fees, the solution scales economically as data volumes and query counts grow with client projects.
