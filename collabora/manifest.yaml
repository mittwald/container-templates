manifestVersion: 1.0
name:
  de: Collabora Online
  en: Collabora Online
version: "latest"
type: component
tagline:
  de: Online-Office-Suite für kollaboratives Arbeiten
  en: Online office suite for collaborative editing
description:
  de: Collabora Online ist eine leistungsstarke Online-Office-Suite basierend auf LibreOffice. Ermöglicht kollaboratives Bearbeiten von Dokumenten, Tabellen und Präsentationen direkt im Browser. Ideal zur Integration mit Nextcloud oder anderen WOPI-kompatiblen Plattformen.
  en: Collabora Online is a powerful online office suite based on LibreOffice. Enables collaborative editing of documents, spreadsheets and presentations directly in the browser. Ideal for integration with Nextcloud or other WOPI-compatible platforms.
developer: Collabora Productivity
website: https://www.collaboraoffice.com
repository: https://github.com/CollaboraOnline/online
license:
  name: MPL-2.0
  link: https://spdx.org/licenses/MPL-2.0.html
categories:
  - productivity
domains:
  - userInput: HOST
    service: collabora
    port: 9980
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Server-URL
      en: Server URL
    value: http://${collabora.hostname}:9980
  alerts:
  - status: info
    heading:
      de: Konfiguration in Nextcloud notwendig
      en: Configuration required in Nextcloud
    content:
      de: Du findest eine Anleitung zur Konfiguration in Nextcloud in unserem Developer Portal.
      en: You can find instructions for configuring Collabora in Nextcloud on our Developer Portal.
    linkText:
      de: Konfiguration in Nextcloud
      en: Configuration in Nextcloud
    link:
      de: https://developer.mittwald.de/de/docs/v2/guides/apps/collabora/#integration-in-nextcloud
      en: https://developer.mittwald.de/en/docs/v2/guides/apps/collabora/#integration-in-nextcloud
