services:
  collabora:
    image: collabora/code:latest
    ports:
      - "9980:9980"
    environment:
      - TZ=Europe/Berlin
      # Nur diese Anwendung darf Dokumente oeffnen. aliasgroup1 schaltet
      # alias_groups in den Modus "groups"; ohne Eintrag gilt "first", und
      # Collabora vertraut dem ersten Host, der sich nach dem Start meldet.
      # Weitere Anwendungen kommen als aliasgroup2, aliasgroup3 ... hinzu.
      - aliasgroup1=https://${WOPI_HOST}:443
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:server_name=${HOST}
