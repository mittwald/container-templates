services:
  shlink:
    image: shlinkio/shlink:5
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Berlin
      - TIMEZONE=Europe/Berlin
      - DEFAULT_DOMAIN=${SHORT_HOST}
      - IS_HTTPS_ENABLED=true
      - GEOLITE_LICENSE_KEY=${GEOLITE_LICENSE_KEY}
      - DB_DRIVER=postgres
      - DB_NAME=shlink
      - DB_USER=shlink
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - INITIAL_API_KEY=${INITIAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
  shlink-web-client:
    image: shlinkio/shlink-web-client:4
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Berlin
    depends_on:
      - shlink
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=shlink
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=shlink
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlink -d shlink"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/postgresql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { pg_dumpall -h localhost -U "$$POSTGRES_USER" -f "$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  postgres_data:
