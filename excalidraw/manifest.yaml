manifestVersion: 1.0
name: excalidraw
version: "latest"
icon: icon.svg
tagline:
  de: Virtuelles Whiteboard zum Skizzieren
  en: Virtual whiteboard for sketching
description:
  de: Excalidraw ist ein virtuelles Open-Source Whiteboard zum Erstellen von handgezeichnet wirkenden Diagrammen, Wireframes und Skizzen direkt im Browser.
  en: Excalidraw is a virtual open-source whiteboard for creating hand-drawn style diagrams, wireframes and sketches right in the browser.
developer: Excalidraw
website: https://excalidraw.com
repository: https://github.com/excalidraw/excalidraw
license: MIT
categories:
  - productivity
domains:
  - userInput: HOST
    service: excalidraw
    port: 80
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
