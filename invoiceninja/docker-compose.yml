services:
  invoiceninja:
    image: invoiceninja/invoiceninja-debian:latest
    environment:
      - TZ=Europe/Berlin
      - APP_NAME=Invoice Ninja
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://${HOST}
      - APP_KEY=${APP_KEY}
      - REQUIRE_HTTPS=true
      - TRUSTED_PROXIES=*
      - IS_DOCKER=true
      - FILESYSTEM_DISK=debian_docker
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=invoiceninja
      - DB_USERNAME=invoiceninja
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PDF_GENERATOR=snappdf
      - IN_USER_EMAIL=${ADMIN_EMAIL}
      - IN_PASSWORD=${ADMIN_PASSWORD}
      - MAIL_MAILER=smtp
      - MAIL_HOST=${SMTP_HOST}
      - MAIL_PORT=${SMTP_PORT}
      - MAIL_USERNAME=${SMTP_USER}
      - MAIL_PASSWORD=${SMTP_PASSWORD}
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=${SMTP_FROM}
      - MAIL_FROM_NAME=Invoice Ninja
      - SCOUT_DRIVER=null
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    command:
      - /bin/sh
      - -c
      - >-
        printf '%s\n' 'server {' '  listen 80 default_server;' '  server_name _;'
        '  root /var/www/html/public;' '  client_max_body_size 10M;'
        '  add_header X-Frame-Options "SAMEORIGIN";'
        '  add_header X-Content-Type-Options "nosniff";' '  index index.php;'
        '  charset utf-8;' '  location / { try_files $$uri $$uri/ /index.php?$$query_string; }'
        '  location = /favicon.ico { access_log off; log_not_found off; }'
        '  location = /robots.txt { access_log off; log_not_found off; }'
        '  error_page 404 /index.php;' '  location ~ \.php$$ {'
        '    fastcgi_pass invoiceninja:9000;'
        '    fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;'
        '    include fastcgi_params;' '  }' '  location ~ /\.(?!well-known).* { deny all; }'
        '}' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    volumes:
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      invoiceninja:
        condition: service_healthy
  mariadb:
    image: mariadb:lts
    environment:
      - TZ=Europe/Berlin
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=invoiceninja
      - MARIADB_USER=invoiceninja
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/mysql/backups && \
        mariadb-dump -u root -p"$MARIADB_ROOT_PASSWORD" --all-databases | gzip \
          > /var/lib/mysql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/mysql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  app_public:
  app_storage:
  mariadb_data:
