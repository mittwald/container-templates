manifestVersion: 1.0
name:
  de: Invoice Ninja
  en: Invoice Ninja
version: "5.x.x"
type: standalone
tagline:
  de: Angebote und Rechnungen verwalten
  en: Manage quotes and invoices
description:
  de: |
    **Invoice Ninja** ist eine Plattform für Angebote, Rechnungen und Zahlungsprozesse und eine self-hosted Alternative zu FreshBooks oder QuickBooks Online. Kunden, Leistungen und Dokumente werden zentral verwaltet; wiederkehrende Rechnungen und Zahlungsstatus reduzieren manuelle Verwaltungsarbeit.

    Zentrale Funktionen:

    - Angebote, Rechnungen, Gutschriften und wiederkehrende Abrechnungen
    - Kundenportal mit Dokumenten, Zahlungsverlauf und Online-Zahlungen
    - Zeiterfassung, Aufgaben, Projekte und abrechenbare Aufwände
    - Berichte, Vorlagen, API und Integrationen für Zahlungsanbieter

    Für **Agenturen** verbindet Invoice Ninja Projektarbeit und Abrechnung. Zeiten und Leistungen werden Kunden zugeordnet, Angebote in Rechnungen überführt und regelmäßige Wartungs- oder Hostingpakete automatisiert fakturiert. Das Kundenportal stellt Dokumente nachvollziehbar bereit, während API und Webhooks individuelle Workflows mit CRM-, Projekt- oder Buchhaltungssystemen ermöglichen.

    Bei mittwald läuft **Invoice Ninja** als self-hosted Anwendung in deutschen Rechenzentren. Das Template enthält Invoice Ninja 5 mit MariaDB, Redis und Nginx, legt das angegebene Administratorkonto an und konfiguriert SMTP für den Dokumentversand. MariaDB wird über das mittwald Backup-Label gesichert. Kunden-, Projekt- und Rechnungsdaten verbleiben in der eigenen Infrastruktur und unterstützen DSGVO-gerechte Betriebsprozesse. Der Einsatz unterliegt der Elastic License 2.0.
  en: |
    **Invoice Ninja** is a platform for quotes, invoices and payment workflows and a self-hosted alternative to FreshBooks or QuickBooks Online. Clients, services and documents are managed centrally, while recurring invoices and payment statuses reduce manual administration.

    Key features:

    - Quotes, invoices, credits and recurring billing
    - Client portal with documents, payment history and online payments
    - Time tracking, tasks, projects and billable work
    - Reports, templates, API and payment-provider integrations

    For **agencies**, Invoice Ninja connects project delivery with billing. Time and services are assigned to clients, quotes are converted into invoices and recurring maintenance or hosting packages are billed automatically. The client portal provides traceable document access, while APIs and webhooks support custom workflows with CRM, project-management or accounting systems.

    At mittwald, **Invoice Ninja** runs as a self-hosted application in German data centres. The template includes Invoice Ninja 5 with MariaDB, Redis and Nginx, creates the specified administrator account and configures SMTP for document delivery. MariaDB is protected through the mittwald backup label. Client, project and invoice data remain within the operator's infrastructure, supporting GDPR-conscious processes. Use is governed by the Elastic License 2.0.
developer: Invoice Ninja, Inc.
website: https://invoiceninja.com
repository: https://github.com/invoiceninja/invoiceninja
support: https://invoiceninja.github.io
license:
  name: Elastic License 2.0
  link: https://github.com/invoiceninja/invoiceninja/blob/v5-stable/LICENSE
categories:
  - productivity
domains:
  - userInput: HOST
    service: nginx
    port: 80
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_EMAIL"
    label:
      de: Admin E-Mail-Adresse
      en: Admin email address
    positionMeta: { step: "adminuser", index: 2 }
    format: "email"
    required: true
    validationSchema: '{ "type": "string", "format": "email" }'
  - name: "ADMIN_PASSWORD"
    label:
      de: Admin Passwort
      en: Admin password
    positionMeta: { step: "adminuser", index: 3 }
    format: "password"
    required: true
    validationSchema: '{ "type": "string", "minLength": 12 }'
  - name: "SMTP_HOST"
    label:
      de: SMTP-Host
      en: SMTP host
    positionMeta: { step: "common", index: 4, section: "email" }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "SMTP_PORT"
    label:
      de: SMTP-Port für STARTTLS
      en: SMTP port for STARTTLS
    positionMeta: { step: "common", index: 5, section: "email" }
    defaultValue: "587"
    required: true
    validationSchema: '{ "type": "string", "pattern": "^[0-9]{1,5}$" }'
  - name: "SMTP_USER"
    label:
      de: SMTP-Benutzer
      en: SMTP username
    positionMeta: { step: "common", index: 6, section: "email" }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "SMTP_PASSWORD"
    label:
      de: SMTP-Passwort
      en: SMTP password
    positionMeta: { step: "common", index: 7, section: "email" }
    format: "password"
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "SMTP_FROM"
    label:
      de: Absenderadresse
      en: Sender address
    positionMeta: { step: "common", index: 8, section: "email" }
    format: "email"
    required: true
    validationSchema: '{ "type": "string", "format": "email" }'
systemInputs:
  - name: "APP_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
        - identifier: hex
          ruleType: charPool
          charPools: [numbers, lowercase]
          min: 1
  - name: "MARIADB_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools: [numbers]
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
  - name: "MARIADB_ROOT_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 16
        - identifier: numbers
          ruleType: charPool
          charPools: [numbers]
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Admin E-Mail-Adresse
      en: Admin email address
    value: ${invoiceninja.env.IN_USER_EMAIL}
  - key:
      de: Admin Passwort
      en: Admin password
    value: ${invoiceninja.env.IN_PASSWORD}
