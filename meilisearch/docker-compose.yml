services:
  meilisearch:
    image: getmeili/meilisearch:v1.51
    ports:
      - "7700:7700"
    environment:
      - TZ=Europe/Berlin
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
      # Meilisearch startet nicht, wenn die Datenbank aelter ist als die
      # Engine. Da der Tag auf Minor gepinnt ist, migriert dieses Flag nur
      # bei einem bewussten Versionswechsel; sonst ist es wirkungslos.
      - MEILI_UPGRADE_DB=true
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  meili_data:
