manifestVersion: 1.0
name: langfuse
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source LLM-Observability und Analyse
  en: Open-source LLM observability and analytics
description:
  de: Langfuse ist eine Open-Source LLM-Observability-Plattform zur Analyse, zum Debugging und zur Optimierung von LLM-Anwendungen. Dieses Template enthält Langfuse mit PostgreSQL.
  en: Langfuse is an open-source LLM observability platform for analyzing, debugging and optimizing LLM applications. This template includes Langfuse with PostgreSQL.
developer: Langfuse
website: https://langfuse.com
repository: https://github.com/langfuse/langfuse
license: MIT
categories:
  - ai
domains:
  - userInput: HOST
    service: langfuse
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "NEXTAUTH_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "SALT"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
