services:
  fider:
    image: getfider/fider:stable
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
      - LOCALE=de
      - BASE_URL=https://${HOST}
      - DATABASE_URL=postgres://fider:${POSTGRES_PASSWORD}@postgres:5432/fider?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_NOREPLY=${SMTP_FROM}
      - EMAIL_SMTP_HOST=${SMTP_HOST}
      - EMAIL_SMTP_PORT=${SMTP_PORT}
      - EMAIL_SMTP_USERNAME=${SMTP_USER}
      - EMAIL_SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_SMTP_ENABLE_STARTTLS=true
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=fider
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=fider
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fider -d fider"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dumpall -h localhost -U "$POSTGRES_USER" | gzip \
          > /var/lib/postgresql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/postgresql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  postgres_data:
