categories:
  - development
help:
  technicalDetails:
  - key:
      de: Interne API-URL
      en: Internal API URL
    value: http://${gotenberg.hostname}:3000
  alerts:
  - status: warning
    heading:
      de: Keine eingebaute Authentifizierung
      en: No built-in authentication
    content:
      de: Gotenberg bringt keine eigene Anmeldung mit. Der Konvertierungsdienst wird deshalb nicht über eine Domain veröffentlicht und ist nur innerhalb des Stacks über den Hostnamen erreichbar. Sprich ihn ausschließlich aus Anwendungen desselben Stacks an.
      en: Gotenberg has no built-in sign-in. The conversion service is therefore not published via a domain and is only reachable inside the stack via its hostname. Address it exclusively from applications in the same stack.
  - status: info
    heading:
      de: API von Gotenberg 9
      en: Gotenberg 9 API
    content:
      de: Dieses Template nutzt Gotenberg 9. Gegenüber Version 8 haben sich Routen und Felder geändert, etwa `/forms/pdfengines/*` zu `/forms/pdf/*` und Nachbearbeitungen wie `merge` oder `pdfa` zu einer `stages`-Liste. Clients, die noch die API von Gotenberg 8 sprechen, erhalten `400` oder `404` und müssen laut Upgrade-Anleitung auf https://gotenberg.dev/docs/getting-started/upgrade angepasst werden.
      en: This template uses Gotenberg 9. Compared with version 8, routes and fields have changed, for example `/forms/pdfengines/*` to `/forms/pdf/*` and post-processing such as `merge` or `pdfa` to a `stages` list. Clients still speaking the Gotenberg 8 API receive `400` or `404` and need to be adapted according to the upgrade guide at https://gotenberg.dev/docs/getting-started/upgrade.
