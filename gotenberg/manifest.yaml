manifestVersion: 1.0
name: gotenberg
version: "8.x.x"
icon: icon.png
tagline:
  de: Dokumentenkonvertierung als API
  en: Document conversion as an API
description:
  de: Gotenberg ist eine Docker-basierte API zur Konvertierung von HTML, Markdown, Word, Excel und weiteren Formaten in PDF. Ideal als Microservice für Dokumentenverarbeitung in Webanwendungen.
  en: Gotenberg is a Docker-based API for converting HTML, Markdown, Word, Excel and other formats to PDF. Ideal as a microservice for document processing in web applications.
developer: Gotenberg
website: https://gotenberg.dev
repository: https://github.com/gotenberg/gotenberg
license: MIT
categories:
  - development
domains:
  - userInput: HOST
    service: gotenberg
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
