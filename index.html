ing für Websites und Services","en":"Uptime monitoring for websites and services"},"description":{"de":"Uptime Kuma ist ein selbst gehostetes Monitoring-Tool für Websites, APIs und Services. Mit Benachrichtigungen über verschiedene Kanäle, Statusseiten und detaillierten Antwortzeit-Statistiken. Dieses Template enthält Uptime Kuma mit MariaDB-Backend."},"categories":["monitoring"]},{"name":"vaultwarden","version":"latest","icon":"icon.svg","developer":"Vaultwarden","website":"https://github.com/dani-garcia/vaultwarden","repository":"https://github.com/dani-garcia/vaultwarden","license":"AGPL-3.0","tagline":{"de":"Selbst gehosteter Passwort-Manager","en":"Self-hosted password manager"},"description":{"de":"Vaultwarden ist eine leichtgewichtige, selbst gehostete Implementierung des Bitwarden-Servers. Verwalte deine Passwörter, Notizen und andere sensible Daten sicher mit PostgreSQL als Backend."},"categories":["productivity"]},{"name":"vikunja","version":"latest","icon":"icon.svg","developer":"Vikunja","website":"https://vikunja.io","repository":"https://kolaente.dev/vikunja/vikunja","license":"AGPL-3.0","tagline":{"de":"Open-Source Task- und Projektmanagement","en":"Open-source task and project management"},"description":{"de":"Vikunja ist eine Open-Source To-Do- und Projektmanagement-Anwendung mit Listen, Kanban-Boards, Gantt-Charts und Kalenderansicht. Dieses Template enthält Vikunja mit PostgreSQL-Backend."},"categories":["productivity"]}];
const catLabels = { productivity:"Produktivität", development:"Entwicklung", ai:"KI", security:"Sicherheit", monitoring:"Monitoring", communication:"Kommunikation", media:"Medien", ecommerce:"E-Commerce" };
const allCats = [...new Set(templates.flatMap(t => t.categories))].sort();
document.getElementById('total-count').textContent = templates.length;
document.getElementById('cat-count').textContent = allCats.length;
const filtersEl = document.getElementById('filters');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active'; allBtn.textContent = 'Alle'; allBtn.dataset.cat = '';
filtersEl.appendChild(allBtn);
allCats.forEach(c => { const btn = document.createElement('button'); btn.className = 'filter-btn'; btn.textContent = catLabels[c] || c; btn.dataset.cat = c; filtersEl.appendChild(btn); });
let activeCat = '';
filtersEl.addEventListener('click', e => { if (!e.target.classList.contains('filter-btn')) return; activeCat = e.target.dataset.cat; filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === activeCat)); render(); });
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', render);
function render() {
  const q = searchEl.value.toLowerCase();
  const filtered = templates.filter(t => {
    if (activeCat && !t.categories.includes(activeCat)) return false;
    if (q && !t.name.includes(q) && !t.tagline.de.toLowerCase().includes(q) && !t.developer.toLowerCase().includes(q)) return false;
    return true;
  });
  const grid = document.getElementById('grid');
  if (!filtered.length) { grid.innerHTML = '<div class="empty">Keine Templates gefunden.</div>'; return; }
  grid.innerHTML = filtered.map(t => `
    <div class="card" data-name="${t.name}">
      <div class="card-head">
        <div class="card-icon"><img src="${t.name}/${t.icon}" alt="${t.name}" loading="lazy"></div>
        <div><span class="card-title">${t.name}</span><span class="card-version">${t.version}</span></div>
      </div>
      <div class="card-tagline">${t.tagline.de}</div>
      <div class="card-footer">
        <div class="card-cats">${t.categories.map(c => `<span class="cat-badge cat-${c}">${catLabels[c]||c}</span>`).join('')}</div>
        <span class="card-license">${t.license}</span>
      </div>
    </div>`).join('');
}
const overlay = document.getElementById('modal-overlay');
document.getElementById('grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const t = templates.find(x => x.name === card.dataset.name); if (!t) return;
  document.getElementById('modal').innerHTML = `
    <button class="modal-close">&times;</button>
    <div class="modal-header">
      <div class="modal-icon"><img src="${t.name}/${t.icon}" alt="${t.name}"></div>
      <div><div class="modal-title">${t.name} <span class="card-version">${t.version}</span></div><div class="modal-dev">${t.developer}</div></div>
    </div>
    <div class="card-cats" style="margin-bottom:1rem">${t.categories.map(c => `<span class="cat-badge cat-${c}">${catLabels[c]||c}</span>`).join('')}</div>
    <div class="modal-desc">${t.description.de}</div>
    <div class="modal-meta">
      <div class="meta-item"><div class="meta-label">Website</div><div class="meta-value"><a href="${t.website}" target="_blank">${t.website.replace('https://','')}</a></div></div>
      <div class="meta-item"><div class="meta-label">Repository</div><div class="meta-value"><a href="${t.repository}" target="_blank">GitHub</a></div></div>
      <div class="meta-item"><div class="meta-label">Lizenz</div><div class="meta-value">${t.license}</div></div>
      <div class="meta-item"><div class="meta-label">Version</div><div class="meta-value">${t.version}</div></div>
    </div>`;
  overlay.classList.add('open');
});
overlay.addEventListener('click', e => { if (e.target === overlay || e.target.classList.contains('modal-close')) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('open'); });
render();
</script>
