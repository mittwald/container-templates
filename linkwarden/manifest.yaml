manifestVersion: 1.0
name: linkwarden
version: "latest"
icon: icon.svg
tagline:
  de: Kollaborativer Lesezeichen-Manager
  en: Collaborative bookmark manager
description:
  de: Linkwarden ist ein kollaborativer Lesezeichen-Manager zum Sammeln, Organisieren und Archivieren von Webseiten. Dieses Template enthält Linkwarden mit PostgreSQL.
  en: Linkwarden is a collaborative bookmark manager for collecting, organizing and archiving web pages. This template includes Linkwarden with PostgreSQL.
developer: Linkwarden
website: https://linkwarden.app
repository: https://github.com/linkwarden/linkwarden
license: AGPL-3.0
categories:
  - productivity
domains:
  - userInput: HOST
    service: linkwarden
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "NEXTAUTH_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
