services:
  vikunja:
    image: vikunja/vikunja:latest
    ports:
      - "3456:3456"
    environment:
      - TZ=Europe/Berlin
      - VIKUNJA_SERVICE_PUBLICURL=https://${HOST}
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_SECRET}
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_HOST=postgres
      - VIKUNJA_DATABASE_DATABASE=vikunja
      - VIKUNJA_DATABASE_USER=vikunja
      - VIKUNJA_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      vikunja-init:
        condition: service_completed_successfully
    volumes:
      - vikunja_files:/app/vikunja/files
  vikunja-init:
    image: busybox:stable
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /app/vikunja/files"]
    volumes:
      - vikunja_files:/app/vikunja/files
    restart: "no"
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=vikunja
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=vikunja
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 2s
      start_period: 30s
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dumpall -h localhost -U "$POSTGRES_USER" | gzip \
          > /var/lib/postgresql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/postgresql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  vikunja_files:
  postgres_data:
