services:
  vikunja:
    image: vikunja/vikunja:2
    ports:
      - "3456:3456"
    environment:
      - TZ=Europe/Berlin
      - VIKUNJA_SERVICE_PUBLICURL=https://${HOST}
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_SECRET}
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_HOST=postgres
      - VIKUNJA_DATABASE_DATABASE=vikunja
      - VIKUNJA_DATABASE_USER=vikunja
      - VIKUNJA_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - VIKUNJA_MAILER_ENABLED=true
      - VIKUNJA_MAILER_HOST=${SMTP_HOST}
      - VIKUNJA_MAILER_PORT=${SMTP_PORT}
      - VIKUNJA_MAILER_USERNAME=${SMTP_USER}
      - VIKUNJA_MAILER_PASSWORD=${SMTP_PASSWORD}
      - VIKUNJA_MAILER_FROMEMAIL=${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - vikunja_files:/app/vikunja/files
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=vikunja
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=vikunja
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 2s
      start_period: 30s
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/postgresql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { pg_dumpall -h localhost -U "$$POSTGRES_USER" -f "$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  vikunja_files:
  postgres_data:
