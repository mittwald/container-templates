manifestVersion: 1.0
name:
  de: Nextcloud + Euro-Office
  en: Nextcloud + Euro-Office
version: "stable"
type: standalone
tagline:
  de: Nextcloud mit integriertem Euro-Office
  en: Nextcloud with integrated Euro-Office
description:
  de: |
    **Nextcloud + Euro-Office** ist eine selbstgehostete Kollaborationsplattform für Dateispeicherung, Teamarbeit und Office-Bearbeitung — und eine Alternative zu Cloud-Diensten wie Google Workspace, Microsoft 365 oder Dropbox. Nextcloud übernimmt Dateispeicherung, Freigaben und Kommunikation, während Euro-Office die kollaborative Bearbeitung von Office-Dokumenten direkt im Browser ermöglicht.

    Zentrale Funktionen:

    - Dateispeicher und -synchronisation über Web, Desktop- und Mobile-Clients
    - Feingranulare Freigaben für interne Teams und externe Kontakte
    - Integrierte Online-Office-Bearbeitung von Text-, Tabellen- und Präsentationsdateien (Euro-Office)
    - Kalender- und Kontaktverwaltung mit CalDAV/CardDAV-Unterstützung
    - Versionsverwaltung für Dateien und Wiederherstellung früherer Versionen
    - Benutzer- und Gruppenverwaltung mit abgestuften Zugriffsrechten

    Für **Werbe-, Web- und Digitalagenturen** bietet diese Kombination eine zentrale Ablage für Kundenprojekte: Briefings, Entwürfe, Freigabedokumente und Präsentationen können in getrennte Ordner pro Kunde strukturiert und direkt mit Kunden oder externen Partnern geteilt werden. Abgestufte Zugriffsrechte sorgen dafür, dass jeder Kunde nur die für ihn freigegebenen Inhalte sieht. Euro-Office erlaubt dabei die gemeinsame Bearbeitung von Word-, Excel- und PowerPoint-kompatiblen Dokumenten im Browser, ohne dass Dateien per E-Mail ausgetauscht werden müssen.

    Bei mittwald läuft **Nextcloud + Euro-Office** als self-hosted Container in deutschen Rechenzentren; alle gespeicherten Dateien und Dokumente bleiben unter vollständiger Kontrolle der Agentur und werden nicht an Drittanbieter oder in Drittländer übertragen, was die DSGVO-Konformität erheblich vereinfacht. Dieses Template enthält Nextcloud und Euro-Office zusammen mit MariaDB als Datenbank und Redis als Cache und ist sofort einsatzbereit. Da keine Seat-Lizenzen anfallen, wächst die Nutzerbasis ohne zusätzliche Lizenzkosten mit.
  en: |
    **Nextcloud + Euro-Office** is a self-hosted collaboration platform for file storage, teamwork and office document editing — and an alternative to cloud services such as Google Workspace, Microsoft 365 or Dropbox. Nextcloud handles file storage, sharing and communication, while Euro-Office enables collaborative editing of office documents directly in the browser.

    Key features:

    - File storage and synchronisation via web, desktop and mobile clients
    - Fine-grained sharing for internal teams and external contacts
    - Integrated online office editing of text, spreadsheet and presentation files (Euro-Office)
    - Calendar and contact management with CalDAV/CardDAV support
    - File versioning and restoration of previous versions
    - User and group management with granular access rights

    For **advertising, web and digital agencies**, this combination provides a central repository for client projects: briefings, drafts, approval documents and presentations can be organised into separate folders per client and shared directly with clients or external partners. Granular access rights ensure that each client only sees the content shared with them. Euro-Office allows collaborative editing of Word, Excel and PowerPoint-compatible documents in the browser, without files needing to be exchanged by email.

    At mittwald, **Nextcloud + Euro-Office** runs as a self-hosted container in German data centres; all stored files and documents remain under the full control of the agency and are not transferred to third-party providers, which simplifies GDPR compliance. This template includes Nextcloud and Euro-Office together with MariaDB and Redis, and is ready to use immediately. As there are no per-seat licences, the user base can grow without additional licence costs.
developer: mittwald
website: https://nextcloud.com
repository: https://github.com/mittwald/nextcloud-eurooffice
license:
  name: AGPL-3.0
  link: https://spdx.org/licenses/AGPL-3.0.html
categories:
  - productivity
domains:
  - userInput: HOST
    service: nextcloud-euro-office
    port: 80
    purpose: nextcloud
  - userInput: EUROOFFICE_HOST
    service: eurooffice
    port: 80
    purpose: eurooffice
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "EUROOFFICE_HOST"
    label:
      de: Euro-Office Domain
      en: Euro-Office Domain
    positionMeta: { step: "common", index: 2 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_USER"
    label:
      de: Admin Benutzername
      en: Admin username
    positionMeta: { step: "adminuser", index: 5 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1}'
  - name: "ADMIN_PASSWORD"
    label:
      de: Admin Passwort
      en: Admin Password
    positionMeta: { step: "adminuser", index: 5 }
    format: "password"
    required: true
    validationSchema: '{ "type": "string", "minLength": 12, "format": "password" }'
systemInputs:
  - name: "MYSQL_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
  - name: "EUROOFFICE_JWT_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "MARIADB_ROOT_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Nextcloud Domain
      en: Nextcloud Domain
    value: https://${domain.nextcloud}
  - key:
      de: Euro-Office Domain
      en: Euro-Office Domain
    value: https://${domain.eurooffice}
  - key:
      de: Admin Benutzername
      en: Admin username
    value: ${nextcloud-euro-office.env.NEXTCLOUD_ADMIN_USER}
  - key:
      de: Admin Passwort
      en: Admin Password
    value: ${nextcloud-euro-office.env.NEXTCLOUD_ADMIN_PASSWORD}
