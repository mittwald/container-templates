manifestVersion: 1.0
name:
  de: Open WebUI
  en: Open WebUI
version: "main"
type: standalone
tagline:
  de: Selbstgehostete Oberfläche für KI-Modelle
  en: Self-hosted interface for AI models
description:
  de: Open WebUI ist eine erweiterbare, selbstgehostete Weboberfläche für die Interaktion mit großen Sprachmodellen. Dieses Template verbindet Open WebUI mit dem KI-Hosting von mittwald.
  en: Open WebUI is an extensible, self-hosted web interface for interacting with large language models. This template connects Open WebUI to mittwald AI hosting.
developer: Open WebUI
website: https://openwebui.com
repository: https://github.com/open-webui/open-webui
license:
  name: MIT
  link: https://spdx.org/licenses/MIT.html
categories:
  - ai
domains:
  - userInput: HOST
    service: openwebui
    port: 8080
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "AI_API_KEY"
    label:
      de: AI API-Key
      en: AI API Key
    positionMeta: { step: "aiHosting", index: 4 }
    required: false
    dataSource: "aiHosting.apiKey"
    validationSchema: '{ "type": "string" }'
  - name: "ADMIN_EMAIL"
    label:
      de: Admin E-Mail-Adresse
      en: Admin email address
    positionMeta: { step: "adminuser", index: 5 }
    format: "email"
    required: true
    validationSchema: '{ "type": "string", "minLength": 1, "format": "email" }'
  - name: "ADMIN_PASSWORD"
    label:
      de: Admin Passwort
      en: Admin Password
    positionMeta: { step: "adminuser", index: 5 }
    format: "password"
    required: true
    validationSchema: '{ "type": "string", "minLength": 12, "format": "password" }'

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Admin E-Mail-Adresse
      en: Admin email address
    value: ${openwebui.env.WEBUI_ADMIN_EMAIL}
  - key:
      de: Admin Passwort
      en: Admin Password
    value: ${openwebui.env.WEBUI_ADMIN_PASSWORD}
