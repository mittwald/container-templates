manifestVersion: 1.0
name:
  de: Qdrant
  en: Qdrant
version: "1.x.x"
type: component
tagline:
  de: Hochperformante Vektordatenbank für KI-Anwendungen
  en: High-performance vector database for AI applications
description:
  de: |
    **Qdrant** ist eine Open-Source-Vektordatenbank und Vektorsuchmaschine als self-hosted Alternative zu verwalteten Cloud-Diensten wie Pinecone. Die in Rust implementierte Plattform ermöglicht das Speichern und Abfragen hochdimensionaler Einbettungsvektoren für KI-Anwendungen wie semantische Suche, Retrieval Augmented Generation (RAG) oder Empfehlungssysteme – bei hoher Verarbeitungsgeschwindigkeit und geringem Ressourcenverbrauch.

    Zentrale Funktionen:

    - Schnelle Vektorähnlichkeitssuche mit konfigurierbaren Distanzmetriken (Cosine, Dot, Euclid)
    - Metadaten-Filter für kombinierte Abfragen über Vektor- und Strukturdaten
    - REST- und gRPC-API für flexible Anbindung an beliebige Frameworks
    - Webbasiertes Dashboard zur Verwaltung von Collections und Vektoren

    Für **Agenturen**, die KI-gestützte Features in Kundenprojekte integrieren, fungiert Qdrant als Vektor-Backend hinter der Anwendungslogik. Typische Einsatzszenarien sind RAG-Pipelines über Kundendokumente, semantische Produktsuchen in Online-Shops sowie Empfehlungsfunktionen in Content-Plattformen. Da Qdrant als reine Backend-Komponente agiert, bleibt die übergeordnete Anwendungsschicht unabhängig und kann an unterschiedliche LLM- oder Embedding-Endpunkte angebunden werden.

    Bei mittwald läuft **Qdrant** als self-hosted Container in deutschen Rechenzentren; Vektordaten verbleiben vollständig in der eigenen Infrastruktur, was den Anforderungen der DSGVO entspricht. Dieses Template enthält Qdrant als alleinstehenden Service, sofort erreichbar über REST- und gRPC-API, und ohne nutzungsabhängige Lizenzkosten wirtschaftlich auch für mehrere parallele Kundenprojekte.
  en: |
    **Qdrant** is an open-source vector database and vector search engine, self-hosted alternative to managed cloud services such as Pinecone. Implemented in Rust, it stores and queries high-dimensional embedding vectors for AI applications including semantic search, Retrieval Augmented Generation (RAG) and recommendation systems.

    Key features:

    - Fast vector similarity search with configurable distance metrics (Cosine, Dot, Euclid)
    - Metadata filters for precise, combined queries across vector and structured data
    - REST and gRPC APIs for flexible integration with any framework or language
    - Web-based dashboard for managing collections, vectors and indices

    For **agencies** integrating AI-powered features into client projects, Qdrant acts as the vector backend behind the application logic. Typical use cases include RAG pipelines over client documents, semantic product search in online shops, and recommendation features in content platforms. As a pure backend component, Qdrant keeps the surrounding application layer independent and connectable to different LLM or embedding endpoints.

    At mittwald, **Qdrant** runs as a self-hosted container in German data centres; vector data stays within the agency's own infrastructure, meeting GDPR requirements. This template includes Qdrant as a standalone service, accessible via REST and gRPC APIs after setup; with no usage-based licence costs, it operates economically across multiple client projects.
developer: Qdrant
website: https://qdrant.tech
repository: https://github.com/qdrant/qdrant
license:
  name: Apache-2.0
  link: https://spdx.org/licenses/Apache-2.0.html
categories:
  - ai
  - database
domains:
  - userInput: HOST
    service: qdrant
    port: 6333
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "QDRANT_API_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32

help:
  technicalDetails:
  - key:
      de: Dashboard
      en: Dashboard
    value: https://${domain.main}/dashboard
  - key:
      de: API-Key
      en: API Key
    value: ${qdrant.env.QDRANT__SERVICE__API_KEY}
