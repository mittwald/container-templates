manifestVersion: 1.0
name: qdrant
version: "1.x.x"
icon: icon.svg
tagline:
  de: Hochperformante Vektordatenbank für KI-Anwendungen
  en: High-performance vector database for AI applications
description:
  de: Qdrant ist eine hochperformante Open-Source Vektordatenbank und Vektor-Suchmaschine, geschrieben in Rust. Optimiert für erweiterte Vektorähnlichkeitssuche mit Filterung, ideal für Retrieval Augmented Generation (RAG), semantische Suche und Empfehlungssysteme.
  en: Qdrant is a high-performance open-source vector database and vector search engine, written in Rust. Optimized for advanced vector similarity search with filtering, ideal for Retrieval Augmented Generation (RAG), semantic search and recommendation systems.
developer: Qdrant
website: https://qdrant.tech
repository: https://github.com/qdrant/qdrant
license: Apache-2.0
categories:
  - ai
domains:
  - userInput: HOST
    service: qdrant
    port: 6333
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "QDRANT_API_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
