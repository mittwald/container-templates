manifestVersion: 1.0
name:
  de: Qdrant
  en: Qdrant
version: "1.x.x"
type: component
tagline:
  de: Hochperformante Vektordatenbank für KI-Anwendungen
  en: High-performance vector database for AI applications
description:
  de: |
    **Qdrant** ist eine Open-Source-Vektordatenbank und Vektorsuchmaschine, die als self-hosted Alternative zu verwalteten Cloud-Diensten wie Pinecone eingesetzt wird. Sie ermöglicht das Speichern und Abfragen hochdimensionaler Einbettungsvektoren, wie sie in modernen KI-Anwendungen entstehen – etwa bei semantischer Suche, Retrieval Augmented Generation (RAG) oder personalisierten Empfehlungssystemen. Qdrant ist in der Programmiersprache Rust implementiert und bietet dadurch hohe Verarbeitungsgeschwindigkeit bei vergleichsweise geringem Ressourcenverbrauch.

    Zentrale Funktionen:

    - Schnelle Vektorähnlichkeitssuche mit konfigurierbaren Distanzmetriken (Cosine, Dot, Euclid)
    - Metadaten-Filter für präzise, kombinierte Abfragen über Vektor- und Strukturdaten
    - REST- und gRPC-API für flexible Anbindung an beliebige Frameworks und Sprachen
    - Webbasiertes Dashboard zur Verwaltung von Collections, Vektoren und Indizes
    - Skalierbare Datenspeicherung mit Unterstützung verschiedener Quantisierungsverfahren
    - Persistente Nutzlast-Speicherung direkt neben den Vektoren

    Für **Werbe-, Web- und Digitalagenturen**, die KI-gestützte Features in Kundenprojekte integrieren, fungiert Qdrant als Vektor-Backend hinter der Anwendungslogik. Typische Einsatzszenarien sind RAG-Pipelines über Kundendokumente oder Website-Inhalte, semantische Produktsuchen in Online-Shops sowie Empfehlungsfunktionen in Content-Plattformen. Da Qdrant ausschließlich als Backend-Komponente agiert, bleibt die übergeordnete Anwendungsschicht unabhängig und kann an unterschiedliche LLM- oder Embedding-Endpunkte angebunden werden.

    Bei mittwald läuft **Qdrant** als self-hosted Container in deutschen Rechenzentren; Vektordaten und verknüpfte Rohdaten verbleiben vollständig in der eigenen Infrastruktur und werden nicht an externe Drittdienste übertragen, was den Anforderungen der DSGVO entgegenkommt. Dieses Template enthält Qdrant als alleinstehenden Service, der nach der Einrichtung sofort über REST- und gRPC-API erreichbar ist. Da keine nutzungsabhängigen Lizenzkosten anfallen, lässt sich Qdrant auch für mehrere parallele Kundenprojekte gleichzeitig wirtschaftlich betreiben.
  en: |
    **Qdrant** is an open-source vector database and vector search engine used as a self-hosted alternative to managed cloud services such as Pinecone. It enables the storage and querying of high-dimensional embedding vectors as generated by modern AI applications – for example in semantic search, Retrieval Augmented Generation (RAG) or personalised recommendation systems. Qdrant is implemented in the Rust programming language, which provides high processing throughput at comparatively low resource consumption.

    Key features:

    - Fast vector similarity search with configurable distance metrics (Cosine, Dot, Euclid)
    - Metadata filters for precise, combined queries across vector and structured data
    - REST and gRPC APIs for flexible integration with any framework or programming language
    - Web-based dashboard for managing collections, vectors and indices
    - Scalable data storage with support for various quantisation methods
    - Persistent payload storage directly alongside the vectors

    For **advertising, web and digital agencies** integrating AI-powered features into client projects, Qdrant serves as the vector backend behind the application logic. Typical use cases include RAG pipelines over client documents or website content, semantic product search in online shops, and recommendation features in content platforms. Because Qdrant operates exclusively as a backend component, the overlying application layer remains independent and can be connected to different LLM or embedding endpoints.

    At mittwald, **Qdrant** runs as a self-hosted container in German data centres; vector data and associated raw data remain entirely within the agency's own infrastructure and are not transferred to external third-party services, which meets GDPR requirements. This template includes Qdrant as a standalone service that is immediately accessible via REST and gRPC APIs after setup. As there are no usage-based licence costs, Qdrant can be operated economically across multiple concurrent client projects.
developer: Qdrant
website: https://qdrant.tech
repository: https://github.com/qdrant/qdrant
license:
  name: Apache-2.0
  link: https://spdx.org/licenses/Apache-2.0.html
categories:
  - ai
domains:
  - userInput: HOST
    service: qdrant
    port: 6333
    purpose: main
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "QDRANT_API_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32

help:
  technicalDetails:
  - key:
      de: Dashboard
      en: Dashboard
    value: https://${domain.main}/dashboard
  - key:
      de: API-Key
      en: API Key
    value: ${qdrant.env.QDRANT__SERVICE__API_KEY}
