services:
  qdrant:
    image: qdrant/qdrant:v1
    ports:
      - "6333:6333"
    environment:
      - TZ=Europe/Berlin
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  qdrant_data:
