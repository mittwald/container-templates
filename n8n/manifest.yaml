manifestVersion: 1.0
name:
  de: n8n
  en: n8n
version: "latest"
type: standalone
icon: icon.svg
tagline:
  de: Automatisierung für deine Geschäftsprozesse
  en: Automations for your business processes
description:
  de: n8n ist eine erweiterbare Workflow-Automatisierungsplattform. Mit über 400 Integrationen und der Möglichkeit, eigene Funktionen zu erstellen, kannst du deine Geschäftsprozesse flexibel automatisieren. Dieses Template enthält n8n mit PostgreSQL und einem externen Task Runner für sichere Code-Ausführung.
  en: n8n is an extendable workflow automation platform. With over 400 integrations and the ability to create custom functions, you can flexibly automate your business processes. This template includes n8n with PostgreSQL and an external task runner for secure code execution.
developer: n8n GmbH
website: https://n8n.io
repository: https://github.com/n8n-io/n8n
support: https://n8n.io/support/
license:
  name: Sustainable Use License
  link: https://github.com/n8n-io/n8n/blob/master/LICENSE.md
categories:
  - productivity
domains:
  - userInput: HOST
    service: n8n
    port: 5678
    purpose: main
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1}'
systemInputs:
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
  - name: "N8N_RUNNERS_AUTH_TOKEN"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "N8N_ENCRYPTION_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Admin-Benutzer manuell einrichten
      en: Set up admin user manually
    content:
      de: Der Admin-Benutzer wird nicht automatisch angelegt. Richte das Owner-Konto nach der Installation beim ersten Aufruf manuell ein.
      en: The admin user is not created automatically. Set up the owner account manually after installation on the first launch.
