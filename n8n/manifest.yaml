manifestVersion: 1.0
name:
  de: n8n
  en: n8n
version: "latest"
type: standalone
tagline:
  de: Automatisierung für deine Geschäftsprozesse
  en: Automations for your business processes
description:
  de: |
    **n8n** ist eine erweiterbare Workflow-Automatisierungsplattform und self-hosted Alternative zu Cloud-Diensten wie Zapier oder Make. Sie verbindet Anwendungen, APIs und interne Systeme über einen visuellen Workflow-Editor und automatisiert wiederkehrende Prozesse ohne tiefgreifende Programmierkenntnisse. Daten werden ausschließlich auf der eigenen Infrastruktur verarbeitet.

    Zentrale Funktionen:

    - Mehr als 400 vorgefertigte Integrationen für Web-Dienste, APIs und Datenbanken
    - Visueller Drag-and-Drop-Editor zum Aufbau komplexer Workflows
    - Eigener Code in JavaScript oder Python direkt in Workflow-Nodes
    - Webhooks, Cronjob-Trigger und dedizierte Fehler-Workflows für robuste Automatisierung

    Für **Agenturen** bietet n8n die Möglichkeit, repetitive Prozesse zu automatisieren: Kunden-Onboarding lässt sich mit Willkommens-E-Mails und CRM-Einträgen verknüpfen, Leads werden aus Kontaktformularen in Newsletter-Tools übertragen, und Reportings werden automatisch aggregiert und versendet. Auch interne Workflows wie Benachrichtigungen bei neuen Support-Tickets lassen sich abbilden.

    Bei mittwald läuft **n8n** als self-hosted Container in deutschen Rechenzentren; Zugangsdaten und Workflow-Daten unterliegen der DSGVO. Dieses Template enthält n8n mit externem Task-Runner und PostgreSQL-Datenbank und ist sofort einsatzbereit. Die Datenbank wird plattformseitig über das mittwald Backup-Label (`backup.command`) gesichert. Da keine nutzungsabhängigen Lizenzgebühren anfallen, skaliert die Lösung wirtschaftlich.
  en: |
    **n8n** is an extensible workflow automation platform and a self-hosted alternative to cloud services such as Zapier or Make. It connects applications, APIs and systems through a visual editor, automating recurring processes without deep programming knowledge. Data is processed exclusively on the operator's infrastructure.

    Key features:

    - More than 400 pre-built integrations for web services, APIs and databases
    - Visual drag-and-drop editor for building complex workflows
    - Custom code in JavaScript or Python directly inside workflow nodes
    - Webhooks, cron triggers and dedicated error workflows for robust automation

    For **agencies**, n8n automates repetitive processes: client onboarding links with welcome emails and CRM entries, leads move from contact forms into newsletter tools, and reports are aggregated and sent. Internal workflows such as new support-ticket notifications can also be mapped.

    At mittwald, **n8n** runs as a self-hosted container in German data centres; credentials and workflow data are subject to GDPR. This template includes n8n with an external task runner and PostgreSQL database, ready to use immediately; the database is backed up platform-side via the mittwald backup label (`backup.command`). With no usage-based licence fees, the solution scales economically.
developer: n8n GmbH
website: https://n8n.io
repository: https://github.com/n8n-io/n8n
support: https://n8n.io/support/
license:
  name: Sustainable Use License
  link: https://github.com/n8n-io/n8n/blob/master/LICENSE.md
categories:
  - productivity
screenshots:
  - bg: background.jpg
    screenshot: screenshot-mittwald-nodes-onboarding.png
    text:
      de: Kundenprojekte mit den mittwald-Nodes automatisch anlegen
      en: Creating customer projects automatically with the mittwald nodes
  - bg: background.jpg
    screenshot: screenshot-llm-chat.png
    text:
      de: Per Chat die eigene Datenbank abfragen und auswerten
      en: Querying and analysing your own database via chat
  - bg: background.jpg
    screenshot: screenshot-templates.jpg
    text:
      de: Vorgefertigte Workflow-Vorlagen als Ausgangspunkt übernehmen
      en: Using ready-made workflow templates as a starting point
domains:
  main:
    userInput: HOST
    service: n8n
    port: 5678
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "domain", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1}'
  - name: "SMTP_FROM"
    label:
      de: Absenderadresse
      en: Sender address
    positionMeta: { step: "common", index: 1 }
    defaultValue: "${user.email}"
    format: "email"
    required: true
    validationSchema: '{ "type": "string", "format": "email" }'
systemInputs:
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
  - name: "N8N_RUNNERS_AUTH_TOKEN"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "N8N_ENCRYPTION_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32

deliveryBoxes:
  - purpose: main
help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  alerts:
  - status: info
    heading:
      de: Admin-Benutzer manuell einrichten
      en: Set up admin user manually
    content:
      de: Der Admin-Benutzer wird nicht automatisch angelegt. Richte das Owner-Konto nach der Installation beim ersten Aufruf manuell ein.
      en: The admin user is not created automatically. Set up the owner account manually after installation on the first launch.
