services:
  # Reverse proxy in front of the runtime, in place of the upstream Nginx.
  # It hides the operator endpoints, drops a client-supplied
  # CF-Connecting-IP (Better Auth trusts it before X-Real-IP) and passes
  # WebSocket upgrades for the SAM chat. The Caddyfile is written by the
  # command because the platform mounts no files; it needs no `$`, which the
  # platform does not unescape in `command`.
  web:
    image: caddy:2-alpine
    user: "1000:1000"
    ports:
      - "8080:8080"
    command:
      - sh
      - -c
      - >-
        printf '%s\n'
        '{' 'admin off' 'auto_https off' 'persist_config off' '}'
        ':8080 {'
        'respond /api/standalone/import 404'
        'respond /api/standalone/admin 404'
        'request_body {' 'max_size 20MB' '}'
        'reverse_proxy runtime:8080 {'
        'header_up -CF-Connecting-IP'
        'header_up X-Real-IP {remote_host}'
        'flush_interval -1'
        '}' '}' > /tmp/Caddyfile
        && exec caddy run --adapter caddyfile --config /tmp/Caddyfile
    environment:
      - TZ=Europe/Berlin
      - XDG_CONFIG_HOME=/tmp
      - XDG_DATA_HOME=/tmp
    depends_on:
      runtime:
        condition: service_healthy

  # Runs the Workers build of OpenSEO on celld. The upstream stack starts a
  # separate `init` container that exits after each start; the platform
  # treats an exited container as failed, so this command does its work:
  # create the bucket (retried, as the platform does not wait for the storage
  # health check), write the configuration, start celld, deploy the app,
  # apply migrations and create the admin account if it does not exist yet.
  # The secrets come from systemInputs instead of a generated secrets.json in
  # a shared volume. Each list entry must stay below 800 characters.
  runtime:
    image: ghcr.io/every-app/open-seo-standalone:0
    command:
      - node
      - -e
      - |
        const {spawn,execFileSync:x}=require("child_process"),fs=require("fs"),e=process.env,a=process.argv,o={stdio:"inherit"};
        const k=["BETTER_AUTH_SECRET","OPENSEO_OPERATOR_SECRET","CRAWL_GATEWAY_SECRET"];
        fs.writeFileSync("/config/secrets.json",JSON.stringify(Object.fromEntries(k.map((n)=>[n,e[n]]))),{mode:0o600});
        const b=x("curl",["-sS","--retry","60","--retry-delay","2","--retry-all-errors","-o","/dev/null","-w","%{http_code}","--aws-sigv4","aws:amz:"+e.AWS_REGION+":s3",
          "--user",e.AWS_ACCESS_KEY_ID+":"+e.AWS_SECRET_ACCESS_KEY,"-X","PUT",e.S3_ENDPOINT+"/"+e.CELLD_BUCKET,
          "-H","x-amz-content-sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"]).toString();
        if(!["200","409"].includes(b))throw Error("Bucket initialization failed (HTTP "+b+")");
        eval(a[1]);
      - |
        x("node",["/opt/standalone/configure.mjs"],o);
        const c=spawn("celld",["--listen","0.0.0.0:8080","--internal-listen","127.0.0.1:8081"],o);
        for(const s of["SIGTERM","SIGINT"])process.on(s,()=>c.kill(s));
        c.on("exit",(code)=>process.exit(code??1));
        const h="http://127.0.0.1:",wait=(t)=>new Promise((r)=>setTimeout(r,t)),
          reload=()=>fetch(h+"8081/reload",{method:"POST"}).then((r)=>r.ok),
          retry=async(n,d,f)=>{for(let i=0;i<n;i++){try{if(await f())return}catch{}await wait(d)}throw Error("Initialization failed")};
        eval(a[2]);
      - |
        (async()=>{
          x("celld",["deploy","/config/app"],o);
          await retry(90,1000,reload);
          await retry(30,2000,()=>(x("celld",["d1","migrations","apply","openseo-standalone","/config/app"],o),true));
          await retry(10,1000,reload);
          await retry(90,1000,()=>fetch(h+"8080/api/health").then((r)=>r.ok));
          const r=await fetch(h+"8080/api/standalone/admin",{method:"POST",
            headers:{"content-type":"application/json","x-openseo-operator-secret":e.OPENSEO_OPERATOR_SECRET},
            body:JSON.stringify({command:"create-user",email:e.ADMIN_EMAIL,name:e.ADMIN_NAME,password:e.ADMIN_PASSWORD})});
          console.log(r.ok?"Admin account is set up.":"Admin account failed: "+await r.text());
          console.log("OpenSEO initialized and ready.");
        })().catch((err)=>{console.error(err);c.kill();process.exit(1)});
    environment:
      - TZ=Europe/Berlin
      - CELLD_BUCKET=openseo
      - S3_ENDPOINT=http://storage:9000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=openseo
      - AWS_SECRET_ACCESS_KEY=${STORAGE_SECRET_KEY}
      - CELLD_MAX_RSS_MB=1536
      - CELLD_MAX_RESIDENT_CELLS=64
      - CELLD_V8_HEAP_LIMIT_MB=256
      - CELLD_MAX_REQUEST_BODY_BYTES=33554432
      - RUST_LOG=warn,cell_console=info
      - AUTH_MODE=password
      - BETTER_AUTH_URL=https://${HOST}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - OPENSEO_OPERATOR_SECRET=${OPENSEO_OPERATOR_SECRET}
      - CRAWL_GATEWAY_SECRET=${CRAWL_GATEWAY_SECRET}
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      - OPENROUTER_API_KEY=${AI_API_KEY}
      - OPENROUTER_BASE_URL=${AI_ENDPOINT}
      - OPENROUTER_MODEL=gpt-oss-120b
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - runtime_data:/data
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5

  # Fetches user-supplied crawl URLs and refuses private addresses. The
  # runtime reaches it at http://crawl-gateway:8090 (set by configure.mjs).
  crawl-gateway:
    image: ghcr.io/every-app/open-seo-standalone:0
    command:
      - node
      - -e
      - import("/opt/standalone/crawl-gateway.mjs").then((m)=>m.createGateway(process.env.CRAWL_GATEWAY_SECRET).listen(8090,"0.0.0.0"));
    environment:
      - TZ=Europe/Berlin
      - CRAWL_GATEWAY_SECRET=${CRAWL_GATEWAY_SECRET}

  # S3-compatible store that holds the database, files and workflow state of
  # celld. Pinned to the release the upstream stack is tested with.
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      - TZ=Europe/Berlin
      - RUSTFS_ACCESS_KEY=openseo
      - RUSTFS_SECRET_KEY=${STORAGE_SECRET_KEY}
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  runtime_data:
  storage_data:
