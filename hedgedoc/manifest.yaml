manifestVersion: 1.0
name: hedgedoc
version: "1.10.x"
icon: icon.svg
tagline:
  de: Kollaborativer Markdown-Editor
  en: Collaborative Markdown editor
description:
  de: HedgeDoc ist ein kollaborativer Echtzeit-Markdown-Editor für Teams. Gemeinsam Notizen, Dokumentationen und Präsentationen erstellen — direkt im Browser. Dieses Template enthält HedgeDoc mit PostgreSQL-Backend.
  en: HedgeDoc is a collaborative real-time Markdown editor for teams. Create notes, documentation and presentations together — right in the browser. This template includes HedgeDoc with a PostgreSQL backend.
developer: HedgeDoc
website: https://hedgedoc.org
repository: https://github.com/hedgedoc/hedgedoc
license: AGPL-3.0
categories:
  - productivity
domains:
  - userInput: HOST
    service: hedgedoc
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SESSION_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
