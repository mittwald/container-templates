manifestVersion: 1.0
name:
  de: MariaDB
  en: MariaDB
version: "lts"
type: component
tagline:
  de: Relationale Open-Source Datenbank
  en: Open-source relational database
description:
  de: |
    **MariaDB** ist ein relationales Open-Source-Datenbanksystem und direkt austauschbare Alternative zu proprietären Managed-MySQL-Diensten wie AWS RDS oder PlanetScale. Es bietet volle MySQL-Ökosystem-Kompatibilität bei vollständiger Kontrolle über Daten und Konfiguration.

    Zentrale Funktionen:

    - MySQL-kompatibles SQL-Interface — bestehende Anwendungen, ORM-Frameworks und Datenbank-Tools laufen ohne Anpassungen
    - ACID-konforme Transaktionen und InnoDB-Engine für zuverlässige Datenkonsistenz
    - Replikation (Primary-Replica) für Hochverfügbarkeit und horizontale Lese-Skalierung
    - Breite Framework-Unterstützung für PHP, Python, Node.js und Java sowie gängige CMS-Plattformen

    Für **Agenturen** ist MariaDB der bewährte Datenbankbaustein hinter Kundenanwendungen: WordPress- und TYPO3-Installationen, WooCommerce- und Shopware-Shops sowie individuelle Web-Anwendungen setzen standardmäßig auf MySQL-kompatible Datenbanken. MariaDB lässt sich als isolierter Dienst sauber in bestehende Container-Stacks integrieren — getrennt von der Anwendungsschicht und unabhängig wartbar.

    Bei mittwald läuft **MariaDB** als self-hosted Container in deutschen Rechenzentren; alle Daten bleiben innerhalb der EU und unterliegen dem Schutz der DSGVO. Dieses Template enthält MariaDB mit vorkonfigurierten Zugangsdaten und ist sofort betriebsbereit; Datensicherung erfolgt plattformseitig über das mittwald Backup-Label (`backup.command`). Da keine nutzungsabhängigen Lizenzkosten anfallen, bleibt die Lösung auch beim parallelen Betrieb vieler Kundenprojekte wirtschaftlich.
  en: |
    **MariaDB** is an open-source relational database and a drop-in replacement for proprietary managed MySQL services such as AWS RDS or PlanetScale. It offers full MySQL ecosystem compatibility while keeping data and configuration fully under the operator's control.

    Key features:

    - MySQL-compatible SQL interface — existing applications, ORM frameworks and tools run without modification
    - ACID-compliant transactions and InnoDB engine for reliable data consistency
    - Replication (primary-replica) for high availability and horizontal read scaling
    - Broad framework support for PHP, Python, Node.js and Java, as well as popular CMS platforms

    For **agencies**, MariaDB is the proven database building block behind client applications: WordPress and TYPO3 installations, WooCommerce and Shopware shops, and custom web applications rely on MySQL-compatible databases. This template deploys MariaDB as an isolated service into existing container stacks — separated from the application layer and independently maintainable.

    At mittwald, **MariaDB** runs as a self-hosted container in German data centres; data remains within the EU under GDPR protection. This template includes MariaDB with pre-configured credentials and is ready to use immediately; backups run platform-side via the mittwald backup label (`backup.command`). With no usage-based licence costs, the solution remains economical across many client projects.
developer: MariaDB Foundation
website: https://mariadb.org
repository: https://github.com/MariaDB/server
license:
  name: GPL-2.0
  link: https://spdx.org/licenses/GPL-2.0.html
categories:
  - development
  - database
userInputs:
  - name: "DATABASE_NAME"
    label:
      de: Datenbank-Name
      en: Database Name
    positionMeta: { step: "common", index: 1 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_USER"
    label:
      de: Admin Benutzername
      en: Admin username
    positionMeta: { step: "adminUser", index: 1 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_PASSWORD"
    label:
      de: Admin Passwort
      en: Admin Password
    positionMeta: { step: "adminUser", index: 2 }
    format: "password"
    required: true
    validationSchema: '{ "type": "string", "minLength": 12, "format": "password" }'
systemInputs:
  - name: "MARIADB_ROOT_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
        - identifier: noSpecial
          ruleType: charPool
          charPools:
            - special
            - nonAscii
          max: 0

help:
  technicalDetails:
  - key:
      de: Hostname
      en: Hostname
    value: ${mariadb.hostname}
  - key:
      de: Port
      en: Port
    value: 3306/TCP
  - key:
      de: Datenbank-Name
      en: Database Name
    value: ${mariadb.env.MARIADB_DATABASE}
  - key:
      de: Admin Benutzername
      en: Admin username
    value: ${mariadb.env.MARIADB_USER}
  - key:
      de: Admin Passwort
      en: Admin Password
    value: ${mariadb.env.MARIADB_PASSWORD}
  - key:
      de: Verbindungsstring
      en: Connection string
    value: mariadb://${mariadb.env.MARIADB_USER}:${mariadb.env.MARIADB_PASSWORD}@${mariadb.hostname}
