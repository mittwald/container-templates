services:
  mariadb:
    image: mariadb:lts
    environment:
      - TZ=Europe/Berlin
      - MARIADB_DATABASE=${DATABASE_NAME}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_USER=${ADMIN_USER}
      - MARIADB_PASSWORD=${ADMIN_PASSWORD}
      - MARIADB_AUTO_UPGRADE=mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/mysql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { MYSQL_PWD="$$MARIADB_ROOT_PASSWORD" mariadb-dump -u root --all-databases --routines --events --result-file="$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  mariadb_data:
