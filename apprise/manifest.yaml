manifestVersion: 1.0
name:
  de: Apprise
  en: Apprise
version: "2.x"
type: component
tagline:
  de: Benachrichtigungen über eine API verteilen
  en: Dispatch notifications through one API
description:
  de: |
    **Apprise** ist ein self-hosted Benachrichtigungs-Gateway und stellt über eine einheitliche API den Versand von Push- und Chat-Nachrichten an über 100 Dienste bereit. Statt für jede Anwendung eigene Integrationen zu Slack, Telegram, Discord, E-Mail oder Webhooks zu pflegen, senden Anwendungen ihre Meldungen an einen einzigen Endpunkt, der sie an die konfigurierten Ziele verteilt.

    Zentrale Funktionen:

    - Einheitliche REST-API für über 100 Benachrichtigungsdienste
    - Gespeicherte Konfigurationen mit Schlüsseln (persistenter Modus)
    - Anhänge, Formatierung (Text, Markdown, HTML) und Tag-basierter Versand
    - Anmeldung per Basic Auth, auf Wunsch mit eigenen Zugangsdaten je Konfiguration
    - Weboberfläche mit Zustellprotokoll, auch auf Deutsch

    Für **Agenturen** dient Apprise als zentraler Benachrichtigungs-Baustein hinter eigenen Anwendungen und Automatisierungen: Monitoring, Cronjobs, Deployment-Skripte oder Kundenanwendungen melden Ereignisse an Apprise, das die Zustellung an die jeweils passenden Kanäle übernimmt. So bleibt die Benachrichtigungslogik an einer Stelle gebündelt und muss nicht in jeder Anwendung erneut umgesetzt werden.

    Bei mittwald läuft **Apprise** als self-hosted Container in deutschen Rechenzentren; Konfigurationen und Zugangsdaten der Kanäle verbleiben unter der Kontrolle der Agentur und werden nicht an externe SaaS-Anbieter übertragen, was die Einhaltung der DSGVO vereinfacht. Dieses Template enthält den Apprise-API-Dienst mit persistentem Konfigurationsspeicher – ohne nutzungsabhängige Lizenz- oder Nachrichtenkosten.
  en: |
    **Apprise** is a self-hosted notification gateway that provides a unified API for sending push and chat messages to more than 100 services. Instead of maintaining separate integrations to Slack, Telegram, Discord, email or webhooks in every application, applications send their messages to a single endpoint that distributes them to the configured targets.

    Key features:

    - Unified REST API for more than 100 notification services
    - Stored configurations addressed by key (persistent mode)
    - Attachments, formatting (text, Markdown, HTML) and tag-based delivery
    - Basic Auth sign-in, optionally with separate credentials per configuration
    - Web interface with delivery log, available in German

    For **agencies**, Apprise serves as a central notification building block behind their own applications and automations: monitoring, cron jobs, deployment scripts or client applications report events to Apprise, which handles delivery to the appropriate channels. This keeps notification logic in one place instead of reimplementing it in every application.

    At mittwald, **Apprise** runs as a self-hosted container in German data centres; channel configurations and credentials stay under the agency's control and are not transmitted to external SaaS providers, simplifying GDPR compliance. This template includes the Apprise API service with persistent configuration storage — with no usage-based licence or message costs.
developer: Chris Caron
website: https://appriseit.com
repository: https://github.com/caronc/apprise-api
license:
  name: MIT
  link: https://spdx.org/licenses/MIT.html
categories:
  - communication
screenshots:
  - bg: background.jpg
    screenshot: screenshot-review.png
    text:
      de: Gespeicherte Ziele mit Tags prüfen und einzeln testen
      en: Review stored targets with tags and test them individually
  - bg: background.jpg
    screenshot: screenshot-config.png
    text:
      de: Konfiguration mit mehreren Diensten und Tags im YAML-Format
      en: Configuration with several services and tags in YAML format
  - bg: background.jpg
    screenshot: screenshot-url-builder.png
    text:
      de: Dienst-URLs im Builder der Apprise-Dokumentation bauen
      en: Building service URLs in the Apprise documentation
userInputs:
  - name: "ADMIN_USER"
    label:
      de: Admin Benutzername
      en: Admin username
    positionMeta: { step: "adminUser", index: 1 }
    defaultValue: "${user.username}"
    required: true
    errorMessage:
      de: Der Benutzername darf keinen Doppelpunkt enthalten
      en: The username must not contain a colon
    validationSchema: '{ "type": "string", "pattern": "^[^:]+$" }'
  - name: "ADMIN_PASSWORD"
    label:
      de: Admin Passwort
      en: Admin Password
    positionMeta: { step: "adminUser", index: 2 }
    required: true
    format: password
    validationSchema: '{ "type": "string", "minLength": 12 }'
help:
  technicalDetails:
  - key:
      de: Interne API-URL
      en: Internal API URL
    value: http://${apprise.hostname}:8000
  - key:
      de: Admin Benutzername
      en: Admin username
    value: ${apprise.env.APPRISE_USER}
  - key:
      de: Admin Passwort
      en: Admin Password
    value: ${apprise.env.APPRISE_PASSWORD}
  alerts:
  - status: info
    heading:
      de: Anmeldung per Basic Auth
      en: Basic Auth sign-in
    content:
      de: Die Authentifizierung ist mit `APPRISE_AUTH_REQUIRED` aktiviert. Jeder API-Aufruf braucht deshalb die Admin-Zugangsdaten als Basic Auth, z. B. `curl -u benutzer:passwort`, oder die Zugangsdaten einer Konfiguration, die du in der Oberfläche über **Authentication** vergibst. Der Dienst wird nicht über eine Domain veröffentlicht und ist nur innerhalb des Stacks über den Hostnamen erreichbar.
      en: Authentication is enabled via `APPRISE_AUTH_REQUIRED`. Every API call therefore needs the admin credentials as Basic Auth, e.g. `curl -u user:password`, or the credentials of a configuration that you assign under **Authentication** in the interface. The service is not published via a domain and is only reachable inside the stack via its hostname.
  - status: info
    heading:
      de: Admin-Modus ist aktiv
      en: Admin mode is enabled
    content:
      de: Mit `APPRISE_ADMIN` ist der Admin-Modus aktiviert (Upstream-Standard). Die Oberfläche listet damit alle gespeicherten Konfigurationsschlüssel auf, statt die Kenntnis des jeweiligen Schlüssels vorauszusetzen. Welche Konfigurationen jemand sehen und nutzen darf, entscheiden weiterhin die Zugangsdaten; soll die Liste ganz verborgen bleiben, setze die Variable auf `no`.
      en: "`APPRISE_ADMIN` enables admin mode (the upstream default). The interface then lists all stored configuration keys instead of requiring knowledge of each key. The credentials still decide who may see and use which configuration; to hide the list entirely, set the variable to `no`."
