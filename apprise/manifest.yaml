help:
  technicalDetails:
  - key:
      de: Interne API-URL
      en: Internal API URL
    value: http://${apprise.hostname}:8000
  alerts:
  - status: warning
    heading:
      de: Keine eingebaute Authentifizierung
      en: No built-in authentication
    content:
      de: Apprise bringt keine eigene Anmeldung mit. Der Dienst wird deshalb nicht über eine Domain veröffentlicht und ist nur innerhalb des Stacks über den Hostnamen erreichbar. Sprich ihn ausschließlich aus Anwendungen desselben Stacks an und behandle die Konfigurationsschlüssel wie Geheimnisse.
      en: Apprise has no built-in sign-in. The service is therefore not published via a domain and is only reachable inside the stack via its hostname. Address it exclusively from applications in the same stack and treat the configuration keys as secrets.
  - status: info
    heading:
      de: Admin-Modus ist aktiv
      en: Admin mode is enabled
    content:
      de: Mit `APPRISE_ADMIN` ist der Admin-Modus aktiviert (Upstream-Empfehlung). Die Oberfläche listet damit alle gespeicherten Konfigurationsschlüssel auf, statt die Kenntnis des jeweiligen Schlüssels vorauszusetzen. Das ist vertretbar, solange der Dienst nur im Stack erreichbar ist; wird er später doch veröffentlicht, setze die Variable auf `no`.
      en: "`APPRISE_ADMIN` enables admin mode (the upstream recommendation). The interface then lists all stored configuration keys instead of requiring knowledge of each key. This is acceptable as long as the service is only reachable inside the stack; if it is later published, set the variable to `no`."
