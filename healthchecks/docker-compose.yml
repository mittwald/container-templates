services:
  healthchecks:
    image: healthchecks/healthchecks:latest
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Berlin
      - ALLOWED_HOSTS=*
      - SECRET_KEY=${SECRET_KEY}
      - SITE_ROOT=https://${HOST}
      - SITE_NAME=Healthchecks
    volumes:
      - healthchecks_data:/data
volumes:
  healthchecks_data:
