services:
  healthchecks:
    image: lscr.io/linuxserver/healthchecks:latest
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${HOST}
      - SITE_ROOT=https://${HOST}
      - SITE_NAME=Healthchecks
      - CSRF_TRUSTED_ORIGINS=https://${HOST}
      - REGISTRATION_OPEN=False
      - SUPERUSER_EMAIL=${ADMIN_EMAIL}
      - SUPERUSER_PASSWORD=${ADMIN_PASSWORD}
      - ADMINS=${ADMIN_EMAIL}
      - DB=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=healthchecks
      - DB_USER=healthchecks
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_SSLMODE=disable
      - DEFAULT_FROM_EMAIL=${SMTP_FROM}
      - SERVER_EMAIL=${SMTP_FROM}
      - EMAIL_HOST=mail.agenturserver.de
      - EMAIL_PORT=587
      - EMAIL_HOST_USER=${MW_DELIVERYBOX_MAIN_USERNAME}
      - EMAIL_HOST_PASSWORD=${MW_DELIVERYBOX_MAIN_PASSWORD}
      - EMAIL_USE_TLS=True
    volumes:
      - healthchecks_config:/config
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=healthchecks
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=healthchecks
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/postgresql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { pg_dumpall -h localhost -U "$$POSTGRES_USER" -f "$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  healthchecks_config:
  postgres_data:
