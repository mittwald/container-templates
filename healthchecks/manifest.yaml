manifestVersion: 1.0
name: healthchecks
version: "latest"
icon: icon.svg
tagline:
  de: Cron-Job und Hintergrundprozess-Monitoring
  en: Cron job and background process monitoring
description:
  de: Healthchecks ist ein selbst gehosteter Dienst zur Überwachung von Cron-Jobs, Hintergrundprozessen und geplanten Aufgaben. Erhalte Benachrichtigungen, wenn ein erwarteter Check-in ausbleibt oder fehlschlägt.
  en: Healthchecks is a self-hosted service for monitoring cron jobs, background processes and scheduled tasks. Receive notifications when an expected check-in is missed or fails.
developer: Healthchecks
website: https://healthchecks.io
repository: https://github.com/healthchecks/healthchecks
license: BSD-3-Clause
categories:
  - monitoring
domains:
  - userInput: HOST
    service: healthchecks
    port: 8000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
