manifestVersion: 1.0
name:
  de: Healthchecks
  en: Healthchecks
version: "latest"
type: standalone
tagline:
  de: Cronjobs und geplante Aufgaben überwachen
  en: Monitor cron jobs and scheduled tasks
description:
  de: |
    **Healthchecks** ist ein Überwachungsdienst für Cronjobs und geplante Aufgaben und eine self-hosted Alternative zu Cronitor oder Dead Man's Snitch. Geplante Jobs senden nach jedem Lauf ein „Ping" an Healthchecks; bleibt ein erwartetes Ping aus, löst der Dienst automatisch eine Benachrichtigung aus – so werden stillschweigend fehlgeschlagene Backups, Imports oder Wartungsjobs sofort sichtbar.

    Zentrale Funktionen:

    - Checks mit erwartetem Zeitplan (Perioden oder Cron-Ausdrücke) und Toleranz
    - Ping per HTTP-Aufruf am Ende eines Jobs, inklusive Erfolg-/Fehler-Signal
    - Über 25 Benachrichtigungswege (E-Mail, Slack, Telegram, Webhooks u. a.)
    - Projekte, Teammitglieder, API, monatliche Reports und 2FA

    Für **Agenturen** eignet sich Healthchecks als zentrale Kontrollinstanz für wiederkehrende Aufgaben über Kundenprojekte hinweg: Backups, Datenimporte, Cron-Skripte und Wartungsjobs melden ihren Lauf, und ausbleibende Meldungen werden sofort eskaliert. Pro Kunde oder Projekt lässt sich ein eigenes Projekt mit Teammitgliedern und Benachrichtigungswegen einrichten.

    Bei mittwald läuft **Healthchecks** als self-hosted Container in deutschen Rechenzentren; Check-Daten und Kontaktwege verbleiben unter der Kontrolle der Agentur und werden nicht an externe SaaS-Anbieter übertragen, was die Einhaltung der DSGVO vereinfacht. Dieses Template enthält Healthchecks mit PostgreSQL und bindet einen SMTP-Dienst für Benachrichtigungen und die Anmeldung an – ohne nutzungsabhängige Lizenz- oder Seat-Kosten.
  en: |
    **Healthchecks** is a monitoring service for cron jobs and scheduled tasks and a self-hosted alternative to Cronitor or Dead Man's Snitch. Scheduled jobs send a "ping" to Healthchecks after each run; if an expected ping does not arrive, the service triggers a notification automatically — making silently failed backups, imports or maintenance jobs immediately visible.

    Key features:

    - Checks with an expected schedule (periods or cron expressions) and grace time
    - Ping via an HTTP request at the end of a job, including success/failure signal
    - More than 25 notification channels (email, Slack, Telegram, webhooks and more)
    - Projects, team members, API, monthly reports and 2FA

    For **agencies**, Healthchecks works as a central control point for recurring tasks across client projects: backups, data imports, cron scripts and maintenance jobs report their runs, and missing reports are escalated immediately. A dedicated project with team members and notification channels can be set up per client or project.

    At mittwald, **Healthchecks** runs as a self-hosted container in German data centres; check data and contact channels stay under the agency's control and are not transmitted to external SaaS providers, simplifying GDPR compliance. This template includes Healthchecks with PostgreSQL and connects an SMTP service for notifications and sign-in — with no usage-based licence or seat costs.
developer: SIA Monkey See Monkey Do
website: https://healthchecks.io
repository: https://github.com/healthchecks/healthchecks
license:
  name: BSD-3-Clause
  link: https://spdx.org/licenses/BSD-3-Clause.html
categories:
  - monitoring
screenshots:
  - bg: background.jpg
    screenshot: screenshot-checks.png
    text:
      de: Überwachte Cronjobs mit Ping-URL, Zeitplan und letztem Signal
      en: Monitored cron jobs with ping URL, schedule and last signal
  - bg: background.jpg
    screenshot: screenshot-check-detail.png
    text:
      de: Verlauf eines Checks mit allen eingegangenen Signalen
      en: History of a check with every signal it received
  - bg: background.jpg
    screenshot: screenshot-notification-provider.png
    text:
      de: Benachrichtigungen an E-Mail, Chat, Webhook oder Pager
      en: Notifications to email, chat, webhook or pager services
domains:
  main:
    userInput: HOST
    service: healthchecks
    port: 8000
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "domain", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_EMAIL"
    label:
      de: Admin E-Mail-Adresse
      en: Admin email address
    positionMeta: { step: "adminUser", index: 1 }
    defaultValue: "${user.email}"
    format: "email"
    required: true
    validationSchema: '{ "type": "string", "minLength": 1, "format": "email" }'
  - name: "ADMIN_PASSWORD"
    label:
      de: Admin Passwort
      en: Admin password
    positionMeta: { step: "adminUser", index: 2 }
    format: "password"
    required: true
    validationSchema: '{ "type": "string", "minLength": 12, "format": "password" }'
  - name: "SMTP_FROM"
    label:
      de: Absenderadresse
      en: Sender address
    positionMeta: { step: "common", index: 1 }
    defaultValue: "${user.email}"
    format: "email"
    required: true
    validationSchema: '{ "type": "string", "format": "email" }'
systemInputs:
  - name: "SECRET_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 50
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

deliveryBoxes:
  - purpose: main
help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Admin E-Mail-Adresse
      en: Admin email address
    value: ${healthchecks.env.SUPERUSER_EMAIL}
  - key:
      de: Admin Passwort
      en: Admin password
    value: ${healthchecks.env.SUPERUSER_PASSWORD}
  alerts:
  - status: info
    heading:
      de: Registrierung ist geschlossen
      en: Registration is closed
    content:
      de: Das Administratorkonto wird beim ersten Start mit den oben angezeigten Zugangsdaten angelegt. Weitere Konten entstehen nicht durch Selbstregistrierung, sondern über Team-Einladungen in den Projekteinstellungen oder über die Django-Verwaltung unter `/admin/`. Öffnen lässt sich die Registrierung über die Umgebungsvariable `REGISTRATION_OPEN`.
      en: The administrator account is created on first start using the credentials shown above. Further accounts are not created by self-registration but through team invitations in the project settings or via the Django administration at `/admin/`. Registration can be opened up through the `REGISTRATION_OPEN` environment variable.
