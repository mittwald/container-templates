manifestVersion: 1.0
name: rallly
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Terminplanung und Abstimmungen
  en: Open-source scheduling and polls
description:
  de: Rallly ist eine Open-Source Alternative zu Doodle für Terminplanung und Gruppenabstimmungen. Einfach Termine vorschlagen und abstimmen lassen.
  en: Rallly is an open-source alternative to Doodle for scheduling and group polls. Simply propose dates and let participants vote.
developer: Luke Vella
website: https://rallly.co
repository: https://github.com/lukevella/rallly
license: AGPL-3.0
categories:
  - productivity
domains:
  - userInput: HOST
    service: rallly
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
