services:
  rallly:
    image: lukevella/rallly:4
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
      - NEXT_PUBLIC_BASE_URL=https://${HOST}
      - DATABASE_URL=postgres://rallly:${POSTGRES_PASSWORD}@postgres:5432/rallly
      - SECRET_PASSWORD=${SECRET_PASSWORD}
      - SUPPORT_EMAIL=${SMTP_FROM}
      - NOREPLY_EMAIL=${SMTP_FROM}
      - NOREPLY_EMAIL_NAME=Rallly
      - INITIAL_ADMIN_EMAIL=${ADMIN_EMAIL}
      - SMTP_HOST=mail.agenturserver.de
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=${MW_DELIVERYBOX_MAIN_USERNAME}
      - SMTP_PWD=${MW_DELIVERYBOX_MAIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=rallly
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=rallly
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/postgresql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { pg_dumpall -h localhost -U "$$POSTGRES_USER" -f "$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  postgres_data:
