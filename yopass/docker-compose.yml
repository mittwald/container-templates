services:
  yopass:
    image: jhaals/yopass
    ports:
      - "1337:1337"
    environment:
      - TZ=Europe/Berlin
      - PORT=1337
      - DATABASE=redis
      - REDIS=redis://redis:6379/0
    depends_on:
      - redis
  redis:
    image: redis:8-alpine
    environment:
      - TZ=Europe/Berlin
