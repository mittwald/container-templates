manifestVersion: 1.0
name: listmonk
version: "latest"
icon: icon.svg
tagline:
  de: Newsletter und Mailing-Listen
  en: Newsletter and mailing lists
description:
  de: Listmonk ist ein leistungsstarker, selbst gehosteter Newsletter- und Mailing-Listen-Manager mit Vorlagen, Segmentierung und Analytics. Dieses Template enthält Listmonk mit PostgreSQL-Backend.
  en: Listmonk is a powerful, self-hosted newsletter and mailing list manager with templates, segmentation and analytics. This template includes Listmonk with a PostgreSQL backend.
developer: Kailash Nadh
website: https://listmonk.app
repository: https://github.com/knadh/listmonk
license: AGPL-3.0
categories:
  - communication
domains:
  - userInput: HOST
    service: listmonk
    port: 9000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_USER"
    positionMeta: { step: "common", index: 2 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 3 }'
  - name: "ADMIN_PASSWORD"
    positionMeta: { step: "common", index: 3 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 8 }'
systemInputs:
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
