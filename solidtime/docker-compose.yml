services:
  init:
    image: solidtime/solidtime:latest
    user: "1000:1000"
    command:
      - sh
      - -c
      - "php artisan migrate --force && (test -f storage/oauth-private.key || php artisan passport:keys --force)"
    environment:
      - TZ=Europe/Berlin
      - APP_NAME=solidtime
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://${HOST}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - DB_DATABASE=solidtime
      - DB_USERNAME=solidtime
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_CONNECTION=database
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  app:
    image: solidtime/solidtime:latest
    user: "1000:1000"
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Berlin
      - CONTAINER_MODE=http
      - APP_NAME=solidtime
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://${HOST}
      - APP_FORCE_HTTPS=true
      - TRUSTED_PROXIES=*
      - APP_KEY=${APP_KEY}
      - APP_ENABLE_REGISTRATION=true
      - SUPER_ADMINS=${SUPER_ADMIN_EMAIL}
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=warning
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - DB_DATABASE=solidtime
      - DB_USERNAME=solidtime
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_CONNECTION=database
      - FILESYSTEM_DISK=local
      - PUBLIC_FILESYSTEM_DISK=public
      - GOTENBERG_URL=http://gotenberg:3000
      - MAIL_MAILER=smtp
      - MAIL_HOST=${SMTP_HOST}
      - MAIL_PORT=${SMTP_PORT}
      - MAIL_ENCRYPTION=tls
      - MAIL_USERNAME=${SMTP_USER}
      - MAIL_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_ADDRESS=${SMTP_FROM}
      - MAIL_FROM_NAME=solidtime
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health-check/up"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      database:
        condition: service_healthy
      init:
        condition: service_completed_successfully
  scheduler:
    image: solidtime/solidtime:latest
    user: "1000:1000"
    environment:
      - TZ=Europe/Berlin
      - CONTAINER_MODE=scheduler
      - APP_NAME=solidtime
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://${HOST}
      - APP_KEY=${APP_KEY}
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=warning
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - DB_DATABASE=solidtime
      - DB_USERNAME=solidtime
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_CONNECTION=database
      - GOTENBERG_URL=http://gotenberg:3000
      - MAIL_MAILER=smtp
      - MAIL_HOST=${SMTP_HOST}
      - MAIL_PORT=${SMTP_PORT}
      - MAIL_ENCRYPTION=tls
      - MAIL_USERNAME=${SMTP_USER}
      - MAIL_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_ADDRESS=${SMTP_FROM}
      - MAIL_FROM_NAME=solidtime
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      init:
        condition: service_completed_successfully
  queue:
    image: solidtime/solidtime:latest
    user: "1000:1000"
    environment:
      - TZ=Europe/Berlin
      - CONTAINER_MODE=worker
      - WORKER_COMMAND=php /var/www/html/artisan queue:work
      - APP_NAME=solidtime
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://${HOST}
      - APP_KEY=${APP_KEY}
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=warning
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - DB_DATABASE=solidtime
      - DB_USERNAME=solidtime
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_CONNECTION=database
      - GOTENBERG_URL=http://gotenberg:3000
      - MAIL_MAILER=smtp
      - MAIL_HOST=${SMTP_HOST}
      - MAIL_PORT=${SMTP_PORT}
      - MAIL_ENCRYPTION=tls
      - MAIL_USERNAME=${SMTP_USER}
      - MAIL_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_ADDRESS=${SMTP_FROM}
      - MAIL_FROM_NAME=solidtime
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      init:
        condition: service_completed_successfully
  gotenberg:
    image: gotenberg/gotenberg:8
    environment:
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  database:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=solidtime
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=solidtime
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dumpall -h localhost -U "$POSTGRES_USER" | gzip \
          > /var/lib/postgresql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/postgresql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  app_storage:
  postgres_data:
