manifestVersion: 1.0
name: uptime-kuma
version: "2.x.x"
icon: icon.svg
tagline:
  de: Uptime-Monitoring für Websites und Services
  en: Uptime monitoring for websites and services
description:
  de: Uptime Kuma ist ein selbst gehostetes Monitoring-Tool für Websites, APIs und Services. Mit Benachrichtigungen über verschiedene Kanäle, Statusseiten und detaillierten Antwortzeit-Statistiken. Dieses Template enthält Uptime Kuma mit MariaDB-Backend.
  en: Uptime Kuma is a self-hosted monitoring tool for websites, APIs and services. With notifications via various channels, status pages and detailed response time statistics. This template includes Uptime Kuma with a MariaDB backend.
developer: Louis Lam
website: https://uptime.kuma.pet
repository: https://github.com/louislam/uptime-kuma
license: MIT
categories:
  - monitoring
domains:
  - userInput: HOST
    service: uptime-kuma
    port: 3001
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "MARIADB_ROOT_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
  - name: "MARIADB_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
