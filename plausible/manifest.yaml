manifestVersion: 1.0
name: plausible
version: "latest"
icon: icon.svg
tagline:
  de: Datenschutzfreundliche Web-Analytics
  en: Privacy-friendly web analytics
description:
  de: Plausible Analytics ist eine datenschutzfreundliche, selbst gehostete Web-Analytics-Lösung. Eine leichtgewichtige Alternative zu Google Analytics, die keine Cookies verwendet und vollständig DSGVO-konform ist. Dieses Template enthält Plausible mit PostgreSQL und ClickHouse.
  en: Plausible Analytics is a privacy-friendly, self-hosted web analytics solution. A lightweight alternative to Google Analytics that does not use cookies and is fully GDPR compliant. This template includes Plausible with PostgreSQL and ClickHouse.
developer: Plausible Insights OÜ
website: https://plausible.io
repository: https://github.com/plausible/analytics
license: AGPL-3.0
categories:
  - monitoring
domains:
  - userInput: HOST
    service: plausible
    port: 8000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_KEY_BASE"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 64
  - name: "TOTP_VAULT_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
