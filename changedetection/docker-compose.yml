services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/Berlin
      - LC_ALL=de_DE.UTF-8
      - PLAYWRIGHT_DRIVER_URL=ws://browser:3000
      - BASE_URL=https://${HOST}
    depends_on:
      - browser
    volumes:
      - changedetection_data:/datastore
  browser:
    image: dgtlmoon/sockpuppetbrowser:latest
    environment:
      - TZ=Europe/Berlin
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=5
      - DEFAULT_BLOCK_ADS=true
      - DEFAULT_STEALTH=true
volumes:
  changedetection_data: