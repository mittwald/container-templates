manifestVersion: 1.0
name: penpot
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Design- und Prototyping-Plattform
  en: Open-source design and prototyping platform
description:
  de: Penpot ist eine Open-Source Design- und Prototyping-Plattform als Alternative zu Figma. Mit Echtzeit-Zusammenarbeit, SVG-nativem Design und Self-Hosting. Dieses Template enthält Penpot mit PostgreSQL und Redis.
  en: Penpot is an open-source design and prototyping platform as an alternative to Figma. With real-time collaboration, SVG-native design and self-hosting. This template includes Penpot with PostgreSQL and Redis.
developer: Penpot
website: https://penpot.app
repository: https://github.com/penpot/penpot
license: MPL-2.0
categories:
  - productivity
domains:
  - userInput: HOST
    service: penpot-frontend
    port: 80
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "PENPOT_SECRET_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
