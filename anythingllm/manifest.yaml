manifestVersion: 1.0
name: anythingllm
version: "latest"
icon: icon.svg
tagline:
  de: All-in-One KI-Desktop- und Server-Anwendung mit RAG
  en: All-in-one AI desktop and server application with RAG
description:
  de: AnythingLLM ist eine All-in-One KI-Anwendung, die beliebige Dokumente, Ressourcen oder Inhalte in Kontext umwandelt, den jedes LLM während eines Chats als Referenz nutzen kann. Mit integriertem RAG, KI-Agenten und vielen LLM- und Vektordatenbank-Integrationen.
  en: AnythingLLM is an all-in-one AI application that turns any document, resource or content into context that any LLM can use as a reference during chat. With built-in RAG, AI agents and many LLM and vector database integrations.
developer: Mintplex Labs
website: https://anythingllm.com
repository: https://github.com/Mintplex-Labs/anything-llm
license: MIT
categories:
  - ai
domains:
  - userInput: HOST
    service: anythingllm
    port: 3001
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
