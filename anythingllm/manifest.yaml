manifestVersion: 1.0
name:
  de: AnythingLLM
  en: AnythingLLM
version: "latest"
type: standalone
icon: icon.svg
tagline:
  de: All-in-One KI-Desktop- und Server-Anwendung mit RAG
  en: All-in-one AI desktop and server application with RAG
description:
  de: AnythingLLM ist eine All-in-One KI-Anwendung, die beliebige Dokumente, Ressourcen oder Inhalte in Kontext umwandelt, den jedes LLM während eines Chats als Referenz nutzen kann. Mit integriertem RAG und KI-Agenten. Dieses Template enthält AnythingLLM mit Qdrant als Vektordatenbank.
  en: AnythingLLM is an all-in-one AI application that turns any document, resource or content into context that any LLM can use as a reference during chat. With built-in RAG and AI agents. This template includes AnythingLLM with Qdrant as the vector database.
developer: Mintplex Labs
website: https://anythingllm.com
repository: https://github.com/Mintplex-Labs/anything-llm
license:
  name: MIT
  link: https://spdx.org/licenses/MIT.html
categories:
  - ai
domains:
  - userInput: HOST
    service: anythingllm
    port: 3001
    purpose: main
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "AI_API_KEY"
    positionMeta: { step: "aiHosting", index: 4 }
    required: false
    dataSource: "aiHosting.apiKey"
    validationSchema: '{ "type": "string" }'
systemInputs:
  - name: "JWT_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "SIG_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "SIG_SALT"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "AUTH_TOKEN"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "QDRANT_API_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Auth Token
      en: Auth Token
    value: ${anythingllm.env.AUTH_TOKEN}
    sensitive: true
