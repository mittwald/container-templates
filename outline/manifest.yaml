manifestVersion: 1.0
name: outline
version: "latest"
icon: icon.svg
tagline:
  de: Kollaboratives Wissensmanagement und Wiki
  en: Collaborative knowledge base and wiki
description:
  de: Outline ist eine schnelle, kollaborative Wissensmanagement-Plattform und Wiki für Teams. Mit Markdown-Unterstützung, Echtzeit-Zusammenarbeit und umfangreichen Integrationen. Dieses Template enthält Outline mit PostgreSQL und Redis.
  en: Outline is a fast, collaborative knowledge base and wiki for teams. With Markdown support, real-time collaboration and extensive integrations. This template includes Outline with PostgreSQL and Redis.
developer: General Outline, Inc.
website: https://www.getoutline.com
repository: https://github.com/outline/outline
license: BSL-1.1
categories:
  - productivity
domains:
  - userInput: HOST
    service: outline
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "SECRET_KEY"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "UTILS_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
