manifestVersion: 1.0
name: mealie
version: "latest"
icon: icon.svg
tagline:
  de: Selbst gehostete Rezeptverwaltung
  en: Self-hosted recipe manager
description:
  de: Mealie ist eine selbst gehostete Rezeptverwaltung mit automatischem Import von Rezept-Websites, Essensplanung und Einkaufslisten.
  en: Mealie is a self-hosted recipe manager with automatic import from recipe websites, meal planning and shopping lists.
developer: Mealie
website: https://mealie.io
repository: https://github.com/mealie-recipes/mealie
license: AGPL-3.0
categories:
  - productivity
domains:
  - userInput: HOST
    service: mealie
    port: 9000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
