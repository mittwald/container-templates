manifestVersion: 1.0
name: nocodb
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source Airtable-Alternative
  en: Open-source Airtable alternative
description:
  de: NocoDB verwandelt jede Datenbank in eine smarte Tabellenkalkulation. Mit Formularen, Kanban-Boards, Galerie-Ansichten und API-Zugriff ist es die ideale No-Code-Plattform für Teams. Dieses Template enthält NocoDB mit PostgreSQL und Redis.
  en: NocoDB turns any database into a smart spreadsheet. With forms, Kanban boards, gallery views and API access, it is the ideal no-code platform for teams. This template includes NocoDB with PostgreSQL and Redis.
developer: NocoDB
website: https://nocodb.com
repository: https://github.com/nocodb/nocodb
license: AGPL-3.0
categories:
  - productivity
domains:
  - userInput: HOST
    service: nocodb
    port: 8080
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "NC_AUTH_JWT_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1
