manifestVersion: 1.0
name:
  de: Stirling-PDF
  en: Stirling-PDF
version: "latest"
type: standalone
tagline:
  de: Umfangreicher PDF-Werkzeugkasten
  en: Comprehensive PDF toolkit
description:
  de: |
    **Stirling-PDF** ist eine umfangreiche, self-hosted Plattform zum Bearbeiten und Automatisieren von PDF-Dokumenten. Sie ist eine Alternative zu Desktop- und Cloud-Angeboten wie Adobe Acrobat oder Smallpdf und verarbeitet hochgeladene Dateien innerhalb der eigenen Infrastruktur statt bei einem externen Dokumentendienst.

    Zentrale Funktionen:

    - PDF-Dateien zusammenführen, teilen, drehen, sortieren und komprimieren
    - Dokumente konvertieren, per OCR erkennen und mit Wasserzeichen versehen
    - Inhalte schwärzen, signieren, schützen und Metadaten bearbeiten
    - Dateibibliothek auf dem Server, Text- und Formular-Editor
    - Stapelverarbeitung über den PDF Processor, frei bis 1.000 PDFs pro Monat

    Für **Agenturen** deckt Stirling-PDF viele Arbeitsschritte rund um Angebote, Verträge, Präsentationen und Druckunterlagen über eine gemeinsame Oberfläche ab. Teams können Dokumente für Kunden zusammenstellen, sensible Inhalte schwärzen oder Scans durchsuchbar machen, ohne für jede Aufgabe einen separaten Dienst zu verwenden. Der aktivierte Login schützt die Oberfläche vor unberechtigtem Zugriff.

    Bei mittwald läuft **Stirling-PDF** als self-hosted Container in deutschen Rechenzentren; verarbeitete Kundendokumente müssen die eigene Infrastruktur nicht verlassen. Das Template aktiviert die integrierte Anmeldung mit individuell vergebenen Zugangsdaten, setzt Deutsch als Standardsprache und deaktiviert Suchmaschinen-Sichtbarkeit sowie Umfragen. OCR-Daten, Konfiguration, Protokolle, Anpassungen, Pipelines und die Dateibibliothek werden in persistenten Volumes gespeichert. Die Bearbeitung im PDF Editor ist kostenlos und unbegrenzt; der Free-Plan umfasst bis zu 5 Benutzerkonten, automatisierte Verarbeitung über Processor, API und KI zählt gegen ein monatliches Kontingent von 1.000 PDFs.
  en: |
    **Stirling-PDF** is a comprehensive, self-hosted platform for editing and automating PDF documents. It is an alternative to desktop and cloud products such as Adobe Acrobat or Smallpdf, processing uploaded files within the operator's own infrastructure rather than through an external document service.

    Key features:

    - Merge, split, rotate, reorder and compress PDF files
    - Convert documents, perform OCR and add watermarks
    - Redact, sign and protect content, and edit metadata
    - Server-side file library, text and form editor
    - Batch processing via the PDF Processor, free for up to 1,000 PDFs per month

    For **agencies**, Stirling-PDF covers many tasks involving proposals, contracts, presentations and print documents in a single interface. Teams assemble client documents, redact confidential content and make scans searchable without using a separate service for every operation. Enabled authentication protects the interface from unauthorised access.

    At mittwald, **Stirling-PDF** runs as a self-hosted container in German data centres; processed client documents do not need to leave the operator's infrastructure. The template enables built-in authentication with custom credentials, sets German as the default language and disables search-engine visibility and surveys. OCR data, configuration, logs, customisations, pipelines and the file library are stored in persistent volumes. Editing in the PDF Editor is free and unlimited; the free plan covers up to 5 user accounts, and automated processing through Processor, API and AI counts against a monthly allowance of 1,000 PDFs.
developer: Stirling PDF Inc.
website: https://stirling.com
repository: https://github.com/Stirling-Tools/Stirling-PDF
license:
  name: MIT (Open Core)
  link: https://github.com/Stirling-Tools/Stirling-PDF/blob/main/LICENSE
categories:
  - productivity
screenshots:
  - bg: background.jpg
    screenshot: screenshot-overview-dashboard.png
    text:
      de: Werkzeuge für Umwandeln, Signieren, Schwärzen und Prüfen
      en: Tools for converting, signing, redacting and verifying
  - bg: background.jpg
    screenshot: screenshot-pdf-viewer.png
    text:
      de: Mehrere PDFs laden und Seite für Seite durchsehen
      en: Load several PDFs and review them page by page
domains:
  main:
    userInput: HOST
    service: stirling-pdf
    port: 8080
userInputs:
  - name: "HOST"
    label:
      de: Domain
      en: Domain
    positionMeta: { step: "domain", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_USER"
    label:
      de: Admin Benutzername
      en: Admin username
    positionMeta: { step: "adminUser", index: 1 }
    defaultValue: "${user.username}"
    required: true
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_PASSWORD"
    label:
      de: Admin Passwort
      en: Admin password
    positionMeta: { step: "adminUser", index: 2 }
    required: true
    format: password
    validationSchema: '{ "type": "string", "minLength": 12 }'
  - name: "SMTP_FROM"
    label:
      de: Absenderadresse
      en: Sender address
    positionMeta: { step: "common", index: 1 }
    defaultValue: "${user.email}"
    required: true
    format: email
    validationSchema: '{ "type": "string", "format": "email" }'

deliveryBoxes:
  - purpose: main

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Admin Benutzername
      en: Admin username
    value: ${stirling-pdf.env.SECURITY_INITIALLOGIN_USERNAME}
  - key:
      de: Admin Passwort
      en: Admin password
    value: ${stirling-pdf.env.SECURITY_INITIALLOGIN_PASSWORD}
  alerts:
  - status: info
    heading:
      de: Kostenloser Plan
      en: Free plan
    content:
      de: Ohne Lizenzschlüssel gilt der Free-Plan von Stirling-PDF. Er erlaubt bis zu 5 Benutzerkonten. Die Bearbeitung im PDF Editor ist unbegrenzt, automatisierte Verarbeitung über PDF Processor, API mit API-Key und KI-Funktionen ist auf 1.000 PDFs pro Monat begrenzt. Mehr Nutzer oder ein höheres Kontingent erfordern einen Lizenzschlüssel von Stirling PDF.
      en: Without a licence key, the Stirling-PDF free plan applies. It allows up to 5 user accounts. Editing in the PDF Editor is unlimited, while automated processing through PDF Processor, API with an API key and AI features is limited to 1,000 PDFs per month. More users or a higher allowance require a licence key from Stirling PDF.
