services:
  neofire:
    image: ghcr.io/neofire-core-system/core:1
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Berlin
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=neofire
      - DB_USER=neofire
      - DB_PASS=${DB_PASSWORD}
      # The first start runs the setup with these values; later starts skip it.
      - SHOP_URL=https://${HOST}
      - SHOP_NAME=${SHOP_NAME}
      - SHOP_EMAIL=${SHOP_EMAIL}
      - COMPANY=${COMPANY}
      - STREET=${STREET}
      - POSTCODE=${POSTCODE}
      - CITY=${CITY}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASS=${ADMIN_PASSWORD}
      - ACCEPT_TERMS=${ACCEPT_TERMS}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - neofire_data:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/robots.txt"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3m
      start_interval: 5s
  mariadb:
    image: mariadb:lts
    environment:
      - TZ=Europe/Berlin
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=neofire
      - MARIADB_USER=neofire
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      # The MariaDB entrypoint unsets MARIADB_*PASSWORD before starting the
      # server, so the backup command needs its own copy of the password.
      - BACKUP_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      backup.command: >-
        sh -lc 'set -e; d=/var/lib/mysql/backups; mkdir -p "$$d";
        f=$$d/backup_$$(date +%F_%H%M%S).sql;
        { MYSQL_PWD="$$BACKUP_PASSWORD" mariadb-dump -u root --all-databases --routines --events --single-transaction --result-file="$$f"; } || { rm -f "$$f"; exit 1; };
        gzip "$$f";
        find "$$d" -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  neofire_data:
  mariadb_data:
