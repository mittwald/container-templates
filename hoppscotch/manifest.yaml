manifestVersion: 1.0
name: hoppscotch
version: "latest"
icon: icon.svg
tagline:
  de: Open-Source API-Entwicklungsplattform
  en: Open-source API development platform
description:
  de: Hoppscotch ist eine leichtgewichtige Open-Source API-Entwicklungsplattform zum Testen von REST, GraphQL und WebSocket APIs direkt im Browser.
  en: Hoppscotch is a lightweight open-source API development platform for testing REST, GraphQL and WebSocket APIs right in the browser.
developer: Hoppscotch
website: https://hoppscotch.io
repository: https://github.com/hoppscotch/hoppscotch
license: MIT
categories:
  - development
domains:
  - userInput: HOST
    service: hoppscotch
    port: 3000
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
