services:
  hoppscotch:
    image: hoppscotch/hoppscotch:2026.6.1
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Berlin
      - DATABASE_URL=postgresql://hoppscotch:${POSTGRES_PASSWORD}@postgres:5432/hoppscotch
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - WHITELISTED_ORIGINS=https://${HOST}
      - TRUST_PROXY=true
      - VITE_BASE_URL=https://${HOST}
      - VITE_SHORTCODE_BASE_URL=https://${HOST}
      - VITE_ADMIN_URL=https://${HOST}/admin
      - VITE_BACKEND_GQL_URL=https://${HOST}/backend/graphql
      - VITE_BACKEND_WS_URL=wss://${HOST}/backend/graphql
      - VITE_BACKEND_API_URL=https://${HOST}/backend/v1
      - ENABLE_SUBPATH_BASED_ACCESS=true
    command:
      - sh
      - -c
      - pnpm exec prisma migrate deploy && node /usr/src/app/aio_run.mjs
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    environment:
      - TZ=Europe/Berlin
      - POSTGRES_USER=hoppscotch
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=hoppscotch
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoppscotch -d hoppscotch"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      backup.command: >-
        sh -lc 'mkdir -p /var/lib/postgresql/backups && \
        pg_dumpall -h localhost -U "$POSTGRES_USER" | gzip \
          > /var/lib/postgresql/backups/backup_$(date +%F_%H%M%S).sql.gz; \
        find /var/lib/postgresql/backups -name "backup_*.sql.gz" -type f -mtime +7 -delete'
volumes:
  postgres_data:
