manifestVersion: 1.0
name:
  de: Euro-Office
  en: Euro-Office
version: "latest"
type: component
tagline:
  de: Europäischer Online-Dokumentenserver
  en: European online document server
description:
  de: Euro-Office ist ein quelloffener Online-Dokumentenserver und europäischer Fork von ONLYOFFICE. Er ermöglicht die kollaborative Bearbeitung von Text-, Tabellen- und Präsentationsdokumenten im Browser und lässt sich in Plattformen wie Nextcloud integrieren.
  en: Euro-Office is an open-source online document server and European fork of ONLYOFFICE. It enables collaborative editing of text, spreadsheet and presentation documents in the browser and integrates with platforms such as Nextcloud.
developer: Euro-Office
website: https://euro-office.github.io
repository: https://github.com/Euro-Office/DocumentServer
license:
  name: AGPL-3.0
  link: https://spdx.org/licenses/AGPL-3.0.html
categories:
  - productivity
domains:
  - userInput: HOST
    service: euro-office
    port: 80
    purpose: main
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
systemInputs:
  - name: "JWT_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: JWT-Secret
      en: JWT Secret
    value: ${euro-office.env.JWT_SECRET}
  alerts:
  - status: info
    heading:
      de: JWT-Secret für die Integration erforderlich
      en: JWT secret required for integration
    content:
      de: Um Euro-Office in eine Anwendung (z. B. Nextcloud) einzubinden, hinterlege die Document-Server-URL zusammen mit dem JWT-Secret aus der Konfigurationsübersicht.
      en: To embed Euro-Office in an application (e.g. Nextcloud), configure the document server URL together with the JWT secret shown in the configuration overview.
