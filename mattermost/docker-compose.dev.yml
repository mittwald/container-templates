services:
  mattermost:
    # Mattermost publishes amd64-only images; force the platform for local
    # testing on arm64 hosts. Not used in production deployments.
    platform: linux/amd64
    environment:
      MM_EMAILSETTINGS_SMTPSERVER: ct-mail
      MM_EMAILSETTINGS_SMTPPORT: "1025"
      MM_EMAILSETTINGS_CONNECTIONSECURITY: ""
      MM_EMAILSETTINGS_ENABLESMTPAUTH: "false"
      MM_EMAILSETTINGS_SMTPUSERNAME: ""
      MM_EMAILSETTINGS_SMTPPASSWORD: ""
