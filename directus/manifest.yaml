manifestVersion: 1.0
name:
  de: Directus
  en: Directus
version: "11.x.x"
type: standalone
tagline:
  de: Headless CMS und Datenplattform
  en: Headless CMS and data platform
description:
  de: |
    **Directus** ist eine Open-Source-Datenplattform und ein Headless CMS, das jede SQL-Datenbank in eine strukturierte REST- und GraphQL-API sowie ein benutzerfreundliches Admin-Interface verwandelt. Es ist eine self-hosted Alternative zu gehosteten Headless-CMS-Diensten wie Contentful oder Strapi Cloud und eignet sich als Content-Backend für Websites, Apps und digitale Produkte aller Art.

    Zentrale Funktionen:

    - REST- und GraphQL-API auf Basis beliebiger SQL-Datenbanken (PostgreSQL, MySQL, SQLite u. a.)
    - Visueller Datenmodellierungseditor ohne SQL-Kenntnisse
    - Granulares Rollen- und Berechtigungsmodell auf Feld- und Zeilenebene
    - Echtzeit-Subscriptions, Webhooks und Flows für Automatisierungen

    Für **Agenturen** ist Directus ein flexibles Content-Backend für Kundenprojekte: Die API-first-Architektur erlaubt die Anbindung beliebiger Frontends und Frameworks – ob Website, Mobile App oder Digital-Signage-System. Agenturen können für jeden Kunden ein eigenes Datenmodell anlegen, separate Zugriffsrechte für Redakteure und Entwickler einrichten und Inhalte über die API in mehrere Kanäle ausspielen.

    Bei mittwald läuft **Directus** als self-hosted Container in deutschen Rechenzentren; Inhalte und Kundendaten verbleiben vollständig im Einflussbereich der Agentur und werden nicht an Drittanbieter übertragen, was die DSGVO-Konformität vereinfacht. Dieses Template enthält Directus zusammen mit einer PostgreSQL-Datenbank und Redis für Caching – ohne nutzungsabhängige Seat- oder API-Lizenzkosten.
  en: |
    **Directus** is an open-source headless CMS and data platform that transforms any SQL database into a REST and GraphQL API with an admin interface. A self-hosted alternative to managed services like Contentful or Strapi Cloud, it serves as a content backend for websites, apps and digital products.

    Key features:

    - REST and GraphQL API on top of any SQL database (PostgreSQL, MySQL, SQLite and more)
    - Visual data modelling editor without SQL knowledge
    - Granular role and permission model at field and row level
    - Real-time subscriptions, webhooks and flows for automation

    For **agencies**, Directus is a flexible content backend for client projects: the API-first architecture connects any frontend — website, mobile app or digital signage. Separate data models and access rights can be configured per client, with content deliverable to multiple channels via the API.

    At mittwald, **Directus** runs as a self-hosted container in German data centres; content and client data stay fully under the agency's control and are not transmitted to third parties, simplifying GDPR compliance. This template includes Directus with PostgreSQL and Redis — without usage-based seat or API licence costs.
developer: Monospace Inc.
website: https://directus.io
repository: https://github.com/directus/directus
support: https://directus.io/support/
license:
  name: BSL-1.1
  link: https://spdx.org/licenses/BUSL-1.1.html
categories:
  - development
domains:
  - userInput: HOST
    service: directus
    port: 8055
    purpose: main
userInputs:
  - name: "HOST"
    positionMeta: { step: "common", index: 1 }
    required: true
    dataSource: "ingress.paths"
    validationSchema: '{ "type": "string", "minLength": 1 }'
  - name: "ADMIN_EMAIL"
    positionMeta: { step: "common", index: 2 }
    required: true
    validationSchema: '{ "type": "string", "format": "email" }'
  - name: "ADMIN_PASSWORD"
    positionMeta: { step: "common", index: 3 }
    required: true
    validationSchema: '{ "type": "string", "minLength": 8 }'
systemInputs:
  - name: "DIRECTUS_SECRET"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 32
  - name: "POSTGRES_PASSWORD"
    schema:
      kind: 1
      schema:
        - ruleType: length
          min: 12
        - identifier: numbers
          ruleType: charPool
          charPools:
            - numbers
          min: 1
        - ruleType: regex
          pattern: "[A-Z]"
          min: 1
        - ruleType: regex
          pattern: "[a-z]"
          min: 1

help:
  technicalDetails:
  - key:
      de: Domain
      en: Domain
    value: https://${domain.main}
  - key:
      de: Admin E-Mail-Adresse
      en: Admin email address
    value: ${directus.env.ADMIN_EMAIL}
  - key:
      de: Admin Passwort
      en: Admin Password
    value: ${directus.env.ADMIN_PASSWORD}
